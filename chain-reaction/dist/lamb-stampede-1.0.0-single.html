    const items = [...STRINGS.privacy];
    if (CONFIG.counter.enabled) items.splice(1, 0, STRINGS.privacyCounter);
    el.innerHTML = `<div class="sheet-card privacy"><h2>Privacy</h2>${items.map(([t, b]) => `<h3>${esc(t)}</h3><p>${esc(b).replace("{contact}", `<a href="mailto:${esc(CONFIG.contactEmail)}">${esc(CONFIG.contactEmail)}</a>`)}</p>`).join("")}
      <button class="btn primary" id="pv-close"><span>Close</span></button></div>`;
    $("pv-close").onclick = () => Nav.back();
  },
});
Nav.define("whatsnew", {
  sheet: true,
  render(el) {
    el.innerHTML = `<div class="sheet-card"><h2>What's New</h2>${STRINGS.whatsNew.map(([v, title, list]) => `<h3>${esc(title)} <small>${esc(v)}</small></h3><ul>${list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}
      <button class="btn primary" id="wn-close"><span>Hallelujah!</span></button></div>`;
    $("wn-close").onclick = () => Nav.back();
    Save.profile.whatsNewSeen = CONFIG.version;
    Save.save();
  },
});

// ---------- DEVELOPER MODE (tap the version 7 times) ----------
Nav.define("dev", {
  render(el) {
    const d = Save.data.dev;
    const set = (k, v) => {
      d[k] = v;
      Save.save();
      Nav.refresh();
    };
    el.replaceChildren(UI.header("Developer"));
    const page = UI.h("div", { class: "page settings" });
    const date = UI.h("input", { type: "date", value: d.date || Dates.key(new Date()) });
    date.onchange = () => set("date", date.value);
    page.append(
      UI.row("Unlock everything", UI.toggle(d.unlockAll, (v) => set("unlockAll", v), "Unlock everything")),
      UI.row("Unlimited wool", UI.toggle(d.wool, (v) => set("wool", v), "Unlimited wool")),
      UI.row("Pretend date", date, d.date ? "Set" : "Today"),
      UI.row("Clear date", UI.btn("Today", () => set("date", ""), "small")),
      UI.row("Season", UI.seg([["", "Auto"], ["none", "None"], ["christmas", "Christmas"], ["easter", "Easter"]], d.season, (v) => set("season", v))),
      UI.row("FPS meter", UI.toggle(d.fps, (v) => { set("fps", v); Pwa.fpsMeter(); }, "FPS meter")),
      UI.row("First Steps again", UI.btn("Reset", () => { Save.profile.firstSteps = false; Save.profile.tips = {}; Save.profile.hints = { validShown: 0, validLearned: false, pulseLearned: false }; Save.save(); UI.toast("Tutorials reset"); }, "small")),
      UI.row("Add 500 wool", UI.btn("+500", () => { Progress.addWool(500); UI.toast("+500 wool"); }, "small")),
      UI.row("Add a level", UI.btn("+1", () => { Progress.addXp(CONFIG.levelXp(Save.profile.level) - Save.profile.xp); UI.toast(`Level ${Save.profile.level}`); }, "small")),
      UI.h("h3", { class: "sub" }, "Error log (this device only)"),
      UI.h("pre", { class: "log" }, ErrorLog.text()),
      UI.h("div", { class: "two" }, UI.btn("Copy log", () => navigator.clipboard?.writeText(ErrorLog.text()).then(() => UI.toast(STRINGS.backup.copied)), ""), UI.btn("Clear log", () => { Save.data.errors.length = 0; Save.save(); Nav.refresh(); }, "")),
      UI.row("Developer mode", UI.btn("Turn off", () => { set("on", false); Nav.back(); }, "small danger")),
    );
    el.append(page);
  },
});

// ---------- small sheets ----------
Nav.define("confirm", {
  sheet: true,
  render(el, p) {
    el.innerHTML = `<div class="sheet-card"><h2>${esc(p.text)}</h2>${p.sub ? `<p>${esc(p.sub)}</p>` : ""}
      <button class="btn ${p.danger ? "danger" : "primary"} big" id="cf-yes"><span>${esc(p.yes)}</span></button>
      <button class="btn big" id="cf-no"><span>${esc(p.no)}</span></button></div>`;
    $("cf-yes").onclick = () => {
      Nav.close("confirm");
      p.done(true);
    };
    $("cf-no").onclick = () => {
      Nav.close("confirm");
      p.done(false);
    };
    p.answered = false;
  },
  onBack() {
    const p = Nav.top.params;
    Nav.close("confirm");
    p.done(false);
    return true;
  },
});
Nav.define("rename", {
  sheet: true,
  render(el, p) {
    el.innerHTML = `<div class="sheet-card"><h2>Name</h2><input id="rn-in" maxlength="12" autocomplete="off" value="${esc(p.value)}" autofocus>
      <button class="btn primary big" id="rn-ok">${Icons.get("check")}<span>Done</span></button></div>`;
    const ok = () => {
      p.done($("rn-in").value);
      Nav.back();
    };
    $("rn-ok").onclick = ok;
    $("rn-in").onkeydown = (e) => e.key === "Enter" && ok();
  },
});
Nav.define("installios", {
  sheet: true,
  render(el) {
    const steps = STRINGS.installIos;
    const pics = [Icons.get("share"), `<span class="plus-box">${Icons.get("plus")}</span>`, `<canvas id="ios-lamb"></canvas>`];
    el.innerHTML = `<div class="sheet-card"><h2>Put the lamb on your phone</h2><ol class="ios">${steps.map((s, k) => `<li><i>${pics[k]}</i><span>${esc(s)}</span></li>`).join("")}</ol>
      <button class="btn primary" id="ios-ok"><span>Got it</span></button></div>`;
    requestAnimationFrame(() => Art.drawLamb(Art.sharp($("ios-lamb"), 40, 40), 20, 24, 32, { look: Progress.look() }));
    $("ios-ok").onclick = () => Nav.back();
  },
});

</script>
<script>
// ============================== APP ==============================
// The shell around the modes: Home, Play, setup, the game screen, pause, results, Daily.
// Other screens live in screens.js; sharing, Join the Flock and the PWA in share.js / pwa.js.
const App = (() => {
  const { h } = UI;
  // the nine modes, in their groups. file = js/modes/<file>.js
  const MODES = [
    { key: "stampede", file: "stampede", title: "Stampede+", group: "together", players: "1–4", icon: "bolt" },
    { key: "lostlamb", file: "lostlamb", title: "Lost Lamb", group: "together", players: "1–4", icon: "heart" },
    { key: "bridge", file: "bridge", title: "Bridge", group: "together", players: "2 or 4", icon: "bridge" },
    { key: "flockfall", file: "flockfall", title: "Flock Fall", group: "together", players: "1–2", icon: "rocks" },
    { key: "wolf", file: "wolf", title: "Big Bad Wolf", group: "team", players: "1–4", icon: "wolf" },
    { key: "guard", file: "guard", title: "Guard the Fold", group: "team", players: "1–4", icon: "shield" },
    { key: "saga", file: "saga", title: "Sheep Saga", group: "solo", players: "1", icon: "star" },
    { key: "rush", file: "rush", title: "Sheep Rush", group: "solo", players: "1", icon: "timer" },
    { key: "leadhome", file: "leadhome", title: "Lead Him Home", group: "solo", players: "1", icon: "crook" },
  ];
  const BUILT = new Set(["stampede", "saga", "wolf", "rush"]); // modes finished in this build
  const meta = (key) => MODES.find((m) => m.key === key);
  let hasKeyboard = false;
  const lowEnd = (navigator.hardwareConcurrency || 8) <= 4 && (navigator.deviceMemory || 4) <= 2;

  const palette = () => Art.PALETTES[Save.settings.palette] || Art.PALETTES.default;
  function musicFor(def) {
    const season = Dates.season();
    if (season === "christmas") return { song: "joyToTheWorld", style: "bright", bpm: 112 };
    if (season === "easter" && def?.key !== "saga") return { song: "sunriseGarden", style: "bright", bpm: 104 };
    return def?.music || { song: "jesusLovesMe", style: "bright", bpm: 120 };
  }
  function homeMusic() {
    const season = Dates.season();
    if (season === "christmas") Music.play("joyToTheWorld", "gentle", 96);
    else if (season === "easter") Music.play("sunriseGarden", "gentle", 88);
    else Music.play("jesusLovesMe", "gentle", 92);
    Music.setLayer(0);
  }

  // ---------- applying settings to the page ----------
  function applySettings() {
    const s = Save.settings;
    const root = document.documentElement;
    root.classList.toggle("reduced", !!s.reduced);
    root.classList.toggle("contrast", !!s.contrast);
    root.classList.toggle("bigtext", !!s.bigText);
    root.classList.toggle("fewflash", !!s.fewerFlashes);
    Sound.levels();
    Core.layout();
  }

  // ---------- HOME ----------
  let homeStop = null;
  const lamb = { mood: "happy", until: 0, jumpAt: -9, napAt: 0, lastTouch: 0 };
  Nav.define("home", {
    render(el) {
      const p = Save.profile;
      const v = Progress.verseOfDay();
      const season = Dates.season();
      const part = Dates.partOfDay();
      const last = p.lastMode && BUILT.has(p.lastMode) ? meta(p.lastMode) : null;
      const need = CONFIG.levelXp(p.level);
      const showFlock = CONFIG.flock.provider !== "none" && !p.flock.joined;
      el.innerHTML = `
        <div class="home-scene"><canvas id="home-cv"></canvas>
          <div class="home-top">
            <button class="chip" id="home-wool" aria-label="Wool">${Icons.get("wool")}<b>${fmtNum(p.wool)}</b></button>
            <button class="chip level" id="home-level" aria-label="Flock Level ${p.level}"><i class="ring" style="--p:${Math.round((p.xp / need) * 100)}"></i><b>${p.level}</b><span>${STRINGS.home.level}</span></button>
            <span class="spacer"></span>
            ${Pwa.canInstall() ? `<button class="ib" id="home-install" aria-label="${STRINGS.home.install}">${Icons.get("install")}</button>` : ""}
            ${showFlock ? `<button class="ib" id="home-flock" aria-label="${STRINGS.home.flock}">${Icons.get("mail")}</button>` : ""}
          </div>
          <div class="home-greet">${season === "christmas" ? "Merry Christmas!" : season === "easter" ? "He is risen!" : STRINGS.home.greet[part]}</div>
        </div>
        <div class="home-body">
          <h1 class="logo">${esc(CONFIG.appName)}</h1>
          <p class="tagline">${esc(STRINGS.tagline)}</p>
          ${Save.settings.verse ? `<figure class="verse-card tap" id="home-verse"><figcaption>${Icons.get("book")} ${STRINGS.home.verse}</figcaption><blockquote>${esc(v[1])}</blockquote><cite>${esc(v[0])} (KJV)</cite></figure>` : ""}
          <button class="btn primary huge" id="home-play">${Icons.get("play")}<span>${STRINGS.home.play}</span></button>
          <button class="btn quick" id="home-quick">${Icons.get("bolt")}<span>${last ? `${STRINGS.home.cont}: ${esc(last.title)}${Save.mode(last.key).progress.next ? ` · Level ${Save.mode(last.key).progress.next}` : ""}` : STRINGS.home.quick}</span></button>
          <div class="home-two">
            <button class="btn sky big" id="home-daily">${Icons.get("calendar")}<span>${STRINGS.home.daily}</span>${Progress.breadToday() ? "" : '<i class="dot"></i>'}</button>
            <button class="btn rose big" id="home-wardrobe">${Icons.get("shirt")}<span>${STRINGS.home.wardrobe}</span></button>
          </div>
          <div class="home-three">
            <button class="btn small" id="home-journal">${Icons.get("book")}<span>${STRINGS.home.journal}</span></button>
            <button class="btn small" id="home-stats">${Icons.get("chart")}<span>${STRINGS.home.stats}</span></button>
            <button class="btn small" id="home-settings">${Icons.get("gear")}<span>${STRINGS.home.settings}</span></button>
          </div>
          <p class="now-playing" id="now-playing"></p>
        </div>`;
      // the very first Play goes straight into First Steps
      $("home-play").onclick = () => (Save.profile.firstSteps || Save.profile.games ? Nav.go("play") : play("stampede"));
      $("home-quick").onclick = () => quickPlay();
      $("home-daily").onclick = () => Nav.go("daily");
      $("home-wardrobe").onclick = () => Nav.go("wardrobe");
      $("home-journal").onclick = () => Nav.go("journal");
      $("home-stats").onclick = () => Nav.go("stats");
      $("home-settings").onclick = () => Nav.go("settings");
      $("home-wool").onclick = () => Nav.go("wardrobe");
      $("home-level").onclick = () => Nav.go("stats");
      if ($("home-flock")) $("home-flock").onclick = () => Nav.go("flock");
      if ($("home-install")) $("home-install").onclick = () => Pwa.install();
      if ($("home-verse")) $("home-verse").onclick = () => Nav.go("journal");
      nowPlaying();
      const cv = $("home-cv");
      cv.addEventListener("pointerdown", (e) => tapLamb(e, cv));
      homeStop?.();
      const box = cv.parentElement.getBoundingClientRect();
      homeStop = UI.liveCanvas(cv, Math.round(box.width), Math.round(box.height), (g, t) => drawHome(g, Math.round(box.width), Math.round(box.height), t, part, season));
      lamb.lastTouch = performance.now();
    },
    onShow() {
      homeMusic();
      Pwa.idleChecks();
    },
    onHide() {
      homeStop?.();
      homeStop = null;
    },
  });
  function nowPlaying() {
    const n = $("now-playing");
    const song = Music.current;
    if (!n) return;
    n.innerHTML = song ? `${Icons.get("music")} ${STRINGS.home.nowPlaying}: <b>${esc(song.title)}</b>${song.hymn ? " (traditional hymn)" : ""}` : "";
  }
  Bus.on("music", nowPlaying);
  function tapLamb(e, cv) {
    Sound.unlock();
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    lamb.lastTouch = performance.now();
    if (Math.abs(x - 0.5) < 0.25) {
      lamb.jumpAt = performance.now() / 1000;
      lamb.mood = "joy";
      lamb.until = performance.now() + 1200;
      Sfx.bleat(1 + Math.random() * 0.2);
      buzz(10);
    }
  }
  function drawHome(g, w, hh, t, part, season) {
    Art.drawPasture(g, w, hh, { t, part, season, dpr: Math.min(2, devicePixelRatio || 1), reduced: Save.settings.reduced });
    const now = performance.now();
    const idle = now - lamb.lastTouch;
    let mood = now < lamb.until ? lamb.mood : "happy";
    // naps after a while alone (or at night), wakes up when touched
    if (idle > 25000 || (part === "night" && idle > 6000)) mood = "sleep";
    const s = Math.min(w * 0.42, hh * 0.62);
    const jt = t - lamb.jumpAt;
    const jump = jt < 0.6 && !Save.settings.reduced ? Math.sin((jt / 0.6) * Math.PI) * s * 0.25 : 0;
    const blink = mood === "happy" && t % 3.4 < 0.13;
    const x = w * 0.5;
    const y = hh * 0.8 - s * 0.32 - jump;
    Art.ellipse(g, x + s * 0.02, hh * 0.8 - s * 0.02, s * 0.36 * (1 - jump / s), s * 0.06, 0, "rgba(0,0,0,0.18)");
    Art.drawLamb(g, x, y, s, { t, mood, blink, look: Progress.look(), flip: false });
    if (season === "christmas" && part !== "day") Art.drawBethlehemStar(g, w * 0.74, hh * 0.16, Math.min(w, hh) * 0.035, t);
  }
  function quickPlay() {
    const key = Save.profile.lastMode && BUILT.has(Save.profile.lastMode) ? Save.profile.lastMode : "stampede";
    play(key);
  }

  // ---------- PLAY (mode list) ----------
  Nav.define("play", {
    render(el) {
      el.replaceChildren(UI.header(STRINGS.home.play));
      const body = h("div", { class: "page" });
      for (const [g, label, icon] of [["together", STRINGS.groups.together, "people"], ["team", STRINGS.groups.team, "shield"], ["solo", STRINGS.groups.solo, "user"]]) {
        body.append(h("h3", { class: "group", html: `${Icons.get(icon)} ${esc(label)}` }));
        const grid = h("div", { class: "cards" });
        for (const m of MODES.filter((x) => x.group === g)) grid.append(modeCard(m));
        if (g === "together") grid.append(partyCard());
        body.append(grid);
      }
      el.append(body);
    },
  });
  function bestLine(m) {
    const ms = Save.data.modes[m.key];
    if (!ms || !ms.stats.played) return "Not played yet";
    const r = ms.records;
    if (ms.progress.next) return `Level ${ms.progress.next} · ${(ms.progress.stars || []).reduce((a, b) => a + (b || 0), 0)} stars`;
    if (r.score) return `Best ${fmtNum(r.score)}`;
    return `Best chain ×${r.chain || 0} · ${ms.stats.wins} win${ms.stats.wins === 1 ? "" : "s"}`;
  }
  function modeCard(m) {
    const built = BUILT.has(m.key);
    const cv = h("canvas", { class: "card-art" });
    const card = h("div", { class: `mode-card${built ? "" : " soon"}` },
      cv,
      h("div", { class: "mc-text" }, h("b", {}, m.title), h("small", { html: `${Icons.get("people")} ${m.players}` }), h("small", { class: "best" }, built ? bestLine(m) : "Coming soon")),
      built ? h("button", { class: "mc-play", "aria-label": `Play ${m.title} now`, onclick: (e) => { e.stopPropagation(); play(m.key); }, html: Icons.get("play") }) : null);
    card.addEventListener("click", () => {
      if (!built) return UI.toast(`${m.title} arrives in a coming update`, { icon: "sparkle" });
      Sfx.tap();
      openSetup(m.key);
    });
    requestAnimationFrame(() => {
      const g = Art.sharp(cv, 96, 72);
      ModeArt.draw(g, m.key, 96, 72, 0);
    });
    return card;
  }
  function partyCard() {
    const cv = h("canvas", { class: "card-art" });
    const card = h("div", { class: "mode-card party soon" }, cv, h("div", { class: "mc-text" }, h("b", {}, STRINGS.party.name), h("small", {}, STRINGS.party.desc), h("small", { class: "best" }, "Coming soon")));
    card.addEventListener("click", () => UI.toast(`${STRINGS.party.name} arrives in a coming update`, { icon: "party" }));
    requestAnimationFrame(() => ModeArt.draw(Art.sharp(cv, 96, 72), "party", 96, 72, 0));
    return card;
  }

  // ---------- SETUP ----------
  function defaultSeat(k) {
    return { kind: k === 0 ? "human" : "ai", level: "auto", persona: Core.PERSONA_ORDER[(k + 2) % 3], color: k, name: "", assist: false, speed: 1, pen: 0, look: null };
  }
  function loadSetup(def) {
    const ms = Save.mode(def.key);
    const s = { ...(def.setupDefaults || {}), ...(ms.setup || {}) };
    s.seats = [0, 1, 2, 3].map((k) => ({ ...defaultSeat(k), ...(s.seats?.[k] && typeof s.seats[k] === "object" ? s.seats[k] : {}) }));
    return s;
  }
  function saveSetup(def, s) {
    Save.mode(def.key).setup = s;
    Save.save();
  }
  async function openSetup(key) {
    const def = await loadMode(key);
    if (def) def.open ? def.open() : Nav.go("setup", { key });
  }
  Nav.define("setup", {
    render(el, { key }) {
      const def = Modes.get(key);
      const s = loadSetup(def);
      el.replaceChildren(UI.header(def.title, { right: h("button", { class: "ib", "aria-label": "How to play", onclick: () => Nav.go("help", { key }), html: Icons.get("question") }) }));
      const page = h("div", { class: "page setup" });
      const hero = h("canvas", { class: "setup-art" });
      page.append(hero, h("p", { class: "how" }, def.how.join(" ")));
      const opts = h("div", { class: "opts" });
      page.append(opts);
      const render = () => {
        opts.replaceChildren();
        def.options?.(setupUI(def, s, opts, render), s);
      };
      render();
      page.append(h("div", { class: "setup-go" }, UI.btn(def.playLabel?.(s) ?? STRINGS.home.play, () => {
        saveSetup(def, s);
        play(key, s);
      }, "primary huge", "play")));
      el.append(page);
      requestAnimationFrame(() => {
        const w = Math.min(320, page.clientWidth - 32);
        const g = Art.sharp(hero, w, 110);
        ModeArt.draw(g, key, w, 110, 0, true);
      });
    },
  });
  // the controls a mode's options() uses
  function setupUI(def, s, box, rerender) {
    const changed = () => {
      saveSetup(def, s);
      rerender();
    };
    const add = (n) => (box.append(n), n);
    return {
      seg: (label, k, options, sub) => add(UI.row(label, UI.seg(options, s[k], (v) => { s[k] = v; changed(); }), sub)),
      stepper: (label, k, min, max, fmt) => add(UI.row(label, UI.stepper(s[k], min, max, (v) => { s[k] = v; saveSetup(def, s); if (fmt?.rerender) rerender(); }, fmt))),
      toggle: (label, k, sub) => add(UI.row(label, UI.toggle(!!s[k], (v) => { s[k] = v; changed(); }, label), sub)),
      note: (text) => add(h("p", { class: "note" }, text)),
      section: (title) => add(h("h3", { class: "sub" }, title)),
      custom: (node) => add(node),
      seats: (count, o = {}) => add(seatsEditor(def, s, count, o, changed)),
    };
  }
  const LOOKS = [null, { hat: "hat-bow" }, { hat: "hat-cap" }, { hat: "hat-beanie" }, { glasses: "glasses-round" }, { hat: "hat-straw" }];
  function seatsEditor(def, s, count, o, changed) {
    const pal = palette();
    const box = h("div", { class: "seats" });
    for (let k = 0; k < count; k++) {
      const st = s.seats[k];
      const fixedKind = o.kinds?.[k];
      if (fixedKind) st.kind = fixedKind;
      const ai = st.kind === "ai";
      const sw = h("button", { class: "swatch", style: `--c:${pal.colors[st.color]}`, "aria-label": `Colour: ${pal.names[st.color]}`, html: symSvg(Art.SYMBOLS[st.color], pal.colors[st.color]) });
      sw.onclick = () => {
        // cycle colour, swapping with whoever had it
        const next = (st.color + 1) % 4;
        const other = s.seats.find((x, j) => j !== k && j < count && x.color === next);
        if (other) other.color = st.color;
        st.color = next;
        changed();
      };
      const nameText = ai ? `${Core.PERSONAS[st.persona].name}` : st.name || (k === 0 ? Save.profile.name : pal.names[st.color]);
      const name = h("button", { class: "seat-name", html: `<b>${esc(o.labels?.[k] ?? nameText)}</b>${ai ? `<small>${esc(Core.PERSONAS[st.persona].desc)}</small>` : !o.noKeys ? `<small>${App.hasKeyboard ? `Key ${Core.KEYS[k]}` : "Tap to rename"}</small>` : ""}` });
      if (!ai) name.onclick = () => renameSeat(k, st, changed);
      else name.onclick = () => {
        st.persona = Core.PERSONA_ORDER[(Core.PERSONA_ORDER.indexOf(st.persona) + 1) % 3];
        changed();
      };
      const top = h("div", { class: "seat-top" }, sw, name);
      if (!fixedKind) top.append(UI.seg([["human", "Human", "user"], ["ai", "AI", "sparkle"]], st.kind, (v) => { st.kind = v; changed(); }, "mini"));
      const row = h("div", { class: "seat" }, top);
      if (ai) {
        row.append(UI.seg([["easy", "Easy"], ["normal", "Normal"], ["hard", "Hard"], ["expert", "Expert"], ["auto", "Auto"]], st.level, (v) => { st.level = v; changed(); }, "mini levels"));
      } else {
        const more = h("div", { class: "seat-more", hidden: !st.open });
        more.append(UI.row("Cursor speed", UI.slider(st.speed, 0.6, 1.4, 0.05, (v) => { st.speed = v; def && saveSetup(def, s); }), "Slower is easier"));
        more.append(UI.row("Pen size", UI.stepper(st.pen || CONFIG.tune.pen, 3, 8, (v) => { st.pen = v; saveSetup(def, s); })));
        if (k !== 0) {
          const looks = h("div", { class: "looks" });
          LOOKS.forEach((lk, j) => {
            const c = h("canvas", { class: `look${JSON.stringify(st.look) === JSON.stringify(lk) ? " on" : ""}` });
            c.onclick = () => { st.look = lk; changed(); };
            looks.append(c);
            requestAnimationFrame(() => Art.drawLamb(Art.sharp(c, 44, 40), 22, 24, 34, { scarf: pal.colors[st.color], look: lk ? { ...lk } : null }));
            void j;
          });
          more.append(UI.row("Lamb look", looks));
        }
        row.append(h("div", { class: "seat-line" },
          h("label", { class: "assist" }, UI.toggle(st.assist, (v) => { st.assist = v; changed(); }, "Little Lamb"), h("span", { html: `<b>Little Lamb</b><small>Slower cursor, bigger pen</small>` })),
          h("button", { class: "ib more", "aria-label": "More options", onclick: () => { st.open = !st.open; changed(); }, html: Icons.get(st.open ? "minus" : "plus") })), more);
      }
      box.append(row);
    }
    return box;
  }
  function renameSeat(k, st, changed) {
    Nav.go("rename", { value: st.name || (k === 0 ? Save.profile.name : ""), done: (v) => {
      v = v.trim().slice(0, 12);
      if (k === 0 && v) Save.profile.name = v;
      st.name = v;
      changed();
    } });
  }
  const symSvg = (sym, color) => {
    const shape = { circle: '<circle cx="11" cy="11" r="8"/>', triangle: '<path d="M11 2 20 19H2Z"/>', square: '<rect x="3" y="3" width="16" height="16" rx="2"/>', diamond: '<path d="M11 1 21 11 11 21 1 11Z"/>' }[sym];
    return `<svg class="sym" viewBox="0 0 22 22" fill="${color}" stroke="rgba(0,0,0,.45)" stroke-width="2">${shape}</svg>`;
  };

  // ---------- loading and playing ----------
  async function loadMode(key) {
    const m = meta(key);
    try {
      return await Modes.load(key, m.file);
    } catch (e) {
      ErrorLog.add(e.message, "load " + key);
      UI.toast("Couldn't load that game. Check your connection and try again.", { icon: "info" });
      return null;
    }
  }
  const session = { key: null, wins: {}, games: 0 }; // the scoreboard for rematches
  let current = null; // { def, setup, opts }
  async function play(key, setup, o = {}) {
    const def = await loadMode(key);
    if (!def) return;
    setup ??= def.continueSetup?.() ?? loadSetup(def);
    Sound.unlock();
    if (session.key !== key) Object.assign(session, { key, wins: {}, games: 0 });
    Save.profile.lastMode = key;
    Save.save();
    const firstSteps = !Save.profile.firstSteps && key === "stampede" && !o.replay;
    if (firstSteps) setup = def.firstStepsSetup?.(setup) ?? setup;
    current = { def, setup, opts: o };
    const inGame = Nav.is("game") || Nav.is("results");
    Nav.go("game", { key }, { replace: inGame });
    Pwa.gameStarted();
    Core.start(def, setup, {
      firstSteps,
      seed: o.seed ?? def.seedFor?.(setup),
      onEnd: (sum) => finished(def, sum),
      onBetween: (info) => Nav.go("between", info),
    });
  }

  Nav.define("game", {
    render() {},
    onShow() {
      document.body.classList.add("in-game");
      Core.layout();
    },
    onHide() {
      document.body.classList.remove("in-game");
      // a finished game lets go of everything it used
      if (Core.phase === "over") Core.quit();
    },
    onBack() {
      if (Core.phase === "replay") {
        Core.quit();
        return false;
      }
      if (Core.phase === "play") {
        pauseGame();
        return true;
      }
      // a finished replay steps back to the results; a paused or between game stays put
      return Core.phase === "paused" || Core.phase === "between";
    },
    onCover() {},
  });
  function pauseGame() {
    if (Core.pause()) Nav.go("pause");
  }
  // pause when the app is hidden (not when focus moves elsewhere on the page)
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && Core.phase === "play") pauseGame();
    if (!document.hidden) Pwa.wake(Core.phase === "play");
  });
  window.addEventListener("pagehide", () => {
    if (Core.phase === "play") pauseGame();
  });

  Nav.define("pause", {
    sheet: true,
    render(el) {
      const def = current?.def;
      el.innerHTML = `<div class="sheet-card"><h2>${STRINGS.pause.title}</h2>
        <button class="btn primary big" id="p-resume">${Icons.get("play")}<span>${STRINGS.pause.resume}</span></button>
        <button class="btn big" id="p-restart">${Icons.get("refresh")}<span>${STRINGS.pause.restart}</span></button>
        <div class="two"><button class="btn" id="p-help">${Icons.get("question")}<span>${STRINGS.pause.help}</span></button>
        <button class="btn" id="p-settings">${Icons.get("gear")}<span>${STRINGS.pause.settings}</span></button></div>
        <button class="btn ghost" id="p-home">${Icons.get("home")}<span>${STRINGS.pause.home}</span></button></div>`;
      $("p-resume").onclick = () => resumeGame();
      $("p-restart").onclick = () => {
        Nav.close("pause");
        play(def.key, current.setup);
      };
      $("p-help").onclick = () => Nav.go("help", { key: def.key });
      $("p-settings").onclick = () => Nav.go("settings", { fromGame: true });
      $("p-home").onclick = async () => {
        if (Save.settings.confirmQuit && !(await UI.confirm(STRINGS.pause.confirm, STRINGS.pause.yes, STRINGS.pause.no))) return;
        leaveGame();
      };
    },
    onBack() {
      resumeGame();
      return true;
    },
  });
  function resumeGame() {
    Nav.close("pause");
    Core.resume();
    applySettings();
  }
  function leaveGame() {
    Core.quit();
    Pwa.gameEnded();
    Nav.go("home", {}, { reset: true });
  }

  Nav.define("between", {
    sheet: true,
    render(el, info) {
      el.innerHTML = `<div class="sheet-card between"><h2 style="color:${info.color || "inherit"}">${esc(info.title)}</h2>
        <div class="series">${info.teams.map((t) => `<div class="team">${symSvg(t.sym, t.color)}<b style="color:${t.color}">${esc(t.name)}</b>${Array.from({ length: info.need }, (_, k) => `<i class="${k < t.wins ? "won" : ""}" style="--c:${t.color}"></i>`).join("")}</div>`).join("")}</div>
        <div class="bar-timer"><i></i></div><p class="note">Tap to start the next round</p></div>`;
      el.onclick = () => go();
      clearTimeout(betweenTimer);
      betweenTimer = setTimeout(go, 3400);
      function go() {
        clearTimeout(betweenTimer);
        if (!Nav.is("between")) return;
        Nav.close("between");
        Core.nextRound();
      }
    },
    onBack() {
      return true;
    },
  });
  let betweenTimer = 0;

  // ---------- RESULTS ----------
  function finished(def, sum) {
    Pwa.gameEnded();
    const extra = def.results?.(sum) || {};
    const rewards = Progress.gameOver(def, sum, extra);
    if (sum.firstSteps) {
      Save.profile.firstSteps = true;
      Save.save();
    }
    session.games++;
    if (sum.res.team >= 0) session.wins[sum.res.team] = (session.wins[sum.res.team] || 0) + 1;
    Nav.go("results", { def, sum, rewards, extra }, { replace: true });
  }

  Nav.define("results", {
    render(el, { def, sum, rewards, extra }) {
      const p = Save.profile;
      const won = sum.won || !sum.humans.length;
      const need = CONFIG.levelXp(p.level);
      el.innerHTML = `<div class="page results">
        <div class="res-hero"><canvas id="res-cv"></canvas></div>
        <h1 class="res-title" style="color:${sum.color && sum.humans.length !== 1 ? sum.color : "inherit"}">${esc(sum.title)}</h1>
        <p class="res-sub">${esc(sum.sub || "")}</p>
        ${extra.html || ""}
        ${sum.match ? `<div class="series small">${sum.match.teams.map((t) => `<div class="team"><b style="color:${t.color}">${esc(t.name)}</b>${Array.from({ length: sum.match.need }, (_, k) => `<i class="${k < t.wins ? "won" : ""}" style="--c:${t.color}"></i>`).join("")}</div>`).join("")}</div>` : ""}
        <div class="rewards">
          <div class="reward">${Icons.get("wool")}<b id="r-wool">0</b><span>${STRINGS.results.wool}</span></div>
          <div class="reward xp"><span>${STRINGS.home.level} ${p.level}</span><div class="xpbar"><i id="r-xp" style="width:0"></i></div><small>+<b id="r-xpn">0</b> ${STRINGS.results.xp}</small></div>
        </div>
        <div id="r-extras"></div>
        ${sum.awards.length ? `<h3 class="sub">${STRINGS.results.awards}</h3><div class="awards">${sum.awards.map((a) => `<div class="award"><b>${esc(STRINGS.awards[a.id][0])}</b><span style="color:${a.who.color}">${symSvg(a.who.sym, a.who.color)} ${esc(a.who.name)}</span><small>${esc(a.value)}</small></div>`).join("")}</div>` : ""}
        ${session.games > 1 && sum.players.length > 1 ? `<p class="session">Tonight: ${[...new Set(sum.players.map((q) => q.team))].map((t) => `<b style="color:${sum.players.find((q) => q.team === t).color}">${session.wins[t] || 0}</b>`).join(" – ")}</p>` : ""}
        ${sum.chainRec ? `<div class="com"><span>${Icons.get("film")} ${STRINGS.results.chainOfMatch}: <b>×${sum.chainRec.best.len}</b></span><button class="btn small" id="r-watch">${Icons.get("eye")}<span>${STRINGS.results.watch}</span></button><button class="btn small" id="r-clip">${Icons.get("download")}<span>${STRINGS.results.saveClip}</span></button></div>` : ""}
        <div id="r-flock"></div>
        <div class="res-buttons">
          <button class="btn primary huge" id="r-again">${Icons.get("refresh")}<span>${esc(extra.againLabel || def.againLabel?.(sum) || STRINGS.results.again)}</span></button>
          ${extra.next ? `<button class="btn sky big" id="r-next">${Icons.get("next")}<span>${STRINGS.results.next}</span></button>` : ""}
          <div class="two"><button class="btn" id="r-share">${Icons.get("share")}<span>${STRINGS.results.share}</span></button>
          <button class="btn" id="r-home">${Icons.get("home")}<span>${STRINGS.results.home}</span></button></div>
        </div></div>`;
      const cv = $("res-cv");
      const box = cv.parentElement.getBoundingClientRect();
      const W = Math.round(box.width) || 320;
      resultsStop?.();
      resultsStop = UI.liveCanvas(cv, W, 150, (g, t) => drawResultsScene(g, W, 150, t, won, sum, def));
      UI.countUp($("r-wool"), rewards.wool + (rewards.bread?.wool || 0) + rewards.badges.length * 25, 900, (pr) => {
        if (pr < 1 && Math.random() < 0.3) Sfx.coin(Math.floor(pr * 12));
      });
      UI.countUp($("r-xpn"), rewards.xp, 900);
      requestAnimationFrame(() => {
        $("r-xp").style.width = `${Math.round((p.xp / need) * 100)}%`;
      });
      const ex = $("r-extras");
      const extraRows = [];
      if (rewards.bread) extraRows.push(`<div class="pill gold">${Icons.get("bread")} ${STRINGS.daily.bread}: ${STRINGS.daily.streak(rewards.bread.streak)} <b>+${rewards.bread.wool}</b></div>`);
      for (const lv of rewards.levels) extraRows.push(`<div class="pill sky levelup">${Icons.get("star")} ${STRINGS.results.levelUp(lv.level)} ${lv.item ? `New: <b>${esc(Progress.BY_ID.get(lv.item).name)}</b>` : `<b>+${lv.wool}</b> wool`}</div>`);
      for (const k of rewards.newRecords) extraRows.push(`<div class="pill">${Icons.get("trophy")} ${STRINGS.results.newBest} ${esc(extra.recordNames?.[k] || (k === "chain" ? "Biggest chain" : k))}</div>`);
      for (const b of rewards.badges) extraRows.push(`<div class="pill badge-new">${Icons.get(b.icon)} Badge: <b>${esc(b.name)}</b> <small>+25</small></div>`);
      if (rewards.journal) extraRows.push(`<button class="pill jpill tap" id="r-journal">${Icons.get("book")} Journal card: <b>${esc(rewards.journal.ref)}</b></button>`);
      ex.innerHTML = extraRows.join("");
      if (rewards.levels.length) setTimeout(() => Sfx.levelUp(), 700);
      if ($("r-journal")) $("r-journal").onclick = () => Nav.go("card", { key: def.key });
      $("r-again").onclick = () => (extra.again ? extra.again() : play(def.key, current.setup));
      if ($("r-next")) $("r-next").onclick = () => extra.next();
      $("r-home").onclick = () => leaveGame();
      $("r-share").onclick = () => Share.result(def, sum, extra);
      if ($("r-watch")) $("r-watch").onclick = () => watchReplay(def, sum, false);
      if ($("r-clip")) $("r-clip").onclick = () => watchReplay(def, sum, true);
      extra.after?.();
      Flock.offer($("r-flock"), won || rewards.levels.length > 0);
      Pwa.afterGame();
    },
    onHide() {
      resultsStop?.();
      resultsStop = null;
    },
  });
  let resultsStop = null;
  function drawResultsScene(g, w, hh, t, won, sum, def) {
    const grd = g.createLinearGradient(0, 0, 0, hh);
    grd.addColorStop(0, won ? "#fff1c4" : "#e3ecf5");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, w, hh);
    if (def.drawResult?.(g, w, hh, t, won, sum)) return;
    if (won) {
      g.save();
      g.translate(w / 2, hh * 0.55);
      for (let k = 0; k < 12; k++) {
        g.rotate(Math.PI / 6);
        g.fillStyle = "rgba(255,207,74,0.18)";
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(-14, -hh);
        g.lineTo(14, -hh);
        g.fill();
      }
      g.restore();
    }
    const jump = won && !Save.settings.reduced ? Math.abs(Math.sin(t * 5)) * 10 : 0;
    Art.drawLamb(g, w / 2, hh * 0.6 - jump, 110, { t, mood: won ? "joy" : "sad", tear: !won, look: Progress.look(), glow: won ? "rgba(255,220,120,0.5)" : undefined });
    if (won && !Save.settings.reduced) {
      for (let k = 0; k < 10; k++) {
        const x = ((k * 97 + t * 40 * (1 + (k % 3))) % (w + 20)) - 10;
        const y = ((k * 53 + t * 60) % hh);
        g.fillStyle = ["#ff5a5f", "#ffc93c", "#2fd38a", "#3fa7ff", "#9b7bff"][k % 5];
        g.fillRect(x, y, 6, 3);
      }
    }
  }
  async function watchReplay(def, sum, record) {
    const rec = sum.chainRec;
    Nav.go("game", { key: def.key, replay: true });
    let recorder = null;
    if (record) recorder = Share.startClip(sum, def);
    await Core.replay(def, rec, rec.best.from, rec.best.to, recorder?.frame);
    if (recorder) await recorder.finish();
    if (Nav.is("game")) Nav.back();
  }

  // ---------- DAILY ----------
  Nav.define("daily", {
    render(el) {
      const b = Save.profile.bread;
      const v = Progress.verseOfDay();
      const done = Progress.breadToday();
      el.replaceChildren(UI.header(STRINGS.daily.title));
      const page = h("div", { class: "page" });
      page.append(h("div", { class: `daily-card bread${done ? " done" : ""}`, html: `
        <div class="dc-head">${Icons.get("bread")}<div><b>${STRINGS.daily.bread}</b><small>${done ? STRINGS.daily.claimed : STRINGS.daily.breadDesc}</small></div><span class="streak">${b.streak || 0}<small>day${b.streak === 1 ? "" : "s"}</small></span></div>
        <div class="week">${weekDots()}</div>
        <blockquote>${esc(v[1])}</blockquote><cite>${esc(v[0])} (KJV)</cite>` }));
      if (!done) page.append(UI.btn(STRINGS.home.quick, () => quickPlay(), "primary big", "play"));
      for (const [key, name, desc, icon] of [["rush", STRINGS.daily.rush, STRINGS.daily.rushDesc, "timer"], ["saga", STRINGS.daily.pasture, STRINGS.daily.pastureDesc, "leaf"]]) {
        const built = BUILT.has(key);
        const card = h("div", { class: `daily-card${built ? " tap" : " soon"}`, html: `<div class="dc-head">${Icons.get(icon)}<div><b>${name}</b><small>${!built ? STRINGS.daily.soon : Save.mode(key).progress.daily?.[Dates.today()] ? `Done today: ${fmtNum(Save.mode(key).progress.daily[Dates.today()])}. Play again any time!` : desc}</small></div>${built ? Icons.get("next") : Icons.get("lock")}</div>` });
        if (built) card.onclick = async () => {
          const def = await loadMode(key);
          if (def) def.daily ? def.daily() : play(key);
        };
        page.append(card);
      }
      el.append(page);
    },
  });
  function weekDots() {
    const b = Save.profile.bread;
    const out = [];
    for (let k = 6; k >= 0; k--) {
      const day = Dates.addDays(Dates.today(), -k);
      const on = b.last && Dates.daysBetween(day, b.last) >= 0 && Dates.daysBetween(day, b.last) < b.streak;
      const label = ["S", "M", "T", "W", "T", "F", "S"][new Date(day + "T12:00:00").getDay()];
      out.push(`<i class="${on ? "on" : ""}${k === 0 ? " today" : ""}"><b>${label}</b></i>`);
    }
    return out.join("");
  }

  // ---------- keyboard ----------
  document.addEventListener("keydown", (e) => {
    if (e.target.closest?.("input, textarea")) return;
    const k = e.key.toUpperCase();
    if (!hasKeyboard && /^[A-Z ]$/.test(k)) hasKeyboard = true;
    if (e.key === "Escape") {
      e.preventDefault();
      if (Nav.is("game")) Nav.back();
      else Nav.back();
      return;
    }
    if (!Nav.is("game") || e.repeat) return;
    if (k === " ") {
      e.preventDefault();
      const s = Core.firstHumanSeat();
      if (s >= 0) Core.press(s);
      return;
    }
    const seat = Core.KEYS.indexOf(k);
    if (seat >= 0) {
      e.preventDefault();
      Core.press(seat);
    }
  });

  // ---------- crash ----------
  function crash(e) {
    const el = $("crash");
    el.hidden = false;
    el.querySelector("h2").textContent = STRINGS.crash.title;
    el.querySelector("p").textContent = STRINGS.crash.body;
    const g = Art.sharp(el.querySelector("canvas"), 160, 110);
    Art.drawLamb(g, 80, 62, 92, { mood: "shock" });
    $("crash-home").onclick = () => {
      el.hidden = true;
      Core.quit();
      Nav.go("home", {}, { reset: true });
    };
    $("crash-copy").onclick = () => navigator.clipboard?.writeText(ErrorLog.text()).then(() => UI.toast(STRINGS.backup.copied));
    void e;
  }

  // ---------- start-up ----------
  function boot() {
    Core.mount();
    applySettings();
    Nav.bindHistory();
    // the first tap anywhere wakes the sound
    document.addEventListener("pointerdown", () => Sound.unlock(), { capture: true });
    // no zoom, no long-press menus, no pull-to-refresh
    for (const ev of ["contextmenu", "gesturestart", "dblclick"]) document.addEventListener(ev, (e) => e.preventDefault());
    document.addEventListener("touchmove", (e) => {
      if (e.touches.length > 1 || (document.body.classList.contains("in-game") && !e.target.closest(".sheet, .screen:not(#scr-game)"))) e.preventDefault();
    }, { passive: false });
    Nav.go("home");
    $("boot").remove();
    Pwa.init();
    if (Save.profile.whatsNewSeen !== CONFIG.version) {
      if (Save.profile.games > 0) setTimeout(() => Nav.is("home") && Nav.go("whatsnew"), 600);
      else Save.profile.whatsNewSeen = CONFIG.version;
    }
    // the very first launch goes straight into First Steps after one tap
    if (!Save.profile.firstSteps && Save.profile.games === 0) $("home-play")?.classList.add("glow");
  }

  return {
    boot, play, openSetup, applySettings, palette, musicFor, homeMusic, crash, leaveGame, loadMode, quickPlay, MODES, BUILT, meta, symSvg, loadSetup, saveSetup,
    get hasKeyboard() { return hasKeyboard; }, get lowEnd() { return lowEnd; }, get current() { return current; },
  };
})();

</script>
<script>
// ============================== PWA ==============================
// Offline play, "Update ready", installing, keeping the screen awake during play,
// full screen on Android, asking to keep saves safe, and the optional visit counter.
const Pwa = (() => {
  let installEvent = null;
  let waiting = null; // a new version, ready
  let wakeLock = null;
  let updating = false;
  const standalone = () => matchMedia?.("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = () => /android/i.test(navigator.userAgent);
  const canInstall = () => !standalone() && (!!installEvent || isIos());
  const playing = () => Core.phase === "play" || Core.phase === "paused" || Core.phase === "between";

  function init() {
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      installEvent = e;
      if (Nav.is("home")) Nav.refresh();
    });
    window.addEventListener("appinstalled", () => {
      installEvent = null;
      UI.toast("Installed! Find the lamb on your home screen.", { icon: "check" });
    });
    registerWorker();
    pingCounter();
    fpsMeter();
    Bus.on("nav", () => idleChecks());
  }

  // ---- the service worker ----
  function registerWorker() {
    if (!("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol) || window.SINGLE_FILE) return;
    navigator.serviceWorker.register("sw.js").then((reg) => {
      if (!reg) return;
      const watch = (w) => {
        if (!w) return;
        w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) {
            waiting = w;
            idleChecks();
          }
        });
      };
      if (reg.waiting && navigator.serviceWorker.controller) {
        waiting = reg.waiting;
        idleChecks();
      }
      reg.addEventListener("updatefound", () => watch(reg.installing));
      // look for a new version now and then while the game stays open
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch((e) => ErrorLog.add(e.message, "sw"));
    // only reload when the player tapped "Update ready" (not when the first install takes over)
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!updating) return;
      updating = false;
      Save.writeNow();
      location.reload();
    });
  }
  // Things to offer when nothing is happening: never in the middle of a game.
  function idleChecks() {
    if (playing() || Nav.is("game")) return;
    if (waiting) {
      UI.toast(STRINGS.update, { icon: "refresh", sticky: true, onTap: () => {
        updating = true;
        waiting.postMessage("skipWaiting");
      } });
    }
  }

  // ---- installing ----
  async function install() {
    if (installEvent) {
      installEvent.prompt();
      const { outcome } = await installEvent.userChoice.catch(() => ({}));
      if (outcome === "accepted") installEvent = null;
      return;
    }
    if (isIos()) Nav.go("installios");
  }

  // After a few games: suggest installing (once in a while) and keeping a backup, and ask the
  // browser to keep our save safe from clean-ups.
  function afterGame() {
    const p = Save.profile;
    if (!p.persistAsked && p.games >= 3 && navigator.storage?.persist) {
      p.persistAsked = true;
      navigator.storage.persist().catch(() => {});
    }
    if (!standalone() && canInstall() && (p.games === 5 || p.games === 25) && p.installTipShown < p.games) {
      p.installTipShown = p.games;
      setTimeout(() => UI.toast("Tip: install the game to play offline", { icon: "install", onTap: install, ms: 4500 }), 1500);
    } else if (p.games === 30 && !p.backupTip) {
      p.backupTip = true;
      setTimeout(() => UI.toast("Tip: keep a backup code in Settings, just in case", { icon: "download", ms: 4500, onTap: () => Nav.go("backup") }), 1500);
    }
    Save.save();
  }

  // ---- during play ----
  async function wake(on) {
    try {
      if (on && "wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => (wakeLock = null));
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch {}
  }
  function gameStarted() {
    wake(true);
    // full screen on Android phones (iPhones don't allow it outside an installed app)
    if (isAndroid() && !standalone() && !document.fullscreenElement && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
    }
  }
  function gameEnded() {
    wake(false);
  }

  // ---- the optional, cookie-free visit counter (off unless switched on in CONFIG) ----
  function pingCounter() {
    const c = CONFIG.counter;
    if (!c.enabled || !c.url) return;
    const day = Dates.today();
    if (Save.data.lastCount === day) return;
    Save.data.lastCount = day;
    Save.save();
    fetch(c.url, { mode: "no-cors", credentials: "omit", cache: "no-store", keepalive: true, referrerPolicy: "no-referrer" }).catch(() => {});
  }

  // ---- developer FPS meter ----
  let fpsTimer = 0;
  function fpsMeter() {
    const el = $("fps");
    clearInterval(fpsTimer);
    el.hidden = !Save.data.dev.fps;
    if (el.hidden) return;
    fpsTimer = setInterval(() => (el.textContent = `${Math.round(Core.fps)} fps`), 500);
  }

  return { init, install, canInstall, isIos, idleChecks, afterGame, gameStarted, gameEnded, wake, fpsMeter, standalone };
})();

</script>
<script>
// ======================= SHEEP RUSH =======================
// A one-minute score attack. Bursts claim grey sheep and smash rocks; chains close together
// raise the multiplier. The Daily Rush is the same board for everyone, each day.
(() => {
  const S = Core;
  const N = S.NEUTRAL;
  const RUSH = {
    seconds: 60,
    comboMs: 2000, // chains closer than this raise the multiplier; this long without one resets it
    bonusSecs: 3, // for breaking a rock, a 20-chain or a clock
    bonusChain: 20,
    maxBonusSecs: 30, // at most this much extra time per run
    start: { own: 0.3, neutral: 0.4, rocks: 3 },
    neutralEveryMs: 3500, // new grey sheep drop in this often (2 at a time)
    rockEveryMs: 12000,
    pickupEveryMs: 8000, // a pickup drops in this often
    pickups: ["clock", "gold", "box"],
    goldenMs: 5000, // golden sheep: double points this long
    pointsPerBurst: 10,
    chainCap: 20, // chain size counts up to this in the points
    homePoints: 5, // per square cleared when a chain ends
    refill: { upTo: 0.5, own: 0.4 }, // after a chain clears, sheep drop in until half the board is full
    medals: [["bronze", "Bronze", 100000, "#d08a4a"], ["silver", "Silver", 250000, "#c7ced8"], ["gold", "Gold", 500000, "#ffcf4a"], ["plat", "Platinum", 900000, "#bfe9ff"]],
    shareEmoji: { bronze: "🥉", silver: "🥈", gold: "🥇", plat: "💎" }, // for the text people paste into chats
  };
  const medalFor = (score) => RUSH.medals.filter(([, , at]) => score >= at).pop();
  const medalSvg = (m, size = 28) => `<svg class="medal-ico" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h3l1 5-3 1zM16 2h-3l-1 5 3 1z" fill="#3fa7ff"/><circle cx="12" cy="15" r="7" fill="${m ? m[3] : "#d5dbd3"}" stroke="rgba(0,0,0,0.25)" stroke-width="1.2"/><path d="M12 11l1.2 2.5 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z" fill="rgba(255,255,255,0.75)"/></svg>`;
  const prog = () => {
    const p = Save.mode("rush").progress;
    p.daily ??= {};
    p.ghost ??= {};
    return p;
  };
  const ghostKey = (daily) => (daily ? `daily-${Dates.today()}` : "free");

  Modes.register({
    key: "rush",
    title: "Sheep Rush",
    how: ["One minute. Burst grey sheep, smash rocks, grab clocks and gold.", "Chains close together raise your multiplier!"],
    solo: true,
    maxRun: 14, // a cascade settles after 14 waves (about 2 s), then its squares clear
    music: { song: "meadowDash", style: "bright", bpm: 140 },
    tune: { roundSecs: RUSH.seconds },
    setupDefaults: { mode: "daily" },
    players: (s) => [{ seat: 0, kind: s.bot ? "ai" : "human", level: s.bot || null }],
    options(ui, s) {
      ui.seg("Mode", "mode", [["daily", `Daily Rush #${Dates.dailyNumber()}`], ["free", "Free Play"]]);
      const p = prog();
      const best = s.mode === "daily" ? p.daily[Dates.today()] : Save.mode("rush").records.score;
      if (best) ui.custom(UI.h("p", { class: "note best-line", html: `${medalSvg(medalFor(best), 22)} ${s.mode === "daily" ? "Today's best" : "Your best"}: <b>${fmtNum(best)}</b>` }));
      ui.custom(UI.h("div", { class: "medal-row", html: RUSH.medals.map((m) => `<span>${medalSvg(m, 24)}<small>${m[2] / 1000}k</small></span>`).join("") }));
    },
    playLabel: (s) => (s.mode === "daily" ? `Play Daily Rush #${Dates.dailyNumber()}` : "Play"),
    // the Daily hub opens straight into today's run
    daily: () => App.play("rush", { ...App.loadSetup(Modes.get("rush")), mode: "daily" }, { seed: hashStr("rush-play-" + Dates.today()) }),
    seedFor: (s) => (s.mode === "daily" ? hashStr("rush-play-" + Dates.today()) : undefined),
    tips: [
      { id: "combo", on: "start", icon: "bolt", text: "Quick chains raise the multiplier" },
      { id: "pickups", on: "box", icon: "timer", text: "Burst into clocks for time" },
    ],
    help: [
      { title: "Burst the grey sheep", text: "Grey sheep don't burst by themselves. Your bursts claim them, and big chains score big.", draw: (g, w, h, t) => helpGrey(g, w, h, t) },
      { title: "Keep the combo going", text: "Start a new chain within two seconds of the last to raise your multiplier.", draw: (g, w, h, t) => helpCombo(g, w, h, t) },
      { title: "Grab the pickups", text: "Clocks add time, golden sheep double your points, gifts load a special.", draw: (g, w, h, t) => helpPickups(g, w, h, t) },
    ],
    badges: [
      { id: "bronze", icon: "star", name: "Bronze", desc: "Score 100,000", test: (c) => c.score >= RUSH.medals[0][2] },
      { id: "silver", icon: "star", name: "Silver", desc: "Score 250,000", test: (c) => c.score >= RUSH.medals[1][2] },
      { id: "gold", icon: "star", name: "Gold", desc: "Score 500,000", test: (c) => c.score >= RUSH.medals[2][2] },
      { id: "plat", icon: "crown", name: "Platinum", desc: "Score 900,000", test: (c) => c.score >= RUSH.medals[3][2] },
      { id: "daily", icon: "calendar", name: "Daily rusher", desc: "Play a Daily Rush", test: (c) => c.setup.mode === "daily" },
      { id: "x5", icon: "bolt", name: "On fire", desc: "Reach a ×5 multiplier", test: (c) => c.G.data.topMult >= 5 },
      { id: "rocks", icon: "rocks", name: "Quarry", desc: "Smash 8 rocks in one rush", test: (c) => c.G.data.rocksBroken >= 8 },
      { id: "time", icon: "timer", name: "Overtime", desc: "Earn the full +30 seconds", test: (c) => c.G.data.bonus >= RUSH.maxBonusSecs },
      { id: "golden", icon: "sparkle", name: "Golden fleece", desc: "Grab 3 golden sheep in one rush", test: (c) => c.G.data.goldGrabs >= 3 },
    ],
    results(sum) {
      const D = sum.G.data;
      const p = prog();
      const daily = D.daily;
      const medal = medalFor(D.score);
      const key = ghostKey(daily);
      const prevBest = daily ? p.daily[Dates.today()] || 0 : Save.mode("rush").records.score || 0;
      const isBest = D.score > prevBest;
      if (daily) p.daily[Dates.today()] = Math.max(prevBest, D.score);
      // the ghost of your best run, for next time
      if (isBest) {
        p.ghost[key] = D.trace;
        // keep only today's daily ghost
        for (const k of Object.keys(p.ghost)) if (k.startsWith("daily-") && k !== key) delete p.ghost[k];
      }
      Save.save();
      const line = `🐑 Sheep Rush${daily ? ` Daily #${Dates.dailyNumber()}` : ""}: ${fmtNum(D.score)} ${medal ? RUSH.shareEmoji[medal[0]] : ""} · chain ${D.best} · x${D.topMult} · ${CONFIG.siteUrl}`;
      return {
        records: daily ? [] : [{ key: "score", value: D.score }],
        recordNames: { score: "Sheep Rush score" },
        ctx: { score: D.score },
        wool: Math.min(30, Math.floor(D.score / 40000)) + (daily ? 10 : 0),
        html: `<div class="rush-medal">${medalSvg(medal, 64)}</div><p class="score">${fmtNum(D.score)}</p>
          <div class="medal-row">${RUSH.medals.map((m) => `<span class="${D.score >= m[2] ? "got" : ""}">${medalSvg(m, 24)}<small>${m[2] / 1000}k</small></span>`).join("")}</div>
          <p class="note">${isBest ? `${Icons.get("trophy")} A new best!` : `Best: ${fmtNum(Math.max(prevBest, D.score))}`} · chain ×${D.best} · multiplier ×${D.topMult}</p>
          <div class="share-line"><span>${esc(line)}</span><button class="btn small" id="rush-copy">${Icons.get("check")}<span>Copy</span></button></div>`,
        after() {
          $("rush-copy").onclick = () => Share.text(line);
        },
        againLabel: daily ? "Run it again" : "Play again",
        again: () => (daily ? Modes.get("rush").daily() : App.play("rush", { ...App.loadSetup(Modes.get("rush")), mode: "free" })),
        shareLine: `${fmtNum(D.score)} points${medal ? ` · ${medal[1]}` : ""}`,
        shareText: line,
      };
    },
    hooks: {
      setup(G, s) {
        const daily = s.mode === "daily";
        const b = G.b;
        const r = daily ? RNG(hashStr("rush-board-" + Dates.today())) : G.rng;
        const ghost = prog().ghost[ghostKey(daily)] || null;
        G.data = {
          daily, burst: new Set(), score: 0, mult: 1, topMult: 1, lastBurst: -1e9, bonus: 0, best: 0, rocksBroken: 0, goldGrabs: 0, goldUntil: 0,
          nextNeutral: RUSH.neutralEveryMs, nextRock: RUSH.rockEveryMs, nextPickup: RUSH.pickupEveryMs / 2, pick: 0, trace: [], ghost,
        };
        const cells = r.shuffle([...Array(b.size).keys()]);
        cells.slice(0, RUSH.start.rocks).forEach((i) => addRock(G, i, r));
        for (const i of cells.slice(RUSH.start.rocks)) {
          const x = r();
          if (x < RUSH.start.own) fill(b, i, 0, r);
          else if (x < RUSH.start.own + RUSH.start.neutral) fill(b, i, N, r);
        }
        G.players[0].placed = true;
      },
      noElimination: true,
      roundSecs: (G) => S.tune.roundSecs + G.data.bonus,
      land(G, b, from, to) {
        const kind = b.kind[to];
        if (kind === "rock") G.data.score += 25 * G.data.mult; // the core takes the hit
        if (kind === "clock" || kind === "gold") {
          grab(G, to, kind);
          return true;
        }
        return false;
      },
      specialHit(G, k) {
        const kind = G.b.kind[k];
        if (kind === "clock" || kind === "gold") {
          grab(G, k, kind);
          return true;
        }
        return false;
      },
      onRockBreak(G) {
        const D = G.data;
        D.rocksBroken++;
        D.score += 100 * D.mult;
        bonus(G);
      },
      targets(G, b, i, t) {
        if (b.owner[i] === 0) G.data.burst.add(i);
        return t;
      },
      afterWave(G, now, bursts) {
        const D = G.data;
        const pl = G.players[0];
        if (!bursts[0]) return;
        if (pl.chain === bursts[0]) {
          // a new chain: close to the last one raises the multiplier
          D.mult = now - D.lastBurst < RUSH.comboMs ? D.mult + 1 : 1;
          D.topMult = Math.max(D.topMult, D.mult);
          if (D.mult > 1) Sfx.blip(400 + D.mult * 80, 0.12, "triangle", 0.07, 700 + D.mult * 80);
          if (D.mult === 3 || D.mult === 5 || D.mult === 8) S.shout(pl, `×${D.mult}!`, 1.2 + D.mult * 0.05, "#ff9a5c");
        }
        D.lastBurst = now;
        D.score += bursts[0] * RUSH.pointsPerBurst * Math.min(pl.chain, RUSH.chainCap) * D.mult * (now < D.goldUntil ? 2 : 1);
      },
      onChain(G, pl, prev, cur) {
        if (prev < RUSH.bonusChain && cur >= RUSH.bonusChain) bonus(G);
      },
      chainEnd(G, pl, chain, now) {
        const D = G.data;
        const b = G.b;
        D.best = Math.max(D.best, chain);
        // the sheep that burst find their way home: their squares clear, so the board never clogs
        const fx = S.effect("overflow", -1, "#ffe680", now);
        let cleared = 0;
        for (const i of D.burst) {
          if (b.owner[i] !== 0) continue;
          b.owner[i] = -1;
          b.count[i] = 0;
          b.tag[i] = null;
          if (fx && fx.n < fx.cells.length) fx.cells[fx.n++] = i;
          cleared++;
        }
        D.burst.clear();
        D.score += cleared * RUSH.homePoints * D.mult;
        if (cleared >= 8) Sfx.blip(1046, 0.2, "sine", 0.05, 1568);
        // fresh sheep drop into the gaps
        const empty = [];
        for (let i = 0; i < b.size; i++) if (b.owner[i] === -1 && !b.kind[i]) empty.push(i);
        let room = Math.floor(b.size * RUSH.refill.upTo) - (b.size - empty.length);
        while (room-- > 0 && empty.length) {
          const i = empty.splice(G.rng.int(empty.length), 1)[0];
          fill(b, i, G.rng() < RUSH.refill.own ? 0 : N, G.rng);
          S.puff(i, "#fffaf0", 2);
        }
      },
      update(G, now) {
        const D = G.data;
        // the trace of this run, one point a second, to race against next time
        const sec = Math.floor((now - G.t0) / 1000);
        while (D.trace.length <= sec) D.trace.push(D.score);
        if (D.mult > 1 && now - D.lastBurst > RUSH.comboMs) {
          D.mult = 1;
          Sfx.blip(300, 0.15, "sine", 0.04, 180);
        }
        if (now >= D.nextNeutral) {
          D.nextNeutral = now + RUSH.neutralEveryMs;
          for (let k = 0; k < 2; k++) {
            const i = randomEmpty(G);
            if (i >= 0) {
              fill(G.b, i, N, G.rng);
              S.puff(i, "#c9c9d4", 4);
            }
          }
        }
        if (now >= D.nextRock) {
          D.nextRock = now + RUSH.rockEveryMs;
          const i = randomEmpty(G);
          if (i >= 0) addRock(G, i, G.rng);
        }
        if (now >= D.nextPickup) {
          D.nextPickup = now + RUSH.pickupEveryMs;
          const i = randomEmpty(G);
          if (i >= 0) {
            G.b.kind[i] = RUSH.pickups[D.pick++ % RUSH.pickups.length];
            S.puff(i, "#ffcf4a", 6);
            Sfx.chime(2);
            S.tip("box");
          }
        }
        hud(G, now);
      },
      endCheck(G, now, left) {
        if (left > 0) return null;
        const D = G.data;
        D.best = Math.max(D.best, G.players[0].chain);
        const medal = medalFor(D.score);
        return { team: 0, title: medal ? `${medal[1]} medal!` : "Time!", sub: `${fmtNum(D.score)} points`, color: "#d9a12a" };
      },
      aiValue: (G, pl, i) => {
        let n = 0;
        for (const k of Engine.neighbours(G.b, i)) if (G.b.kind[k] || G.b.owner[k] === N) n++;
        return n;
      },
      drawCell(ctx, G, i, x, y, c, t) {
        const kind = G.b.kind[i];
        if (kind !== "clock" && kind !== "gold") return false;
        const cx = x + c / 2;
        const cy = y + c / 2 + Math.sin(t * 4 + i) * c * 0.03;
        if (kind === "clock") {
          Art.circle(ctx, cx, cy, c * 0.3, "#fffaf0");
          ctx.strokeStyle = "#ff6b6b";
          ctx.lineWidth = c * 0.06;
          ctx.beginPath();
          ctx.arc(cx, cy, c * 0.3, 0, Art.TAU);
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx, cy - c * 0.18);
          ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(t * 3) * c * 0.14, cy + Math.sin(t * 3) * c * 0.14);
          ctx.stroke();
        } else {
          ctx.globalAlpha = 0.4 + 0.25 * Math.sin(t * 6);
          Art.circle(ctx, cx, cy, c * 0.42, "#ffe680");
          ctx.globalAlpha = 1;
          Art.drawSheep(ctx, cx, cy, c * 0.2, "#ffcf4a");
        }
        return true;
      },
    },
  });

  // the score, the combo meter, gold, and the ghost of your best run
  function hud(G, now) {
    const D = G.data;
    const left = Math.max(0, 1 - (now - D.lastBurst) / RUSH.comboMs);
    const gold = now < D.goldUntil;
    let ghost = "";
    if (D.ghost && D.ghost.length) {
      const sec = Math.min(D.ghost.length - 1, Math.floor((now - G.t0) / 1000));
      const diff = D.score - D.ghost[Math.max(0, sec)];
      const end = Math.max(1, D.score, D.ghost[D.ghost.length - 1]);
      ghost = `<div class="ghost-bar${diff >= 0 ? " ahead" : ""}" title="Your best run"><i class="me" style="left:${Math.min(100, (100 * D.score) / end)}%"></i><i class="gh" style="left:${Math.min(100, (100 * D.ghost[Math.max(0, sec)]) / end)}%"></i><b>${diff >= 0 ? "+" : "−"}${fmtNum(Math.abs(diff))}</b></div>`;
    }
    S.setHud(`${gold ? `<span class="goldtag">${Icons.get("sparkle")}×2</span>` : ""}<div class="combo"><i style="width:${D.mult > 1 ? Math.round(left * 20) * 5 : 0}%"></i><b>×${D.mult}</b></div><span class="score">${fmtNum(D.score)}</span>${ghost}`);
  }

  function grab(G, i, kind) {
    const D = G.data;
    G.b.kind[i] = null;
    S.puff(i, "#ffcf4a", 8);
    if (kind === "clock") bonus(G);
    else {
      D.goldUntil = G.time + RUSH.goldenMs;
      D.goldGrabs++;
      S.shout(G.players[0], "Golden!", 1.4, "#ffcf4a");
      Sfx.chime(12);
    }
  }
  function fill(b, i, who, r) {
    b.owner[i] = who;
    b.count[i] = 1 + r.int(Engine.capacity(b, i) - 1);
  }
  function randomEmpty(G) {
    const b = G.b;
    let n = 0;
    for (let i = 0; i < b.size; i++) if (b.owner[i] === -1 && !b.kind[i]) n++;
    if (!n) return -1;
    let k = G.rng.int(n);
    for (let i = 0; i < b.size; i++) if (b.owner[i] === -1 && !b.kind[i] && k-- === 0) return i;
    return -1;
  }
  function addRock(G, i, r) {
    const b = G.b;
    b.owner[i] = -1;
    b.count[i] = 0;
    b.kind[i] = "rock";
    b.hp[i] = b.mhp[i] = 1 + r.int(3);
    if (G.path.length) S.rebuildPath();
  }
  function bonus(G) {
    if (G.data.bonus >= RUSH.maxBonusSecs) return;
    G.data.bonus += RUSH.bonusSecs;
    S.shout(G.players[0], `+${RUSH.bonusSecs}s`, 1.3, "#7be0a8");
    Sfx.blip(880, 0.12, "sine", 0.06, 1320);
  }

  // ---------- the "?" card animations ----------
  function grid(g, w, cols, rows, c) {
    const x0 = (w - cols * c) / 2;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      g.fillStyle = (r + k) % 2 ? "#3d7a45" : "#46874e";
      g.fillRect(x0 + k * c, 10 + r * c, c, c);
    }
    return x0;
  }
  function helpGrey(g, w, h, t) {
    const c = 34;
    const x0 = grid(g, w, 4, 3, c);
    const p = (t % 2) / 2;
    Art.drawSheep(g, x0 + 1.5 * c, 10 + 1.5 * c, 8, "#ff5a5f");
    Art.drawSheep(g, x0 + 2.5 * c, 10 + 1.5 * c, 8, p > 0.5 ? "#ff5a5f" : "#a9a9b6");
    Art.drawSheep(g, x0 + 1.5 * c, 10 + 0.5 * c, 8, p > 0.6 ? "#ff5a5f" : "#a9a9b6");
  }
  function helpCombo(g, w, h, t) {
    const m = 1 + Math.floor((t * 1.5) % 5);
    Art.rrect(g, w / 2 - 70, h / 2 - 14, 140, 28, 14, "rgba(43,58,47,0.15)");
    Art.rrect(g, w / 2 - 70, h / 2 - 14, 140 * (1 - ((t * 1.5) % 1)), 28, 14, "#ff9a5c");
    g.fillStyle = "#2b3a2f";
    g.font = "700 22px Fredoka, system-ui";
    g.textAlign = "center";
    g.fillText(`×${m}`, w / 2, h / 2 + 8);
    g.textAlign = "start";
  }
  function helpPickups(g, w, h, t) {
    const y = h * 0.45;
    Art.circle(g, w * 0.25, y, 18, "#fffaf0");
    g.strokeStyle = "#ff6b6b";
    g.lineWidth = 3;
    g.beginPath();
    g.arc(w * 0.25, y, 18, 0, Art.TAU);
    g.moveTo(w * 0.25, y);
    g.lineTo(w * 0.25 + Math.cos(t * 3) * 12, y + Math.sin(t * 3) * 12);
    g.stroke();
    Art.drawSheep(g, w * 0.5, y, 14, "#ffcf4a");
    Art.drawGift(g, w * 0.75, y + 4, 14, t);
  }
})();

    { budget: 52, goals: { rocks: 1, thorns: 1, ice: 1 }, wolf: "normal", night: true, map: "T.33.T ...... .J..J. ...... ..CC.. ...... .J..J. ...... T.33.T" },
    { budget: 56, goals: { boss: 1 }, boss: 26, wolf: "normal", night: true, map: "T....T .3..3. ...... ..BB.. ..BB.. ...... .3..3. .C..C. T....T" },
  ];
  const PER_WORLD = 15;
  const worldOf = (n) => (n === "daily" ? Dates.dailyNumber() % 3 : Math.min(2, Math.floor((n - 1) / PER_WORLD)));
  const ROCK_DEFAULT = 2;
  const WOLF = "#8b8f9c";
  const SLEEP = "#c9c9d4";
  const GOAL_ICONS = { rocks: "rock", thorns: "thorn", ice: "ice", crates: "crate", wake: "zzz", chain: "bolt", own: "grass", boss: "crown" };
  const BOOSTERS = [["line", "Line sheep", "bolt"], ["bomb", "Bomb sheep", "sparkle"], ["plus", `+${SAGA.boosterPlus} sheep`, "plus"]];

  // ---------- progress (in the save file) ----------
  const prog = () => {
    const p = Save.mode("saga").progress;
    p.stars ??= [];
    p.fails ??= [];
    p.skipped ??= [];
    p.boosters ??= { line: 1, bomb: 1, plus: 1 };
    p.award ??= 0;
    p.daily ??= {};
    return p;
  };
  const cleared = (k) => (prog().stars[k] || 0) > 0 || !!prog().skipped[k];
  function unlocked() {
    if (Save.data.dev.unlockAll) return LEVELS.length;
    let n = 1;
    while (n < LEVELS.length && cleared(n - 1)) n++;
    return n;
  }
  const totalStars = () => prog().stars.reduce((a, b) => a + (b || 0), 0);
  const finalBeaten = () => (prog().stars[LEVELS.length - 1] || 0) > 0;

  // ---------- Daily Pasture: a level made from today's date, the same for everyone ----------
  function dailyLevel() {
    const day = Dates.today();
    const r = RNG(hashStr("pasture-" + day));
    const grid = Array.from({ length: 9 }, () => Array(6).fill("."));
    const kinds = r.shuffle(["rock", "ice", "sleep", "crate", "thorn"]).slice(0, 2 + r.int(2));
    const goals = {};
    let budget = 26;
    // blockers go in mirrored pairs, which reads as a designed level
    const put = (ch, n) => {
      for (let k = 0; k < n; k++) {
        const row = 1 + r.int(7);
        const col = r.int(3);
        grid[row][col] = ch;
        grid[8 - row][5 - col] = ch;
      }
    };
    for (const kind of kinds) {
      if (kind === "rock") {
        put(String(2 + r.int(2)), 2);
        goals.rocks = 1;
        budget += 10;
      } else if (kind === "ice") {
        put(r() < 0.5 ? "I" : "J", 2);
        goals.ice = 1;
        budget += 8;
      } else if (kind === "sleep") {
        put("Z", 2);
        goals.wake = 3;
        budget += 6;
      } else if (kind === "crate") {
        put("C", 2);
        goals.crates = 1;
        budget += 8;
      } else {
        put("T", 2);
        goals.thorns = 1;
        budget += 10;
      }
    }
    if (r() < 0.5) goals.chain = 8 + r.int(5);
    const L = { budget, goals, map: grid.map((row) => row.join("")).join(" "), night: r() < 0.25, daily: day };
    // the stamps never block every way through: count real goals
    if (goals.wake) goals.wake = Math.min(goals.wake, L.map.split("Z").length - 1);
    return L;
  }
  const levelOf = (lvl) => (lvl === "daily" ? dailyLevel() : LEVELS[lvl - 1]);

  // ---------- level setup ----------
  function buildLevel(G, s) {
    const lvl = s.lvl;
    const L = levelOf(lvl);
    const b = G.b;
    const rows = L.map.split(" ");
    const D = (G.data = {
      lvl, L, budget: L.budget, score: 0, maxChain: 0, woke: 0, quiet: 0, thornAt: 0, finale: null, won: false, bossHp: L.boss || 0, bossCells: [],
      ice: new Int8Array(b.size), iceMax: new Int8Array(b.size), emptyAt: 0, spread: 0, help: !!s.help, booster: s.booster || null,
    });
    // the same level always deals the same starting flock, so a retry is a fair retry
    const r = RNG(hashStr(`saga-${L.daily || lvl}`));
    for (let row = 0; row < b.rows; row++)
      for (let c = 0; c < b.cols; c++) {
        const i = row * b.cols + c;

          b.hp[i] = b.mhp[i] = Number(ch) || ROCK_DEFAULT;
