  function drawBoard(dt) {
    if (G.bgDirty) drawBackground();
    const t = G.time / 1000;
    const wall = performance.now();
    const b = G.b;
    const c = geo.cell;
    ctx.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
    ctx.clearRect(0, 0, geo.w, geo.h);
    const sk = G.shakeAmp * Math.max(0, 1 - (wall - G.shakeAt) / 300);
    if (sk) ctx.translate(Math.sin(wall * 0.09) * sk, Math.cos(wall * 0.11) * sk * 0.7);
    const bob = G.bob || 0;
    if (bob) {
      ctx.translate(geo.w / 2, geo.h / 2);
      ctx.scale(1 + 0.012 * bob, 1 + 0.012 * bob);
      ctx.translate(-geo.w / 2, -geo.h / 2);
    }
    ctx.drawImage(bg, 0, 0, geo.w, geo.h);
    ctx.translate(PAD, PAD);
    const inc = G.incoming;
    inc.fill(0);
    const fp = Math.min(1, (G.time - G.flightAt) / WAVE_MS);
    if (fp < 1) for (const f of G.flights) for (const d of f.to) inc[d]++;
    const r = c * 0.14;
    const reduced = settings().reduced;
    // smart hint: glow on the squares you may use
    const hinted = G.players.find((p) => p.hintUntil && p.kind === "human");
    for (let i = 0; i < b.size; i++) {
      if (b.rock[i]) continue;
      const x = Engine.colOf(b, i) * c;
      const y = Engine.rowOf(b, i) * c;
      const o = b.owner[i];
      if (isPlayer(o)) {
        ctx.fillStyle = tint(G.players[o].color);
        ctx.fillRect(x, y, c, c);
      }
      if (hinted && canDropAt(hinted, i)) {
        ctx.globalAlpha = 0.25 + 0.2 * Math.sin(t * 6);
        ctx.fillStyle = "#fff6c8";
        ctx.fillRect(x + 2, y + 2, c - 4, c - 4);
        ctx.globalAlpha = 1;
      }
      if (H.drawCell?.(ctx, G, i, x, y, c, t, G.time)) continue;
      const kind = b.kind[i];
      if (kind === "rock") {
        const k = nearestCursor(i);
        drawRock(ctx, x + c / 2, y + c / 2, c * 0.4, b.hp[i], b.mhp[i] || b.hp[i], (Engine.colOf(b, k) + 0.5) * c, (Engine.rowOf(b, k) + 0.5) * c);
        continue;
      }
      if (kind === "box") {
        Art.drawGift(ctx, x + c / 2, y + c / 2 + c * 0.05, c * 0.28, t + i);
        continue;
      }
      const n = b.count[i] - inc[i];
      if (n <= 0 || o < 0) continue;
      const pl = G.players[o];
      const color = o === NEUTRAL ? "#a9a9b6" : pl?.color ?? "#fff";
      const sym = o === NEUTRAL ? null : pl?.sym;
      const k = Math.min(n, 4);
      const nervous = o !== NEUTRAL && n >= Engine.capacity(b, i) - 1;
      const pa = (G.time - G.popAt[i]) / 220;
      const squash = pa < 1 && !reduced ? Math.sin(Math.PI * pa) * (1 - pa) * 0.45 : 0;
      for (let s = 0; s < k; s++) {
        const sp = SPOTS[k][s];
        const jx = nervous && !reduced ? Math.sin(t * 40 + i * 3 + s) * c * 0.02 : 0;
        const px = x + (0.5 + sp[0]) * c + jx;
        const py = y + (0.5 + sp[1]) * c;
        if (s === 0 && b.tag[i]) {
          drawSpecial(ctx, px, py, r, b.tag[i].type, color, b.tag[i].dir, t);
          continue;
        }
        const img = sprite(color, sym, s % 2 === 1, Math.round(r * 2) / 2, pl?.pattern);
        const w = img.L * (1 + squash * 0.5);
        const h = img.L * (1 - squash);
        ctx.drawImage(img, px - w / 2, py + img.L / 2 - h, w, h);
      }
      if (n > 4) {
        ctx.fillStyle = "#ffcf4a";
        ctx.font = `700 ${Math.round(c * 0.26)}px Fredoka, system-ui`;
        ctx.fillText(n, x + c * 0.72, y + c * 0.95);
      }
    }
    // sheep in flight
    if (fp < 1) {
      const e = 1 - (1 - fp) * (1 - fp);
      for (const f of G.flights) {
        const fx = (Engine.colOf(b, f.from) + 0.5) * c;
        const fy = (Engine.rowOf(b, f.from) + 0.5) * c;
        const pl = G.players[f.who];
        for (const d of f.to) {
          const tx = (Engine.colOf(b, d) + 0.5) * c;
          const ty = (Engine.rowOf(b, d) + 0.5) * c;
          const img = sprite(pl?.color ?? "#fff", pl?.sym, tx < fx, Math.round(r * 2) / 2, pl?.pattern);
          ctx.drawImage(img, fx + (tx - fx) * e - img.L / 2, fy + (ty - fy) * e - Math.sin(Math.PI * fp) * c * 0.3 - img.L / 2, img.L, img.L);
        }
      }
    }
    // special and hit effects, about half a second each
    const flashes = !settings().fewerFlashes;
    for (const f of fxPool) {
      if (!f.on) continue;
      const p = (G.time - f.t0) / 500;
      if (p >= 1 || p < 0) {
        f.on = false;
        continue;
      }
      ctx.globalAlpha = (1 - p) * (flashes ? 1 : 0.45);
      ctx.fillStyle = f.type === "overflow" ? "#ffe680" : f.color;
      for (let k = 0; k < f.n; k++) {
        const x = Engine.colOf(b, f.cells[k]) * c;
        const y = Engine.rowOf(b, f.cells[k]) * c;
        if (f.type === "overflow") Art.circle(ctx, x + c / 2, y + c / 2 - p * c * 0.4, c * 0.12, "#ffe680");
        else ctx.fillRect(x + c * 0.1 * p, y + c * 0.1 * p, c * (1 - 0.2 * p), c * (1 - 0.2 * p));
      }
      if (f.cell >= 0 && (f.type === "bomb" || f.type === "blast" || f.type === "bigcross")) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc((Engine.colOf(b, f.cell) + 0.5) * c, (Engine.rowOf(b, f.cell) + 0.5) * c, c * (0.5 + p * (f.type === "bomb" ? 1.5 : 2.5)), 0, Art.TAU);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    drawParts(ctx, dt, c);
    H.drawOver?.(ctx, G, c, t, G.time);
    drawCursors(t);
    if (settings().pen === "bar") drawEdgeBars();
    if (opts.onFrame) opts.onFrame(boardCv);
    if (G.replay?.onFrame) G.replay.onFrame(boardCv, G);
  }
  function drawParts(g, dt, c) {
    for (const p of parts) {
      if (!p.on) continue;
      p.t += dt;
      if (p.t >= p.life) {
        p.on = false;
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.00002 * c * dt;
      g.globalAlpha = 1 - p.t / p.life;
      const rr = p.r * (1 + p.t / p.life);
      if (p.shape === 0) Art.circle(g, p.x, p.y, rr, p.c);
      else {
        g.fillStyle = p.c;
        g.beginPath();
        if (p.shape === 1) g.rect(p.x - rr * 0.6, p.y - rr * 0.3, rr * 1.2, rr * 0.6);
        else if (p.shape === 2) Art.ellipse(g, p.x, p.y, rr, rr * 0.55, p.t * 0.01, p.c);
        else if (p.shape === 3) Art.starPath(g, p.x, p.y, rr * 1.3, rr * 0.55);
        else Art.heartPath(g, p.x, p.y, rr);
        g.fill();
      }
    }
    g.globalAlpha = 1;
  }

  function drawCursors(t) {
    const c = geo.cell;
    const b = G.b;
    const hc = settings().contrast;
    G.players.forEach((pl, q) => {
      if (!pl.alive || pl.observer || H.hideCursor?.(G, pl)) return;
      const i = cursorCell(pl);
      const x = Engine.colOf(b, i) * c;
      const y = Engine.rowOf(b, i) * c;
      const inset = 2 + (q % 4) * 4;
      const dots = settings().pen === "dots" && pl.kind === "human";
      const empty = pl.pen <= 0;
      const last = pl.pen === 1;
      const lw = hc ? 6 : 4;
      ctx.globalAlpha = G.time < pl.lockUntil ? 0.35 : 1;
      if (hc) {
        ctx.strokeStyle = "#000";
        ctx.lineWidth = lw + 3;
        ctx.strokeRect(x + inset, y + inset, c - inset * 2, c - inset * 2);
      }
      ctx.lineWidth = dots && last ? lw + 2 * Math.abs(Math.sin(t * 9)) : lw;
      ctx.strokeStyle = dots && empty ? "#8a8f96" : pl.color;
      if (dots && empty) ctx.setLineDash(DASH);
      ctx.strokeRect(x + inset, y + inset, c - inset * 2, c - inset * 2);
      ctx.setLineDash(EMPTY);
      if (pl.special) drawSpecial(ctx, x + c - inset - c * 0.12, y + inset + c * 0.12, c * 0.08, pl.special, pl.color, pl.lineDir, t);
      if (dots) {
        // one dot per sheep in the pen, on the side of the cursor facing its player
        const n = penCap(pl);
        const gap = Math.max(2, (c - inset * 2 - 8) / n);
        const yy = pl.seat >= 0 && !BOTTOM[pl.seat] && !G.solo ? y + inset + 5 : y + c - inset - 5;
        for (let k = 0; k < n; k++) {
          const xx = x + inset + 4 + gap * (k + 0.5);
          ctx.beginPath();
          ctx.arc(xx, yy, Math.max(0.8, Math.min(3.2, gap * 0.32)), 0, Art.TAU);
          if (k < pl.pen) {
            ctx.fillStyle = "#fffaf0";
            ctx.fill();
          } else {
            ctx.strokeStyle = "rgba(255,255,255,0.45)";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    });
  }
  const DASH = [5, 4];

  // Edge bar: a segmented bar along each human's side of the board.
  function drawEdgeBars() {
    const W = G.b.cols * geo.cell;
    const Hh = G.b.rows * geo.cell;
    const bottoms = G.players.filter((p) => p.seat >= 0 && (BOTTOM[p.seat] || G.solo) && p.kind === "human" && !p.observer);
    const tops = G.players.filter((p) => p.seat >= 0 && !BOTTOM[p.seat] && !G.solo && p.kind === "human" && !p.observer);
    for (const [list, y] of [[bottoms, Hh + 2], [tops, -PAD + 1]]) {
      list.forEach((pl) => {
        const span = W / list.length;
        const x0 = list.length === 1 ? 0 : OWN_LEFT[pl.seat] === BOTTOM[pl.seat] ? 0 : span;
        const n = penCap(pl);
        const seg = span / n;
        for (let s = 0; s < n; s++) {
          let fill = s < pl.pen ? 1 : 0;
          if (s === pl.pen && pl.refillAt) fill = Math.max(0, 1 - (pl.refillAt - G.time) / refillMs(pl));
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.fillRect(x0 + s * seg + 1, y, seg - 2, PAD - 3);
          if (fill > 0) {
            ctx.fillStyle = pl.pen <= 1 && fill >= 1 ? "#ff8a8a" : pl.color;
            ctx.fillRect(x0 + s * seg + 1, y, (seg - 2) * fill, PAD - 3);
          }
        }
      });
    }
  }

  // The bands: each player's button with its lamb, pen display, special and lock.
  function drawBands() {
    const t = G.time / 1000;
    for (const [name, g] of [["top", topCtx], ["bottom", botCtx]]) {
      const B = band[name];
      g.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
      g.clearRect(0, 0, B.w, B.h);
      if (name === "top") {
        if (G.solo) continue;
        g.translate(B.w, B.h);
        g.rotate(Math.PI);
      }
      for (let s = 0; s < 4; s++) {
        const pl = seatPlayer[s];
        if (!pl) continue;
        const onBottom = G.solo ? true : BOTTOM[s];
        if (onBottom !== (name === "bottom")) continue;
        drawButton(g, pl, rects[s], t);
      }
    }
  }

  function drawButton(g, pl, R, t) {
    if (R.w < 20 || R.h < 20) return;
    const empty = pl.pen <= 0;
    const locked = G.time < pl.lockUntil;
    const press = Math.max(0, 1 - (G.time - pl.pressAt) / 120);
    const pulse = pl.pulsing && !settings().reduced ? Math.abs(Math.sin(t * 5)) : 0;
    const x = R.x - pulse * 3;
    const y = R.y + press * 3 - pulse * 3;
    const w = R.w + pulse * 6;
    const h = R.h + pulse * 3;
    if (settings().zone === "corner" && pl.kind === "human") {
      g.fillStyle = "rgba(255,255,255,0.04)";
      const B = BOTTOM[pl.seat] || G.solo ? band.bottom : band.top;
      const zx = G.solo ? 0 : OWN_LEFT[pl.seat] ? 0 : B.w / 2;
      g.fillRect(zx, 0, G.solo ? B.w : B.w / 2, B.h);
    }
    g.fillStyle = "rgba(0,0,0,0.35)";
    g.beginPath();
    g.roundRect(x, R.y + 5, w, h, 24);
    g.fill();
    g.fillStyle = !pl.alive ? "#7b7f86" : empty ? Art.shade(pl.color, -0.45) : pl.color;
    g.beginPath();
    g.roundRect(x, y, w, h, 24);
    g.fill();
    if (settings().contrast) {
      g.strokeStyle = "#ffffff";
      g.lineWidth = 3;
      g.stroke();
    }
    if (pulse) {
      g.strokeStyle = `rgba(255,246,200,${0.4 + pulse * 0.5})`;
      g.lineWidth = 4;
      g.stroke();
    }
    const cx = x + w / 2;
    const cy = y + h / 2 + 2;
    const R2 = Math.min(w, h) * 0.42;
    if (settings().pen === "ring") {
      const n = penCap(pl);
      g.lineWidth = 7;
      g.lineCap = "round";
      for (let k = 0; k < n; k++) {
        const gap = n > 1 ? 0.32 : 0;
        const a0 = -Math.PI / 2 + (k / n) * Art.TAU + gap / 2;
        const a1 = -Math.PI / 2 + ((k + 1) / n) * Art.TAU - gap / 2;
        g.strokeStyle = "rgba(0,0,0,0.25)";
        g.beginPath();
        g.arc(cx, cy, R2, a0, a1);
        g.stroke();
        let fill = k < pl.pen ? 1 : 0;
        if (k === pl.pen && pl.refillAt) fill = Math.max(0, 1 - (pl.refillAt - G.time) / refillMs(pl));
        if (fill > 0) {
          g.strokeStyle = "#fffaf0";
          g.beginPath();
          g.arc(cx, cy, R2, a0, a0 + (a1 - a0) * fill);
          g.stroke();
        }
      }
    }
    if (settings().pen === "row" && pl.kind === "human") {
      const n = penCap(pl);
      const size = Math.min(7, (w - 8) / n / 2.6);
      for (let k = 0; k < n; k++) {
        const sx = cx + (k - (n - 1) / 2) * size * 2.6;
        let fill = k < pl.pen ? 1 : 0;
        if (k === pl.pen && pl.refillAt) fill = Math.max(0, 1 - (pl.refillAt - G.time) / refillMs(pl));
        g.globalAlpha = fill >= 1 ? 1 : 0.25 + fill * 0.4;
        const img = sprite(fill >= 1 ? pl.color : "#8a8f96", null, false, size);
        g.drawImage(img, sx - img.L / 2, ROW_H / 2 - img.L / 2, img.L, img.L);
      }
      g.globalAlpha = 1;
    }
    const m = G.time < pl.moodUntil ? pl.mood : null;
    const panic = empty && pl.alive;
    const reduced = settings().reduced;
    const jump = m === "cheer" ? Math.abs(Math.sin(t * 10)) * (reduced ? 3 : 8) : 0;
    const jit = panic && !reduced ? Math.sin(t * 50) * 2 : 0;
    const bob = (G.bob || 0) * 5;
    if (pl.wolf) Art.drawWolf(g, cx + jit, cy + 4 - jump - bob, R2 * 1.5, { t, mood: m === "oops" ? "sad" : "happy" });
    else Art.drawLamb(g, cx + jit, cy + 6 - jump - bob, R2 * 1.25, { scarf: pl.look ? undefined : pl.color, look: pl.look ? { ...pl.look, scarf: undefined } : null, t, mood: !pl.alive ? "sleep" : m === "oops" ? "sad" : m === "cheer" ? "joy" : panic ? "shock" : "happy", zzz: !pl.alive });
    if (panic) Art.ellipse(g, cx + R2 * 0.55, cy - R2 * 0.25, R2 * 0.06, R2 * 0.1, 0, "#8fd3ff");
    Art.mark(g, x + 16, y + 16, 12, pl.sym);
    if (pl.special) {
      Art.circle(g, x + w - 22, y + 22, 17, "rgba(0,0,0,0.3)");
      drawSpecial(g, x + w - 22, y + 23, 9, pl.special, pl.color, pl.lineDir, t);
    }
    if (pl.kind === "ai") {
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.font = "700 12px Fredoka, system-ui";
      g.fillText(pl.name, x + 10, y + h - 9);
    } else if (!G.solo && !pl.wolf) {
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.font = "700 12px Fredoka, system-ui";
      g.fillText(KEYS[pl.seat] && App.hasKeyboard ? `${pl.name} · ${KEYS[pl.seat]}` : pl.name, x + 10, y + h - 9);
    }
    if (locked) {
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.beginPath();
      g.roundRect(x, y, w, h, 24);
      g.fill();
      g.strokeStyle = "#fff";
      g.lineWidth = 5;
      g.beginPath();
      g.arc(cx, cy, R2 * 0.5, -Math.PI / 2, -Math.PI / 2 + Art.TAU * ((pl.lockUntil - G.time) / LOCK_MS));
      g.stroke();
    }
    if (!pl.alive) {
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.beginPath();
      g.roundRect(x, y, w, h, 24);
      g.fill();
      g.fillStyle = "#fff";
      g.font = "700 20px Fredoka, system-ui";
      g.textAlign = "center";
      g.fillText(pl.team !== pl.id && V.outLabel ? V.outLabel : "RESTING", cx, cy + 8);
      g.textAlign = "start";
    }
  }

  // ---------------- pointer input ----------------
  function onBandDown(e, name) {
    e.preventDefault();
    Sound.unlock();
    if (!G || phase !== "play") return;
    const cv = name === "top" ? topCv : botCv;
    const B = band[name];
    const r = cv.getBoundingClientRect();
    let x = e.clientX - r.left;
    let y = e.clientY - r.top;
    if (name === "top") {
      x = B.w - x;
      y = B.h - y;
    }
    for (let s = 0; s < 4; s++) {
      const pl = seatPlayer[s];
      if (!pl || pl.kind !== "human") continue;
      const onBottom = G.solo ? true : BOTTOM[s];
      if (onBottom !== (name === "bottom")) continue;
      const R = rects[s];
      const hit = settings().zone === "corner" ? G.solo || (OWN_LEFT[s] ? x < B.w / 2 : x >= B.w / 2) : x >= R.x - 10 && x <= R.x + R.w + 10 && y >= R.y - ROW_H && y <= R.y + R.h + 10;
      if (hit) {
        press(s);
        return;
      }
    }
  }

  let gameScreen = null;
  // a card in the middle of the field (a boss's name, a round's start); not during fast-forward
  let bannerTimer = 0;
  function banner(html, ms = 2000, cls = "") {
    if (quiet) return;
    const el = $("banner");
    el.className = `banner ${cls}`;
    el.innerHTML = html;
    el.hidden = false;
    void el.offsetWidth;
    el.classList.add("go");
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => (el.hidden = true), ms);
  }

  function mount() {
    gameScreen = $("scr-game");
    boardCv = $("board");
    ctx = boardCv.getContext("2d");
    topCv = $("band-top");
    botCv = $("band-bottom");
    topCtx = topCv.getContext("2d");
    botCtx = botCv.getContext("2d");
    for (let k = 0; k < 6; k++) {
      const el = document.createElement("div");
      el.className = "shout";
      el.startedAt = 0;
      $("shouts").append(el);
      shoutPool.push(el);
    }
    // every finger is handled the moment it lands, all at once
    topCv.addEventListener("pointerdown", (e) => onBandDown(e, "top"));
    botCv.addEventListener("pointerdown", (e) => onBandDown(e, "bottom"));
    new ResizeObserver(() => layout()).observe($("stage"));
    window.addEventListener("resize", () => layout());
  }

  return {
    mount, start, nextRound, pause, resume, quit, replay, press, layout, drop, shout, mood, shake, puff, spray, effect, loadSpecial, landOn, hitKind,
    buildPath, rebuildPath, cursorCell, cellsOf, orbsOf, sameTeam, isPlayer, refillMs, endRound, canDropAt, valueAt,
    drawRock, drawSpecial, sprite, penCap, now, setHud, firstHumanSeat, banner, tip: (event, pl) => showTip(event, pl),
    NEUTRAL, RANK, BOTTOM, PAD, AI, PERSONAS, PERSONA_ORDER, KEYS, ARENAS, STEP_MS,
    get G() { return G; }, get tune() { return tune; }, get setup() { return setup; }, get geo() { return geo; }, get phase() { return phase; },
    get match() { return match; }, get mode() { return V; }, get quiet() { return quiet; }, get fps() { return Perf.fps; }, get rng() { return G.rng; },
    seat: (s) => seatPlayer[s],
  };

  // HUD text above the board; skipped while a replay fast-forwards
  function setHud(html) {
    if (quiet || !G || html === G.lastHud) return;
    G.lastHud = html;
    $("hud").innerHTML = html;
  }
})();

</script>
<script>
// ============================== SHARING ==============================
// Share cards (an image with the lamb, the result and the site address), Lamb Photos, verse
// cards and Save Clip (a short video of the Chain of the Match). Then Join the Flock.
const Share = (() => {
  const url = () => CONFIG.siteUrl.replace(/^https?:\/\//, "");

  // shares a canvas as a picture, or downloads it where sharing files isn't possible
  async function canvas(cv, name, text) {
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/png"));
    return file(blob, name, text);
  }
  async function file(blob, name, text) {
    const f = new File([blob], name, { type: blob.type });
    try {
      if (navigator.canShare?.({ files: [f] })) {
        await navigator.share({ files: [f], text, title: CONFIG.appName });
        return true;
      }
    } catch (e) {
      if (e.name === "AbortError") return false;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    UI.toast("Saved to your downloads", { icon: "download" });
    return true;
  }
  async function text(t) {
    try {
      if (navigator.share) {
        await navigator.share({ text: t });
        return;
      }
    } catch (e) {
      if (e.name === "AbortError") return;
    }
    try {
      await navigator.clipboard.writeText(t);
      UI.toast("Copied! Paste it anywhere.", { icon: "check" });
    } catch {
      UI.toast(t);
    }
  }

  // the background every card shares: the pasture at golden hour
  function scene(g, W, H, part = "day") {
    Art.drawPasture(g, W, H, { t: 2, part, season: Dates.season(), dpr: 1, reduced: true });
  }
  function footer(g, W, H) {
    g.fillStyle = "rgba(255,248,236,0.92)";
    g.beginPath();
    g.roundRect(W * 0.08, H - H * 0.13, W * 0.84, H * 0.09, H * 0.045);
    g.fill();
    g.fillStyle = "#2b3a2f";
    g.textAlign = "center";
    const label = `${CONFIG.appName} · ${url()}`;
    let size = Math.round(Math.min(H * 0.032, W * 0.05));
    for (;;) {
      g.font = `600 ${size}px Fredoka, system-ui`;
      if (g.measureText(label).width < W * 0.76 || size < 12) break;
      size -= 2;
    }
    g.fillText(label, W / 2, H - H * 0.13 + H * 0.045 + size * 0.35);
  }
  function title(g, W, y, txt, size, color = "#2b3a2f") {
    g.font = `700 ${size}px Fredoka, system-ui`;
    g.textAlign = "center";
    g.lineWidth = size * 0.18;
    g.strokeStyle = "rgba(255,255,255,0.9)";
    g.strokeText(txt, W / 2, y);
    g.fillStyle = color;
    g.fillText(txt, W / 2, y);
  }

  // ---- results ----
  function resultCard(def, sum, extra) {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 1080;
    const g = cv.getContext("2d");
    const W = 1080;
    scene(g, W, W);
    const won = sum.won || !sum.humans.length;
    Art.drawLamb(g, W / 2, W * 0.6, W * 0.42, { t: 1, mood: won ? "joy" : "happy", look: Progress.look(), glow: won ? "rgba(255,220,120,0.6)" : undefined });
    title(g, W, W * 0.14, def.title, 60, "#3f8f4e");
    title(g, W, W * 0.25, sum.title, 96);
    const line = extra.shareLine || (sum.humans.length ? `Biggest chain ×${Math.max(0, ...sum.humans.map((p) => p.best))}` : "");
    if (line) title(g, W, W * 0.33, line, 52, "#5d6d5f");
    footer(g, W, W);
    return cv;
  }
  function result(def, sum, extra) {
    const cv = resultCard(def, sum, extra);
    const t = extra.shareText || `${sum.title} in ${def.title}! Play ${CONFIG.appName}: ${CONFIG.siteUrl}`;
    return canvas(cv, `${def.key}-result.png`, t);
  }

  // ---- Lamb Photo ----
  function drawPhoto(g, W) {
    scene(g, W, W, Dates.partOfDay() === "night" ? "dusk" : "day");
    Art.ellipse(g, W / 2, W * 0.8, W * 0.22, W * 0.04, 0, "rgba(0,0,0,0.18)");
    Art.drawLamb(g, W / 2, W * 0.58, W * 0.6, { t: 0.4, look: Progress.look(), mood: "happy" });
    title(g, W, W * 0.13, `${Save.profile.name === "You" ? "My" : `${Save.profile.name}'s`} lamb`, 80);
    title(g, W, W * 0.2, `Flock Level ${Save.profile.level}`, 46, "#3f8f4e");
    footer(g, W, W);
  }

  // ---- verse cards ----
  function verseCard(v) {
    const cv = document.createElement("canvas");
    cv.width = cv.height = 1080;
    const g = cv.getContext("2d");
    const W = 1080;
    scene(g, W, W, "dawn");
    g.fillStyle = "rgba(255,248,236,0.9)";
    g.beginPath();
    g.roundRect(W * 0.08, W * 0.12, W * 0.84, W * 0.56, 40);
    g.fill();
    g.fillStyle = "#2b3a2f";
    g.textAlign = "center";
    const words = v[1].split(" ");
    let size = 54;
    let lines;
    for (;;) {
      g.font = `500 ${size}px Fredoka, system-ui`;
      lines = [];
      let cur = "";
      for (const w of words) {
        const t = cur ? `${cur} ${w}` : w;
        if (g.measureText(t).width > W * 0.72 && cur) {
          lines.push(cur);
          cur = w;
        } else cur = t;
      }
      lines.push(cur);
      if (lines.length * size * 1.3 < W * 0.42 || size < 30) break;
      size -= 4;
    }
    const top = W * 0.4 - (lines.length * size * 1.3) / 2 + size;
    lines.forEach((l, k) => g.fillText(l, W / 2, top + k * size * 1.3));
    g.font = `700 ${Math.round(size * 0.85)}px Fredoka, system-ui`;
    g.fillStyle = "#3f8f4e";
    g.fillText(`${v[0]} (KJV)`, W / 2, W * 0.64);
    Art.drawLamb(g, W * 0.5, W * 0.8, W * 0.2, { t: 0, look: Progress.look(), mood: "happy" });
    footer(g, W, W);
    return canvas(cv, "verse.png", `${v[1]} (${v[0]}, KJV)`);
  }

  // ---- Save Clip: records the Chain of the Match replay into a short video ----
  // Falls back to the share card where the browser can't record video.
  function startClip(sum, def) {
    const W = 720;
    const H = 1280;
    const cv = document.createElement("canvas");
    cv.width = W;
    cv.height = H;
    const g = cv.getContext("2d");
    const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
    const type = typeof MediaRecorder !== "undefined" && types.find((t) => MediaRecorder.isTypeSupported?.(t));
    if (!type || !cv.captureStream) {
      UI.toast("This browser can't record video, so here's a picture instead", { icon: "camera" });
      result(def, sum, {});
      return null;
    }
    const bgCv = document.createElement("canvas");
    bgCv.width = W;
    bgCv.height = H;
    scene(bgCv.getContext("2d"), W, H, "day");
    const stream = cv.captureStream(30);
    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 2500000 });
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.start(250);
    const len = sum.chainRec.best.len;
    return {
      frame(board, G) {
        g.drawImage(bgCv, 0, 0);
        title(g, W, 120, def.title, 46, "#3f8f4e");
        title(g, W, 200, `Chain of the Match ×${len}`, 58);
        const s = Math.min((W - 60) / board.width, (H - 520) / board.height);
        const bw = board.width * s;
        const bh = board.height * s;
        g.drawImage(board, (W - bw) / 2, 250, bw, bh);
        Art.drawLamb(g, W / 2, Math.min(250 + bh + 100, H * 0.87 - 95), 160, { t: G.time / 1000, mood: "joy", look: Progress.look() });
        footer(g, W, H);
      },
      async finish() {
        await new Promise((ok) => {
          rec.onstop = ok;
          rec.stop();
        });
        const blob = new Blob(chunks, { type: type.split(";")[0] });
        await file(blob, `chain-of-the-match.${type.includes("mp4") ? "mp4" : "webm"}`, `Chain ×${len} in ${def.title}! ${CONFIG.siteUrl}`);
      },
    };
  }

  return { canvas, file, text, result, resultCard, drawPhoto, verseCard, startClip };
})();

// ============================== JOIN THE FLOCK ==============================
// Email sign-up for game news. Never before 3 finished games, never during play, offered only
// at happy moments, at most once a week, and never again after 3 "not now"s. The device keeps
// only the fact that you signed up, never the address.
const Flock = (() => {
  const P = () => Save.profile.flock;
  const on = () => CONFIG.flock.provider !== "none";
  function shouldAsk() {
    const f = P();
    if (!on() || f.joined || f.dismissals >= CONFIG.ask.maxDismissals) return false;
    if (Save.profile.games < CONFIG.ask.minGames) return false;
    return Date.now() - f.lastAsk >= CONFIG.ask.waitDays * 86400000;
  }
  // a gentle card on the results screen, never a pop-up
  function offer(box, happy) {
    if (!box || !happy || !shouldAsk()) return;
    P().lastAsk = Date.now();
    Save.save();
    box.innerHTML = `<div class="flock-offer">${Icons.get("mail")}<div><b>${STRINGS.flock.title}</b><small>${STRINGS.flock.blurb}</small></div>
      <div class="two"><button class="btn primary small" id="fo-yes"><span>${STRINGS.flock.send}</span></button><button class="btn ghost small" id="fo-no"><span>${STRINGS.flock.notNow}</span></button></div></div>`;
    $("fo-yes").onclick = () => Nav.go("flock");
    $("fo-no").onclick = () => {
      P().dismissals++;
      Save.save();
      box.innerHTML = "";
    };
  }
  async function send(email, who) {
    const c = CONFIG.flock;
    if (c.provider === "netlify") {
      const body = new URLSearchParams({ "form-name": c.netlifyFormName, email, signup: who, consent: "yes" });
      const r = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
      if (!r.ok) throw new Error(`status ${r.status}`);
    } else if (c.provider === "kit") {
      const body = new URLSearchParams({ email_address: email, "fields[signup]": who });
      // Kit's form endpoint doesn't allow reading the reply from another site; a sent request is enough
      await fetch(`https://app.kit.com/forms/${encodeURIComponent(c.kitFormId)}/subscriptions`, { method: "POST", mode: "no-cors", body });
    } else if (c.provider === "custom") {
      const r = await fetch(c.customUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, signup: who, consent: true }) });
      if (!r.ok) throw new Error(`status ${r.status}`);
    } else throw new Error("closed");
  }
  Nav.define("flock", {
    sheet: true,
    render(el) {
      const F = STRINGS.flock;
      if (P().joined) {
        el.innerHTML = `<div class="sheet-card"><h2>${F.title}</h2><p>${F.already}</p><button class="btn primary" id="fl-close"><span>Close</span></button></div>`;
        $("fl-close").onclick = () => Nav.back();
        return;
      }
      el.innerHTML = `<div class="sheet-card flock"><canvas id="fl-cv"></canvas><h2>${F.title}</h2><p>${F.blurb}</p>
        <form id="fl-form" novalidate>
          <label class="field"><span>${F.email}</span><input type="email" id="fl-email" autocomplete="email" inputmode="email" required></label>
          <fieldset><label class="radio"><input type="radio" name="who" value="adult"><span>${F.adult}</span></label>
          <label class="radio"><input type="radio" name="who" value="parent"><span>${F.parent}</span></label></fieldset>
          <label class="check"><input type="checkbox" id="fl-consent"><span>${F.consent} <a href="#" id="fl-privacy">${F.privacy}</a></span></label>
          <p class="msg" id="fl-msg" role="status"></p>
          <button class="btn primary big" type="submit" id="fl-send">${Icons.get("mail")}<span>${F.send}</span></button>
          <button class="btn ghost" type="button" id="fl-later"><span>${F.notNow}</span></button>
        </form></div>`;
      requestAnimationFrame(() => Art.drawLamb(Art.sharp($("fl-cv"), 120, 80), 60, 46, 70, { look: Progress.look(), mood: "joy" }));
      $("fl-privacy").onclick = (e) => {
        e.preventDefault();
        Nav.go("privacy");
      };
      $("fl-later").onclick = () => Nav.back();
      $("fl-form").onsubmit = async (e) => {
        e.preventDefault();
        const msg = $("fl-msg");
        const email = $("fl-email").value.trim();
        const who = el.querySelector("input[name=who]:checked")?.value;
        msg.className = "msg";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return (msg.textContent = F.badEmail);
        if (!who) return (msg.textContent = F.needAge);
        if (!$("fl-consent").checked) return (msg.textContent = F.needConsent);
        if (!navigator.onLine) return (msg.textContent = F.offline);
        const btn = $("fl-send");
        btn.disabled = true;
        msg.textContent = F.sending;
        try {
          await send(email, who === "adult" ? "adult" : "parent-for-child");
          P().joined = true;
          Save.save();
          msg.className = "msg ok";
          msg.textContent = F.ok;
          $("fl-email").value = "";
          Sfx.win();
          btn.hidden = true;
          $("fl-later").querySelector("span").textContent = "Close";
        } catch (err) {
          msg.className = "msg bad";
          msg.textContent = err.message === "closed" ? F.closed : navigator.onLine ? F.error : F.offline;
          btn.disabled = false;
        }
      };
    },
  });
  return { offer, shouldAsk };
})();

<script>

// ---------- art for the mode cards, drawn with code ----------
const ModeArt = (() => {
  function grass(g, w, h, a = "#4f9a52", b = "#5aa75c") {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, a);
    gr.addColorStop(1, b);
    g.fillStyle = gr;
    g.beginPath();
    g.roundRect(0, 0, w, h, 12);
    g.fill();
  }
  const COL = ["#ff5a5f", "#3fa7ff", "#ffc93c", "#2fd38a"];
  function draw(g, key, w, h, t, hero) {
    g.save();
    const s = Math.min(w, h * 1.33);
    switch (key) {
      case "stampede": {
        grass(g, w, h);
        const c = Math.min(w / 6, h / 4);
        for (let r = 0; r < 4; r++) for (let k = 0; k < 6; k++) {
          g.fillStyle = (r + k) % 2 ? "rgba(255,255,255,0.06)" : "rgba(0,0,0,0.04)";
          g.fillRect(w / 2 - 3 * c + k * c, h / 2 - 2 * c + r * c, c, c);
        }
        [[0, 0, 0], [1, 0, 0], [2, 1, 1], [3, 1, 2], [4, 3, 3], [5, 3, 1], [1, 2, 0], [3, 2, 2]].forEach(([k, r, o]) => Art.drawSheep(g, w / 2 - 3 * c + (k + 0.5) * c, h / 2 - 2 * c + (r + 0.5) * c, c * 0.3, COL[o], { flip: k % 2 }));
        g.fillStyle = "#ffcf4a";
        g.beginPath();
        g.moveTo(w * 0.62, h * 0.12);
        g.lineTo(w * 0.5, h * 0.52);
        g.lineTo(w * 0.6, h * 0.5);
        g.lineTo(w * 0.52, h * 0.9);
        g.lineTo(w * 0.72, h * 0.42);
        g.lineTo(w * 0.62, h * 0.44);
        g.closePath();
        g.globalAlpha = 0.85;
        g.fill();
        break;
      }
      case "lostlamb": {
        grass(g, w, h, "#7cc3e8", "#9fd77f");
        const gr = g.createRadialGradient(w / 2, h * 0.55, 2, w / 2, h * 0.55, s * 0.4);
        gr.addColorStop(0, "rgba(255,230,140,0.9)");
        gr.addColorStop(1, "rgba(255,230,140,0)");
        Art.circle(g, w / 2, h * 0.55, s * 0.4, gr);
        Art.drawLamb(g, w / 2, h * 0.58, s * 0.42, { t, mood: "joy" });
        Art.drawSheep(g, w * 0.15, h * 0.8, s * 0.07, COL[0]);
        Art.drawSheep(g, w * 0.85, h * 0.8, s * 0.07, COL[1], { flip: true });
        break;
      }
      case "bridge": {
        grass(g, w, h, "#4a8fbf", "#5aa75c");
        g.fillStyle = "#ffcf4a";
        g.fillRect(w * 0.06, h * 0.52, w * 0.88, h * 0.12);
        g.fillStyle = "#7b6cf0";
        g.fillRect(w * 0.46, h * 0.06, w * 0.1, h * 0.88);
        Art.drawLamb(g, w * 0.26, h * 0.46, s * 0.3, { t, scarf: "#ffcf4a" });
        break;
      }
      case "flockfall": {
        grass(g, w, h, "#6b6f7a", "#4f9a52");
        g.fillStyle = "#8a8f99";
        g.fillRect(w * 0.48, 0, w * 0.04, h);
        for (const [x, y] of [[0.2, 0.2], [0.75, 0.35], [0.3, 0.55]]) Art.ellipse(g, w * x, h * y, s * 0.07, s * 0.06, 0, "#9599a3");
        for (let k = 0; k < 3; k++) Art.drawSheep(g, w * (0.15 + k * 0.12), h * 0.85, s * 0.06, COL[0]);
        for (let k = 0; k < 3; k++) Art.drawSheep(g, w * (0.6 + k * 0.12), h * 0.85, s * 0.06, COL[1], { flip: true });
        break;
      }
      case "wolf": {
        grass(g, w, h, "#5b4b8a", "#4f9a52");
        Art.drawWolf(g, w / 2, h * 0.52, s * 0.55, { t });
        for (let k = 0; k < 4; k++) Art.drawSheep(g, w * (0.12 + k * 0.25), h * 0.9, s * 0.05, COL[k], { flip: k > 1 });
        break;
      }
      case "guard": {
        grass(g, w, h, "#ffb38a", "#4f9a52");
        g.fillStyle = "#a8794e";
        for (let k = 0; k < 7; k++) g.fillRect(w * 0.1 + k * w * 0.13, h * 0.5, 4, h * 0.3);
        g.fillRect(w * 0.1, h * 0.56, w * 0.8, 3);
        g.fillRect(w * 0.1, h * 0.7, w * 0.8, 3);
        Art.drawLamb(g, w * 0.35, h * 0.62, s * 0.22, { t, mood: "sleep", zzz: false });
        Art.drawLamb(g, w * 0.6, h * 0.64, s * 0.2, { t, mood: "sleep", zzz: false, flip: true });
        Art.drawWolf(g, w * 0.88, h * 0.3, s * 0.2, { t });
        break;
      }
      case "saga": {
        grass(g, w, h, "#8cc96b", "#56a04d");
        g.strokeStyle = "#f6e6c4";
        g.lineWidth = 5;
        g.lineCap = "round";
        g.beginPath();
        g.moveTo(w * 0.08, h * 0.85);
        g.bezierCurveTo(w * 0.4, h * 0.9, w * 0.2, h * 0.3, w * 0.6, h * 0.4);
        g.quadraticCurveTo(w * 0.9, h * 0.45, w * 0.9, h * 0.12);
        g.stroke();
        for (const [x, y] of [[0.08, 0.85], [0.33, 0.6], [0.6, 0.4], [0.9, 0.12]]) {
          g.fillStyle = "#ffcf4a";
          g.beginPath();
          Art.starPath(g, w * x, h * y, s * 0.07, s * 0.03);
          g.fill();
        }
        Art.drawLamb(g, w * 0.6, h * 0.32, s * 0.2, { t });
        break;
      }
      case "rush": {
        grass(g, w, h, "#7cc6ff", "#6cb35a");
        g.strokeStyle = "rgba(255,255,255,0.7)";
        g.lineWidth = 3;
        for (let k = 0; k < 4; k++) {
          g.beginPath();
          g.moveTo(w * 0.08, h * (0.35 + k * 0.1));
          g.lineTo(w * 0.36, h * (0.35 + k * 0.1));
          g.stroke();
        }
        Art.drawLamb(g, w * 0.6, h * 0.58, s * 0.38, { t, mood: "joy" });
        break;
      }
      case "leadhome": {
        grass(g, w, h, "#ffd9a8", "#6cb35a");
        Art.drawShepherd(g, w * 0.78, h * 0.95, h * 0.85, { t, rays: false });
        Art.drawLamb(g, w * 0.3, h * 0.72, s * 0.28, { t, mood: "happy", flip: false });
        break;
      }
      case "party": {
        grass(g, w, h, "#9b7bff", "#ff8fc7");
        for (let k = 0; k < 4; k++) Art.drawLamb(g, w * (0.16 + k * 0.23), h * 0.66 - (k % 2) * 6, s * 0.2, { t, scarf: COL[k], mood: "joy" });
        for (let k = 0; k < 14; k++) {
          g.fillStyle = COL[k % 4];
          g.fillRect((k * 37) % w, (k * 23) % (h * 0.4), 5, 3);
        }
        break;
      }
    }
    g.restore();
    void hero;
  }
  return { draw };
})();

// ---------- the "?" cards: three swipeable, animated cards per mode ----------
Nav.define("help", {
  sheet: true,
  render(el, { key }) {
    const def = Modes.get(key);
    const cards = def.help || [];
    el.innerHTML = `<div class="sheet-card help"><h2>${esc(def.title)}</h2><div class="help-track" id="help-track"></div><div class="help-dots" id="help-dots"></div><button class="btn primary" id="help-done">${Icons.get("check")}<span>Got it</span></button></div>`;
    const track = $("help-track");
    const dots = $("help-dots");
    cards.forEach((c, k) => {
      const card = UI.h("div", { class: "help-card" }, UI.h("canvas"), UI.h("b", {}, c.title), UI.h("p", {}, c.text));
      track.append(card);
      dots.append(UI.h("i", { class: k === 0 ? "on" : "" }));
      requestAnimationFrame(() => UI.liveCanvas(card.querySelector("canvas"), 240, 150, (g, t) => c.draw(g, 240, 150, t)));
    });
    track.addEventListener("scroll", () => {
      const k = Math.round(track.scrollLeft / track.clientWidth);
      [...dots.children].forEach((d, j) => d.classList.toggle("on", j === k));
    }, { passive: true });
    $("help-done").onclick = () => Nav.back();
  },
});

// ---------- WARDROBE ----------
let wardrobeTab = "lamb";
let wardrobeSel = null;
Nav.define("wardrobe", {
  render(el) {
    const p = Save.profile;
    el.replaceChildren(UI.header(STRINGS.home.wardrobe, { right: UI.h("span", { class: "chip", html: `${Icons.get("wool")}<b id="wd-wool">${fmtNum(p.wool)}</b>` }) }));
    const page = UI.h("div", { class: "page wardrobe" });
    const prev = UI.h("canvas", { class: "wd-preview" });
    const action = UI.h("div", { class: "wd-action" });
    const tabs = UI.seg(Progress.TABS.map(([id, label, icon]) => [id, label, icon]), wardrobeTab, (v) => {
      wardrobeTab = v;
      wardrobeSel = null;
      Nav.refresh();
    }, "tabs");
    const grid = UI.h("div", { class: "items" });
    page.append(UI.h("div", { class: "wd-stage" }, prev, UI.h("button", { class: "ib photo", "aria-label": "Lamb Photo", onclick: () => Nav.go("photo"), html: Icons.get("camera") })), action, tabs, grid);
    el.append(page);
    const items = Progress.ITEMS.filter((it) => it.tab === wardrobeTab && Progress.forSale(it));
    const equippedId = (it) => p.equipped[it.slot];
    const sel = () => Progress.BY_ID.get(wardrobeSel) || items.find((it) => equippedId(it) === it.id) || items[0];
    for (const it of items) {
      const cv = UI.h("canvas");

// a small picture of each item
function swatch(g, it, w, h) {
  const look = Progress.look();
  const pal = App.palette();
  if (it.slot === "hat" || it.slot === "scarf" || it.slot === "bell" || it.slot === "glasses") {
    // close up on the head, where these are worn
    const lk = { ...look, hat: "hat-none", glasses: "glasses-none", bell: "bell-none", [it.slot]: it.id };
    if (it.slot !== "scarf") lk.scarf = "scarf-none";
    const s = h * 1.7;
    const hy = it.slot === "hat" ? h * 0.66 : it.slot === "glasses" ? h * 0.52 : h * 0.36;
    Art.drawLamb(g, w / 2 - 0.22 * s, hy + 0.2 * s, s, { look: lk, still: true });
  } else if (it.slot === "wool") {
    Art.drawLamb(g, w / 2, h * 0.6, h * 1.05, { look: { ...look, wool: it.id }, still: true });
  } else if (it.slot === "pattern") Art.drawSheep(g, w / 2, h / 2, h * 0.3, pal.colors[1], { pattern: it.id });
  else if (it.slot === "trail" || it.slot === "burst") {
    const cols = { "trail-sparkle": ["#fff6c8"], "trail-hearts": ["#ff8fb1"], "trail-stars": ["#ffe680"], "trail-petals": ["#ffc2d9"], "trail-rainbow": ["#ff5a5f", "#ffc93c", "#2fd38a", "#3fa7ff"], "trail-fireflies": ["#fff27a", "#d7ff7a"], "burst-confetti": ["#ff5a5f", "#ffc93c", "#2fd38a", "#3fa7ff"], "burst-flowers": ["#ff9ac1", "#fff"], "burst-stars": ["#ffe680"], "burst-hearts": ["#ff6f91"], "burst-gold": ["#ffcf4a", "#e0a82e"], "burst-puff": ["#ffffff", "#dfe6ee"] }[it.id] || ["#c9cfc6"];
    g.fillStyle = "#3d7a45";
    g.beginPath();
    g.roundRect(4, 4, w - 8, h - 8, 10);
    g.fill();
    for (let k = 0; k < 7; k++) {
      const a = (k / 7) * Art.TAU;
      const x = w / 2 + Math.cos(a) * h * 0.28;
      const y = h / 2 + Math.sin(a) * h * 0.28;
      g.fillStyle = cols[k % cols.length];
      g.beginPath();
      if (/heart/.test(it.id)) Art.heartPath(g, x, y, 4.5);
      else if (/star|gold|sparkle/.test(it.id)) Art.starPath(g, x, y, 6, 2.5);
      else g.arc(x, y, 3.5, 0, Art.TAU);
      g.fill();
    }
    if (it.id === "trail-none") {
      g.strokeStyle = "rgba(255,255,255,0.5)";
      g.lineWidth = 2;
      g.strokeRect(w / 2 - 10, h / 2 - 10, 20, 20);
    }
  } else if (it.slot === "arena") {
    const th = Core.ARENAS[it.id];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
      g.fillStyle = (r + c) % 2 ? th.grass[0] : th.grass[1];
      g.fillRect(6 + c * ((w - 12) / 4), 6 + r * ((h - 12) / 3), (w - 12) / 4, (h - 12) / 3);
    }
    if (it.id === "arena-bethlehem") Art.drawBethlehemStar(g, w * 0.75, h * 0.3, 5, 0);
  }
}
function preview(g, w, h, t, it) {
  const look = Progress.look();
  const pal = App.palette();
  const lk = it.tab === "lamb" || it.slot === "wool" ? { ...look, [it.slot]: it.id } : look;
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, "#d8efff");
  sky.addColorStop(1, "#fff8ec");
  g.fillStyle = sky;
  g.fillRect(0, 0, w, h);
  Art.ellipse(g, w / 2, h * 0.92, w * 0.45, h * 0.1, 0, "#9fd77f");
  if (it.slot === "pattern") {
    for (let k = 0; k < 3; k++) Art.drawSheep(g, w / 2 + (k - 1) * 70, h * 0.6, 22, pal.colors[k], { pattern: it.id, flip: k === 2 });
    return;
  }
  if (it.slot === "arena") {
    const th = Core.ARENAS[it.id];
    const c = 26;
    for (let r = 0; r < 5; r++) for (let k = 0; k < 9; k++) {
      g.fillStyle = (r + k) % 2 ? th.grass[0] : th.grass[1];
      g.fillRect(w / 2 - 4.5 * c + k * c, 18 + r * c, c, c);
    }
    Art.drawSheep(g, w / 2 - c, 18 + 2.5 * c, 8, pal.colors[0]);
    Art.drawSheep(g, w / 2 + 2 * c, 18 + 1.5 * c, 8, pal.colors[1]);
    return;
  }
  Art.drawLamb(g, w / 2, h * 0.58, h * 0.78, { t, look: lk, mood: Math.sin(t * 0.7) > 0.85 ? "joy" : "happy", blink: t % 3 < 0.12 });
  if (it.slot === "trail" || it.slot === "burst") {
    const cols = { "trail-sparkle": "#fff6c8", "trail-hearts": "#ff8fb1", "trail-stars": "#ffe680", "trail-petals": "#ffc2d9", "trail-rainbow": "#9b7bff", "trail-fireflies": "#fff27a", "burst-confetti": "#3fa7ff", "burst-flowers": "#ff9ac1", "burst-stars": "#ffe680", "burst-hearts": "#ff6f91", "burst-gold": "#ffcf4a" }[it.id];
    if (!cols) return;
    for (let k = 0; k < 10; k++) {
      const a = t * 1.5 + (k / 10) * Art.TAU;
      const r = 70 + 10 * Math.sin(t * 3 + k);
      g.fillStyle = it.id === "trail-rainbow" ? ["#ff5a5f", "#ffc93c", "#2fd38a", "#3fa7ff", "#9b7bff"][k % 5] : cols;
      g.beginPath();
      if (/heart/.test(it.id)) Art.heartPath(g, w / 2 + Math.cos(a) * r, h * 0.5 + Math.sin(a) * r * 0.45, 6);
      else Art.starPath(g, w / 2 + Math.cos(a) * r, h * 0.5 + Math.sin(a) * r * 0.45, 7, 3);
      g.fill();
    }
  }
}
