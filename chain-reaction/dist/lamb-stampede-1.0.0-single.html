        else if (ch === "G") b.kind[i] = "gate";
        else if (ch === "Z") b.kind[i] = "sleep";
        else if (ch === "C") b.kind[i] = "crate";
        else if (ch === "B") {
          b.kind[i] = "boss";
          D.bossCells.push(i);
        } else if (ch === "I" || ch === "J") {
          D.ice[i] = D.iceMax[i] = ch === "I" ? 1 : 2;
          b.owner[i] = 0;
          b.count[i] = 1 + r.int(Engine.capacity(b, i) - 1);
        } else if (r() < (L.fill ?? SAGA.fill)) {
          b.owner[i] = 0;
          b.count[i] = 1 + r.int(Engine.capacity(b, i) - 1);
        }
      }
    D.thornAt = SAGA.thornSpreadSecs * 1000;
    const p0 = G.players[0];
    if (D.booster === "plus") D.budget += SAGA.boosterPlus;
    else if (D.booster) p0.special = D.booster;
    // the Shepherd's help: a few more sheep and a Line sheep ready
    if (D.help) {
      D.budget += SAGA.helpSheep;
      if (!p0.special) p0.special = "line";
    }
    D.startBudget = D.budget;
    p0.placed = true;
  }

  let rockCount = 0;
  const count = (G, kind) => {
    let n = 0;
    for (let i = 0; i < G.b.size; i++) if (G.b.kind[i] === kind) n++;
    return n;
  };
  const iceLeft = (G) => {
    let n = 0;
    for (let i = 0; i < G.b.size; i++) if (G.data.ice[i] > 0) n++;
    return n;
  };
  const playable = (G) => {
    let n = 0;
    for (let i = 0; i < G.b.size; i++) if (!G.b.kind[i]) n++;
    return n;
  };
  const ownPct = (G) => Math.floor((100 * S.cellsOf(0)) / Math.max(1, playable(G)));

  // [goal, left-or-progress, done, share done (0..1)]
  function goalState(G) {
    const D = G.data;
    const out = [];
    for (const [g, v] of Object.entries(D.L.goals)) {
      if (g === "rocks" || g === "thorns" || g === "crates") {
        const n = count(G, g === "rocks" ? "rock" : g === "thorns" ? "thorn" : "crate");
        D.start ??= {};
        D.start[g] ??= Math.max(1, n);
        out.push([g, n, n === 0, 1 - n / D.start[g]]);
      }
      if (g === "ice") {
        const n = iceLeft(G);
        D.start ??= {};
        D.start.ice ??= Math.max(1, n);
        out.push([g, n, n === 0, 1 - n / D.start.ice]);
      }
      if (g === "wake") out.push([g, `${Math.min(D.woke, v)}/${v}`, D.woke >= v, D.woke / v]);
      if (g === "chain") out.push([g, `${Math.min(D.maxChain, v)}/${v}`, D.maxChain >= v, D.maxChain / v]);
      if (g === "own") out.push([g, `${Math.min(ownPct(G), v)}%`, ownPct(G) >= v, ownPct(G) / v]);
      if (g === "boss") out.push([g, D.bossHp, D.bossHp <= 0, 1 - D.bossHp / D.L.boss]);
    }
    return out;
  }
  const goalPills = (goals) => goals.map(([g, v, ok]) => `<span class="obj${ok ? " ok" : ""}">${Icons.get(GOAL_ICONS[g])}<b>${ok ? Icons.get("check") : esc(v)}</b></span>`).join("");
  const goalPreview = (L) => goalPills(Object.entries(L.goals).map(([g, v]) => [g, g === "boss" ? L.boss : g === "own" ? `${v}%` : g === "wake" || g === "chain" ? v : "all", false]));

  // ---------- blockers ----------
  // A sheep (from a burst or a special) reaching one of this game's blockers. True when it took the sheep.
  function hitBlocker(G, i, who) {
    const b = G.b;
    const D = G.data;
    const mine = who === 0;
    if (D.ice[i] > 0) {
      D.ice[i]--;
      if (mine) D.score += SAGA.points.ice;
      S.effect("hit", i, "#bfe9ff", G.time);
      S.puff(i, "#bfe9ff", 5);
      Sfx.chime(D.ice[i] ? 9 : 14);
      return true;
    }
    const kind = b.kind[i];
    if (!kind || kind === "rock") {
      if (kind === "rock" && mine) D.score += SAGA.points.hit;
      return false; // rocks are the core's
    }
    if (kind === "boss") {
      D.bossHp--;
      if (mine) D.score += SAGA.points.hit;
      Sfx.hit(Math.min(8, D.bossHp));
      for (const k of D.bossCells) S.effect("hit", k, "#ffffff", G.time);
      S.shake(3);
      if (D.bossHp <= 0) {
        for (const k of D.bossCells) {
          b.kind[k] = null;
          S.puff(k, "#9aa0aa", 10);
        }
        D.score += SAGA.points.rock * 5;
        S.shout(G.players[0], "Crumbled!", 1.6);
        Sfx.crack();
        S.shake(12);
        S.rebuildPath();
      }
      return true;
    }
    b.kind[i] = null;
    if (kind === "thorn") {
      if (mine) D.score += SAGA.points.thorn;
      D.thornAt = G.time + SAGA.thornSpreadSecs * 1000;
      Sfx.blip(700, 0.08, "triangle", 0.06, 300);
      S.puff(i, "#7bd36b", 6);
    } else if (kind === "gate") {
      if (mine) D.score += SAGA.points.gate;
      Sfx.blip(220, 0.12, "triangle", 0.07, 120);
      S.puff(i, "#c08a4a", 6);
    } else if (kind === "crate") {
      if (mine) D.score += SAGA.points.crate;
      if (S.isPlayer(who)) S.loadSpecial(G.players[who], G.rng.pick(["line", "bomb", "line", "bomb", "overflow"]));
      Sfx.crack();
      S.puff(i, "#b07a40", 8);
    } else if (kind === "sleep") {
      // the lost sheep wakes up and joins whoever reached him
      b.owner[i] = who;
      b.count[i] = 1;
      if (mine) {
        D.woke++;
        D.score += SAGA.points.wake;
        Sfx.bleat(1.3);
      }
      S.puff(i, G.players[who]?.color ?? "#fff", 6);
    }
    return true;
  }

  function spreadThorn(G) {
    const b = G.b;
    const thorns = [];
    for (let i = 0; i < b.size; i++) if (b.kind[i] === "thorn") thorns.push(i);
    G.rng.shuffle(thorns);
    for (const t of thorns) {
      const free = Engine.neighbours(b, t).filter((k) => !b.kind[k] && b.owner[k] === -1);
      if (free.length) {
        b.kind[G.rng.pick(free)] = "thorn";
        G.data.spread++;
        Sfx.blip(160, 0.15, "triangle", 0.06, 110);
        return;
      }
    }
  }

  // The celebration: leftover sheep fly in as Line and Bomb sheep and go off one by one.
  function finaleStep(G, now) {
    const D = G.data;
    const b = G.b;
    if (now < D.finale.next || D.budget <= 0) return;
    D.finale.next = now + SAGA.finaleGap;
    D.budget--;
    D.score += SAGA.points.leftover;
    if (D.finale.flown >= SAGA.finaleMax) return;
    D.finale.flown++;
    const spots = [];
    for (let i = 0; i < b.size; i++) if (!b.kind[i] && !b.tag[i] && !D.ice[i] && (b.owner[i] === 0 || b.owner[i] === -1)) spots.push(i);
    if (!spots.length) return;
    const i = G.rng.pick(spots);
    b.owner[i] = 0;
    b.count[i] = Engine.capacity(b, i);
    b.tag[i] = G.rng() < 0.5 ? { type: "line", dir: G.rng() < 0.5 ? "row" : "col" } : { type: "bomb", dir: null };
    S.puff(i, "#ffcf4a", 6);
    Sfx.blip(500 + D.finale.flown * 40, 0.12, "triangle", 0.07, 900 + D.finale.flown * 40);
  }
  function starsFor(D) {
    const left = D.finale.left / D.startBudget;
    return D.help ? 1 : left >= SAGA.stars[1] ? 3 : left >= SAGA.stars[0] ? 2 : 1;
  }

  // ---------- drawing ----------
  function drawThorn(g, cx, cy, r, t) {
    g.strokeStyle = "#2c5a2a";
    g.lineWidth = r * 0.12;
    g.beginPath();
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Art.TAU + Math.sin(t * 2) * 0.05;
      g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    g.stroke();
    Art.circle(g, cx, cy, r * 0.55, "#3f7a35");
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * Art.TAU + 0.3;
      Art.circle(g, cx + Math.cos(a) * r * 0.35, cy + Math.sin(a) * r * 0.35, r * 0.08, "#c94a6a");
    }
  }
  function drawGate(g, x, y, c) {
    g.fillStyle = "#8a5a2b";
    for (const px of [0.18, 0.5, 0.82]) g.fillRect(x + c * px - c * 0.05, y + c * 0.15, c * 0.1, c * 0.75);
    g.fillStyle = "#b07a40";
    for (const py of [0.3, 0.62]) g.fillRect(x + c * 0.08, y + c * py, c * 0.84, c * 0.1);
  }
  function drawCrate(g, x, y, c) {
    const s = c * 0.7;
    const x0 = x + (c - s) / 2;
    const y0 = y + (c - s) / 2;
    g.fillStyle = "#b07a40";
    g.fillRect(x0, y0, s, s);
    g.strokeStyle = "#6e4720";
    g.lineWidth = c * 0.06;
    g.strokeRect(x0, y0, s, s);
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(x0 + s, y0 + s);
    g.moveTo(x0 + s, y0);
    g.lineTo(x0, y0 + s);
    g.stroke();
    Art.circle(g, x + c / 2, y + c / 2, c * 0.13, "#ffcf4a");
  }
  function drawSleeper(g, cx, cy, r, t) {
    Art.drawSheep(g, cx, cy, r, SLEEP);
    g.fillStyle = "#e8f0ff";
    g.font = `700 ${Math.round(r * 0.9)}px Fredoka, system-ui`;
    g.fillText("z", cx + r * 0.8, cy - r * 0.9 - Math.sin(t * 2) * r * 0.2);
  }
  function drawIce(g, x, y, c, hp, max, t) {
    g.fillStyle = hp > 1 ? "rgba(170,225,255,0.62)" : "rgba(190,235,255,0.45)";
    g.beginPath();
    g.roundRect(x + 3, y + 3, c - 6, c - 6, 6);
    g.fill();
    g.strokeStyle = "rgba(255,255,255,0.85)";
    g.lineWidth = 1.5;
    g.stroke();
    g.beginPath();
    g.moveTo(x + c * 0.2, y + c * 0.3);
    g.lineTo(x + c * 0.35, y + c * 0.18);
    g.moveTo(x + c * 0.72, y + c * 0.75);
    g.lineTo(x + c * 0.82, y + c * 0.62);
    if (hp < max) {
      g.moveTo(x + c * 0.5, y + c * 0.1);
      g.lineTo(x + c * 0.42, y + c * 0.45);
      g.lineTo(x + c * 0.6, y + c * 0.62);
      g.lineTo(x + c * 0.5, y + c * 0.9);
    }
    g.stroke();
    g.globalAlpha = 0.25 + 0.2 * Math.sin(t * 3 + x);
    g.fillStyle = "#fff";
    g.fillRect(x + c * 0.15, y + c * 0.12, c * 0.08, c * 0.3);
    g.globalAlpha = 1;
  }

  // the dawn over Night Valley, once the last boss falls
  function drawDawn(g, w, h, t) {
    const p = Math.min(1, t / 3);
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, Art.alpha("#20305a", 1 - p * 0.7));
    sky.addColorStop(0.6, "#ff9e7a");
    sky.addColorStop(1, "#ffe3b0");
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);
    const sy = h * (0.95 - p * 0.35);
    const sun = g.createRadialGradient(w / 2, sy, 4, w / 2, sy, h * 0.8);
    sun.addColorStop(0, "rgba(255,240,180,0.95)");
    sun.addColorStop(1, "rgba(255,240,180,0)");
    g.fillStyle = sun;
    g.fillRect(0, 0, w, h);
    Art.circle(g, w / 2, sy, h * 0.12, "#fff3b8");
    g.fillStyle = "#2b4f4a";
    g.beginPath();
    g.moveTo(0, h);
    for (let x = 0; x <= w; x += 8) g.lineTo(x, h * 0.78 + Math.sin(x / 40) * 8);
    g.lineTo(w, h);
    g.fill();
    Art.drawShepherd(g, w * 0.78, h * 0.82, h * 0.6, { t, rays: true });
    const jump = Save.settings.reduced ? 0 : Math.abs(Math.sin(t * 5)) * 8;
    Art.drawLamb(g, w * 0.38, h * 0.66 - jump, h * 0.55, { t, mood: "joy", look: Progress.look() });
  }

  // ---------- the world map ----------
  const MAP = { gap: 84, top: 80, bottom: 70 };
  const nodeY = (k) => MAP.top + (LEVELS.length - 1 - k) * MAP.gap;
  const nodeX = (k, w) => w / 2 + Math.sin(k * 0.9) * w * 0.3;
  let mapSel = 1;
  let walkFrom = 0;
  let panel = { booster: null, help: true };
  const sec = document.createElement("section");
  sec.className = "screen saga-map";
  sec.id = "scr-sagamap";
  sec.hidden = true;
  document.body.append(sec);

  Nav.define("sagamap", {
    render(el, params) {
      const p = prog();
      const open = unlocked();
      mapSel = Math.min(open, params.sel ?? open);
      el.innerHTML = "";
      el.append(UI.header("Sheep Saga", { right: UI.h("span", { class: "chip", html: `${Icons.get("star")}<b>${totalStars()}</b>` }) }));
      const scroll = UI.h("div", { class: "map-scroll" });
      const inner = UI.h("div", { class: "map-inner" });
      const cv = UI.h("canvas");
      const lambCv = UI.h("canvas", { class: "map-lamb" });
      inner.append(cv, lambCv);
      scroll.append(inner);
      const panelEl = UI.h("div", { class: "map-panel" });
      el.append(scroll, panelEl);
      const w = Math.min(460, el.clientWidth || 390);
      const h = MAP.top + MAP.bottom + (LEVELS.length - 1) * MAP.gap;
      inner.style.height = `${h}px`;
      inner.style.width = `${w}px`;
      drawMap(Art.sharp(cv, w, h), w, h);
      WORLDS.forEach((wd, k) => {
        const lab = UI.h("div", { class: "world-label" }, wd.name);
        lab.style.top = `${nodeY(k * PER_WORLD) + 44}px`;
        inner.append(lab);
      });
      LEVELS.forEach((L, k) => {
        const n = k + 1;
        const stars = p.stars[k] || 0;
        const locked = n > open;
        const btn = UI.h("button", {
          class: `node${L.boss ? " boss" : ""}${locked ? " locked" : stars ? " done" : p.skipped[k] ? " skipped" : ""}${n === mapSel ? " sel" : ""}`,
          "aria-label": `Level ${n}${locked ? ", locked" : ""}`,
          html: `${locked ? Icons.get("lock") : L.boss ? Icons.get("crown") : `<b>${n}</b>`}<span class="st">${locked ? "" : [0, 1, 2].map((s) => Icons.get(s < stars ? "star" : "starOutline")).join("")}</span>`,
        });
        btn.style.left = `${nodeX(k, w)}px`;
        btn.style.top = `${nodeY(k)}px`;
        btn.onclick = () => {
          if (locked) return UI.toast("Clear the level before it first", { icon: "lock" });
          mapSel = n;
          inner.querySelectorAll(".node.sel").forEach((e) => e.classList.remove("sel"));
          btn.classList.add("sel");
          placeLamb(n, false);
          renderPanel(panelEl);
        };
        inner.append(btn);
      });
      const lg = Art.sharp(lambCv, 64, 56);
      Art.drawLamb(lg, 32, 30, 50, { look: Progress.look(), mood: "happy" });
      const placeLamb = (n, instant) => {
        if (instant) lambCv.style.transition = "none";
        lambCv.style.left = `${nodeX(n - 1, w)}px`;
        lambCv.style.top = `${nodeY(n - 1)}px`;
        if (instant) {
          void lambCv.offsetWidth;
          lambCv.style.transition = "";
        }
      };
      placeLamb(params.walk && walkFrom ? walkFrom : mapSel, true);
      if (params.walk && walkFrom) {
        setTimeout(() => {
          placeLamb(mapSel, false);
          Sfx.bleat(1.2);
        }, 300);
        walkFrom = 0;
        params.walk = false;
      }
      requestAnimationFrame(() => (scroll.scrollTop = nodeY(mapSel - 1) - scroll.clientHeight * 0.55));
      renderPanel(panelEl);
    },
    onShow() {
      const m = WORLDS[worldOf(mapSel)].music;
      Music.play(m.song, "gentle", m.bpm - 20);
      Music.setLayer(0);
    },
  });

  function drawMap(g, w, h) {
    // each world a band of its own sky, with a winding path through them
    for (let wd = 0; wd < 3; wd++) {
      const yTop = wd === 2 ? 0 : nodeY(wd * PER_WORLD + PER_WORLD - 1) - MAP.gap / 2;
      const yBot = wd === 0 ? h : nodeY(wd * PER_WORLD) + MAP.gap / 2;
      const cols = wd === 2 && finalBeaten() ? WORLDS[2].dawn : WORLDS[wd].sky;
      const gr = g.createLinearGradient(0, yTop, 0, yBot);
      gr.addColorStop(0, cols[0]);
      gr.addColorStop(1, cols[1]);
      g.fillStyle = gr;
      g.fillRect(0, yTop, w, yBot - yTop);
      const r = RNG(wd + 3);
      for (let k = 0; k < 26; k++) {
        const tx = r() * w;
        const ty = yTop + r() * (yBot - yTop);
        if (wd === 0) {
          Art.circle(g, tx, ty, 2.5, ["#ffffff", "#ffd84a", "#ff9ac1"][k % 3]);
        } else if (wd === 1) Art.ellipse(g, tx, ty, 16, 10, 0, "rgba(90,70,40,0.18)");
        else if (!finalBeaten()) Art.circle(g, tx, ty, 1.6, "rgba(255,255,230,0.7)");
        else Art.circle(g, tx, ty, 2.2, "rgba(255,255,255,0.35)");
      }
    }
    g.strokeStyle = "#c8a46a";
    g.lineWidth = 14;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.beginPath();
    for (let k = 0; k < LEVELS.length; k++) (k ? g.lineTo : g.moveTo).call(g, nodeX(k, w), nodeY(k));
    g.stroke();
    g.setLineDash([6, 10]);
    g.strokeStyle = "#f3e2b8";
    g.lineWidth = 3;
    g.stroke();
    g.setLineDash([]);
  }

  function renderPanel(box) {
    const n = mapSel;
    const L = LEVELS[n - 1];
    const p = prog();
    const fails = p.fails[n - 1] || 0;
    const canHelp = fails >= SAGA.helpAfter && !(p.stars[n - 1] > 0);
    const canSkip = fails >= SAGA.skipAfter && !cleared(n - 1) && n < LEVELS.length;
    panel.booster = null;
    panel.help = canHelp;
    box.innerHTML = `<h3>${L.boss ? `${Icons.get("crown")} Boss · ` : ""}Level ${n} <small>${WORLDS[worldOf(n)].name}</small></h3>
      <div class="goals">${goalPreview(L)}<span class="obj">${Icons.get("sheep")}<b>${L.budget}</b></span></div>
      <div class="boosters" id="sg-boost"></div>
      ${canHelp ? `<label class="help-row"><span>${Icons.get("crook")} ${STRINGS.grace.help}</span></label>` : ""}
      <button class="btn primary big" id="sg-play">${Icons.get("play")}<span>Play level ${n}</span></button>
      ${canSkip ? `<button class="btn ghost" id="sg-skip"><span>${STRINGS.grace.skip}</span></button>` : ""}`;
    if (canHelp) {
      const row = box.querySelector(".help-row");
      row.append(UI.toggle(true, (v) => (panel.help = v), STRINGS.help));
    }
    const bb = box.querySelector("#sg-boost");
    for (const [k, label, icon] of BOOSTERS) {
      const have = p.boosters[k] || 0;
      const b = UI.h("button", { class: "boost", disabled: !have, html: `${Icons.get(icon)}<span>${esc(label)}</span><small>×${have}</small>` });
      b.onclick = () => {
        panel.booster = panel.booster === k ? null : k;
        bb.querySelectorAll(".boost").forEach((x) => x.classList.remove("on"));
        if (panel.booster) b.classList.add("on");
      };
      bb.append(b);
    }
    box.querySelector("#sg-play").onclick = () => playLevel(n);
    const skip = box.querySelector("#sg-skip");
    if (skip) skip.onclick = () => {
      p.skipped[n - 1] = true;
      Save.save();
      walkFrom = n;
      Nav.go("sagamap", { sel: n + 1, walk: true }, { replace: true });
    };
  }

  function playLevel(n, o = {}) {
    const p = prog();
    const s = { lvl: n, help: o.help ?? panel.help, booster: o.booster ?? panel.booster };
    if (s.booster) {
      p.boosters[s.booster]--;
      Save.save();
    }
    Save.mode("saga").setup = { lvl: n };
    Save.save();
    App.play("saga", s);
  }

  // ---------- the mode ----------
  Modes.register({
    key: "saga",
    title: "Sheep Saga",
    how: ["Clear the goals before your sheep run out.", "Break rocks, crack ice, wake lost sheep and beat the bosses!"],
    solo: true,
    get music() {
      const lvl = S.setup?.lvl ?? 1;
      return WORLDS[worldOf(lvl)].music;
    },
    setupDefaults: { lvl: 1 },
    // Play and Continue go straight to the next level; the card opens the map
    open: () => Nav.go("sagamap", {}),
    continueSetup: () => ({ lvl: unlocked() }),
    continueLabel: () => `Level ${unlocked()}`,
    bestLine: () => `Level ${unlocked()} · ${totalStars()} stars`,
    daily: () => App.play("saga", { lvl: "daily" }, { seed: hashStr("pasture-play-" + Dates.today()) }),
    dailyDone: () => !!prog().daily[Dates.today()],
    theme: (s) => WORLDS[worldOf(s.lvl)].theme,
    players(s) {
      const L = levelOf(s.lvl);
      const list = [{ seat: 0, kind: s.bot ? "ai" : "human", level: s.bot || null }];
      if (L.wolf) list.push({ seat: -1, kind: "ai", level: L.wolf, color: WOLF, name: "Wolf", team: 1, pos: 27, persona: "sneaky" });
      return list;
    },
    tips: [
      { id: "rock", on: "start", icon: "rock", text: "Burst next to rocks to crack them", when: (G) => G.data.L.teach === "rock" },
      { id: "sleep", on: "start", icon: "zzz", text: "Reach lost sheep with a burst", when: (G) => G.data.L.teach === "sleep" },
      { id: "gate", on: "start", icon: "flag", text: "Bursts knock gates down", when: (G) => G.data.L.teach === "gate" },
      { id: "crate", on: "start", icon: "crate", text: "Crates hold a special sheep", when: (G) => G.data.L.teach === "crate" },
      { id: "ice", on: "start", icon: "ice", text: "Crack the ice with bursts", when: (G) => G.data.L.teach === "ice" },
      { id: "ice2", on: "start", icon: "ice", text: "Thick ice needs two cracks", when: (G) => G.data.L.teach === "ice2" },
      { id: "boss", on: "start", icon: "crown", text: "Burst into the big rock!", when: (G) => G.data.L.teach === "boss" },
      { id: "thorn", on: "start", icon: "thorn", text: "Clear thorns before they spread", when: (G) => G.data.L.teach === "thorn" },
      { id: "wolf", on: "start", icon: "wolf", text: "The wolf wants your pasture!", when: (G) => G.data.L.teach === "wolf" },
      { id: "night", on: "start", icon: "moon", text: "Your lantern lights the way", when: (G) => G.data.L.teach === "night" },
    ],
    help: [
      { title: "Clear the goals", text: "The icons at the top are your goals. Clear them all before your sheep run out.", draw: (g, w, h, t) => helpGoals(g, w, h, t) },
      { title: "Bursts do the work", text: "Rocks, ice, gates and crates only break when a burst reaches them. Plan your chains.", draw: (g, w, h, t) => helpBreak(g, w, h, t) },
      { title: "Spare sheep shine", text: "Sheep left over fly in as specials. More left over means more stars.", draw: (g, w, h, t) => helpStars(g, w, h, t) },
    ],
    badges: [
      { id: "first", icon: "leaf", name: "First pasture", desc: "Clear level 1", test: (c) => c.won && c.setup.lvl === 1 },
      { id: "w1", icon: "leaf", name: "Green Pastures", desc: "Beat the level 15 boss", test: (c) => c.won && c.setup.lvl === 15 },
      { id: "w2", icon: "rock", name: "Rocky Hills", desc: "Beat the level 30 boss", test: (c) => c.won && c.setup.lvl === 30 },
      { id: "w3", icon: "sun", name: "Dawn in the valley", desc: "Beat the final boss", test: (c) => c.won && c.setup.lvl === 45 },
      { id: "three", icon: "star", name: "Shining", desc: "3 stars on any level", test: (c) => c.stars === 3 },
      { id: "ten", icon: "star", name: "Star flock", desc: "3 stars on 10 levels", test: () => prog().stars.filter((x) => x === 3).length >= 10 },
      { id: "chain15", icon: "bolt", name: "Chain 15", desc: "Make a 15-chain", test: (c) => c.humans.some((p) => p.best >= 15) },
      { id: "thorn", icon: "thorn", name: "Neat gardener", desc: "Clear a thorn level before any spread", test: (c) => c.won && c.G.data.L.goals.thorns && c.G.data.spread === 0 },
      { id: "daily", icon: "calendar", name: "Daily Pasture", desc: "Clear a Daily Pasture", test: (c) => c.won && c.setup.lvl === "daily" },
    ],
    // results: stars, boosters, milestones, and where Play again / Next go
    results(sum) {
      const G = sum.G;
      const D = G.data;
      const p = prog();
      const won = !!D.won;
      const lvl = D.lvl;
      const out = { records: [], recordNames: {}, ctx: { stars: D.stars || 0 } };
      if (lvl === "daily") {
        if (won) {
          const prev = p.daily[Dates.today()] || 0;
          p.daily[Dates.today()] = Math.max(prev, D.score);
          out.wool = 30;
        }
        out.html = `<p class="daily-tag">${Icons.get("leaf")} Daily Pasture · ${esc(Dates.today())}</p>${won ? `<p class="score">${fmtNum(D.score)}</p>` : ""}`;
        out.againLabel = "Try again";
        out.again = () => App.play("saga", { lvl: "daily" }, { seed: hashStr("pasture-play-" + Dates.today()) });
        out.shareLine = won ? `Daily Pasture: ${fmtNum(D.score)}` : "";
        Save.save();
        return out;
      }
      const k = lvl - 1;
      if (won) {
        const prev = p.stars[k] || 0;
        p.stars[k] = Math.max(prev, D.stars);
        p.fails[k] = 0;
        p.cleared = p.stars.filter((x) => x > 0).length;
        if (D.stars === 3) {
          // every 3-star finish earns a booster, in turn
          const kind = BOOSTERS[p.award % 3][0];
          p.boosters[kind] = (p.boosters[kind] || 0) + 1;
          p.award++;
          out.booster = kind;
        }
        // star milestones: Wardrobe gifts
        const total = totalStars();
        for (const [need, item] of SAGA.milestones) {
          if (total >= need && !Save.profile.owned[item]) {
            Save.profile.owned[item] = 1;
            out.gift = item;
          }
        }
        out.records.push({ key: `lvl${lvl}`, value: D.score });
        out.recordNames[`lvl${lvl}`] = `score on level ${lvl}`;
        out.wool = D.stars * 4 + (LEVELS[k].boss ? 20 : 0);
      } else {
        p.fails[k] = (p.fails[k] || 0) + 1;
      }
      Save.mode("saga").setup = { lvl: won && lvl < LEVELS.length ? lvl + 1 : lvl };
      p.next = unlocked();
      Save.save();
      const st = D.stars || 0;
      const fails = p.fails[k] || 0;
      out.html = `<div class="stars">${[0, 1, 2].map((s) => Icons.get(s < st ? "star" : "starOutline")).join("")}</div>
        ${won ? `<p class="score">${fmtNum(D.score)}</p>` : `<div class="goals">${goalPills(D.finalGoals)}</div>`}
        ${out.booster ? `<p class="pill sky">${Icons.get("gift")} Booster: <b>${esc(BOOSTERS.find((b) => b[0] === out.booster)[1])}</b></p>` : ""}
        ${out.gift ? `<p class="pill gold">${Icons.get("star")} ${totalStars()} stars! New: <b>${esc(Progress.BY_ID.get(out.gift).name)}</b></p>` : ""}
        ${!won && fails >= SAGA.helpAfter ? `<p class="pill">${Icons.get("crook")} ${STRINGS.grace.help}</p>` : ""}`;
      if (won && lvl < LEVELS.length) {
        out.next = () => {
          walkFrom = lvl;
          Nav.go("sagamap", { sel: lvl + 1, walk: true }, { replace: true });
        };
        out.againLabel = "Replay";
      } else if (!won) out.againLabel = STRINGS.grace.retry;
      // a retry after enough fails comes with the Shepherd's help
      out.again = () => App.play("saga", { lvl, help: !won && fails >= SAGA.helpAfter, booster: null });
      out.shareLine = won ? `Level ${lvl}: ${"★".repeat(st)}` : "";
      return out;
    },
    drawResult(g, w, h, t, won, sum) {
      if (!(won && sum.setup.lvl === LEVELS.length)) return false;
      drawDawn(g, w, h, t);
      return true;
    },
    hooks: {
      setup(G, s) {
        buildLevel(G, s);
        if (G.data.L.night) G.data.night = true;
      },
      hud(G) {
        S.setHud(goalPills(goalState(G)));
      },
      noElimination: true,
      roundSecs: () => Infinity,
      timerHtml: (G) => `${Icons.get("sheep")} ${G.data.budget}`,
      inPath: (G, i) => G.b.kind[i] !== "rock" && G.b.kind[i] !== "boss",
      refillMs: (G, pl) => (pl.id === 1 ? SAGA.wolfRefill * 1000 : undefined),
      blocked: (G, i) => !!G.b.kind[i] || G.data.ice[i] > 0,
      canBurst: (G, b, i) => !(G.data.ice[i] > 0),
      afterDrop(G, pl) {
        if (pl.id === 0) G.data.budget--;
      },
      onWaste(G, pl) {
        if (pl.id === 0) G.data.budget--;
      },
      land: (G, b, from, to, who) => hitBlocker(G, to, who),
      specialHit: (G, k, who) => hitBlocker(G, k, who),
      onRockBreak(G, i, who) {
        if (who !== 0) return;
        G.data.score += SAGA.points.rock;
        if (G.rng() < SAGA.rockSpecialChance) S.loadSpecial(G.players[0], G.b.mhp[i] >= 3 ? "bomb" : "line");
      },
      onChain(G, pl, prev, cur) {
        if (pl.id === 0) G.data.maxChain = Math.max(G.data.maxChain, cur);
      },
      afterWave(G, now, bursts) {
        const D = G.data;
        // the finale's fireworks are for show: leftover sheep score a flat bonus instead
        if (!D.finale) D.score += bursts[0] * SAGA.points.burst * Math.min(10, Math.max(1, G.players[0].chain));
        D.quiet = bursts[0] ? 0 : D.quiet + 1; // only your own chains hold the ending back
        if (D.budget <= 0 && !D.emptyAt) D.emptyAt = now;
      },
      // A planner for the player's seat (used to test level balance, and by nobody else): charge
      // squares up, then fire a burst when it reaches blockers or makes the chain a goal needs.
      aiDecide(G, pl, now, skill) {
        if (pl.id !== 0) return "default";
        const D = G.data;
        if (pl.pen <= 0 || D.finale || now < pl.lockUntil) return;
        const b = G.b;
        const i = S.cursorCell(pl);
        if (b.kind[i] || D.ice[i] > 0 || (b.owner[i] !== 0 && b.owner[i] !== -1)) return;
        const cap = Engine.capacity(b, i);
        const n = b.owner[i] === 0 ? b.count[i] : 0;
        D.wait = (D.wait || 0) + 1;
        let go = false;
        if (n + 1 >= cap) {
          // simulate the burst: how many go off, and how many blockers they reach
          const sc = G.scratch;
          for (let k = 0; k < b.size; k++) {
            sc.owner[k] = b.owner[k];
            sc.count[k] = b.count[k];
            sc.rock[k] = b.rock[k] || !!b.kind[k];
          }
          sc.owner[i] = 0;
          sc.count[i] = n + 1;
          let bursts = 0;
          let hits = 0;
          Engine.resolve(sc, {
            maxWaves: 60,
            canBurst: (bb, c) => bb.owner[c] === 0 && !(D.ice[c] > 0),
            targets: (bb, c) => {
              bursts++;
              const t = Engine.neighbours(bb, c);
              for (const [dr, dc] of Engine.ORTHO) {
                const r = Engine.rowOf(bb, c) + dr;
                const cc = Engine.colOf(bb, c) + dc;
                if (Engine.inside(bb, r, cc) && (b.kind[r * bb.cols + cc] || D.ice[r * bb.cols + cc] > 0)) hits++;
              }
              return t;
            },
          }, false);
          const need = D.L.goals.chain || 0;
          go = hits > 0 || (need && bursts >= Math.min(need, 4 + D.wait / 20)) || bursts >= 6 || D.wait > 60;
        } else {
          // charging: prefer squares next to blockers, and keep a little in hand
          let near = 0;
          for (const k of Engine.neighbours(b, i)) if (b.kind[k] || D.ice[k] > 0) near++;
          go = n + 1 === cap - 1 ? near > 0 || D.wait > 12 : D.wait > 30;
        }
        if (!go) return;
        D.wait = 0;
        const [lo, hi] = skill.react;
        pl.aiPlan = { cell: i, at: now + lo + G.rng() * (hi - lo) };
      },
      aiValue(G, pl, i) {
        if (pl.id !== 0) return 0;
        const b = G.b;
        let near = 0;
        for (const k of Engine.neighbours(b, i)) if (b.kind[k] || G.data.ice[k]) near++;
        const bursts = b.count[i] + 1 >= Engine.capacity(b, i) && (b.owner[i] === -1 || b.owner[i] === 0);
        return near * (bursts ? 4 : 0.6);
      },
      update(G, now) {
        const D = G.data;
        const p0 = G.players[0];
        if (D.budget <= 0 && !D.finale) p0.pen = 0;
        if (now >= D.thornAt) {
          D.thornAt = now + SAGA.thornSpreadSecs * 1000;
          if (!D.finale) spreadThorn(G);
        }
        if (D.finale) finaleStep(G, now);
        const goals = goalState(G);
        S.setHud(goalPills(goals));
        if (!D.finale && goals.every(([, , ok]) => ok)) {
          // won: the leftover sheep celebrate
          D.finale = { next: now + 500, flown: 0, left: D.budget };
          p0.kind = "finale";
          p0.special = null;
          if (p0.chain) p0.best = Math.max(p0.best, p0.chain);
          p0.chain = 0;
          p0.noChain = true;
          for (const pl of G.players) if (pl.id !== 0) pl.observer = true;
          S.shout(p0, "Hallelujah!", 1.85);
          Sfx.win();
          buzz([60, 40, 120]);
        }
      },
      endCheck(G, now) {
        const D = G.data;
        if (D.finale) {
          if (D.budget > 0 || D.quiet < 5) return null;
          D.won = true;
          D.stars = starsFor(D);
          const title = D.lvl === "daily" ? "Daily Pasture cleared!" : D.lvl === LEVELS.length ? "Dawn in the valley!" : D.L.boss ? "Boss beaten!" : "Rejoice!";
          return { team: 0, title, sub: D.lvl === "daily" ? `Score ${fmtNum(D.score)}` : `Level ${D.lvl} cleared`, color: "#d9a12a" };
        }
        if (D.budget <= 0 && (D.quiet >= 7 || now - D.emptyAt > 4000)) {
          D.finalGoals = goalState(G);
          // near misses get encouragement
          const done = D.finalGoals.reduce((a, g) => a + Math.min(1, g[3]), 0) / D.finalGoals.length;
          return { team: -1, title: done >= 0.75 ? "So close!" : "Out of sheep", sub: done >= 0.75 ? "Nearly there. One more go?" : "Every try teaches the flock something.", sad: true };
        }
        return null;
      },
      drawCell(ctx, G, i, x, y, c, t) {
        const kind = G.b.kind[i];
        if (!kind || kind === "rock" || kind === "box") return false;
        if (kind === "thorn") drawThorn(ctx, x + c / 2, y + c / 2, c * 0.38, t);
        else if (kind === "gate") drawGate(ctx, x, y, c);
        else if (kind === "crate") drawCrate(ctx, x, y, c);
        else if (kind === "sleep") drawSleeper(ctx, x + c / 2, y + c / 2 + c * 0.05, c * 0.2, t);
        return true; // boss cells are drawn as one big rock over the top
      },
      drawOver(ctx, G, c, t) {
        const D = G.data;
        const b = G.b;
        for (let i = 0; i < b.size; i++) if (D.ice[i] > 0) drawIce(ctx, Engine.colOf(b, i) * c, Engine.rowOf(b, i) * c, c, D.ice[i], D.iceMax[i], t);
        const k = S.cursorCell(G.players[0]);
        const lx = (Engine.colOf(b, k) + 0.5) * c;
        const ly = (Engine.rowOf(b, k) + 0.5) * c;
        if (D.bossHp > 0 && D.bossCells.length) {
          let r0 = 99;
          let c0 = 99;
          for (const q of D.bossCells) {
            r0 = Math.min(r0, Engine.rowOf(b, q));
            c0 = Math.min(c0, Engine.colOf(b, q));
          }
          S.drawRock(ctx, (c0 + 1) * c, (r0 + 1) * c + Math.sin(t * 3) * 1.5, c * 0.85, D.bossHp, D.L.boss, lx, ly);
        }
        if (D.night && !D.finale) {
          const grad = ctx.createRadialGradient(lx, ly, c * 1.1, lx, ly, c * 2.4);
          grad.addColorStop(0, "rgba(6,10,24,0)");
          grad.addColorStop(1, "rgba(6,10,24,0.93)");
          ctx.fillStyle = grad;
          ctx.fillRect(-2, -2, b.cols * c + 4, b.rows * c + 4);
        }
      },
    },
  });
  void rockCount;

  // ---------- the "?" card animations ----------
  function helpGoals(g, w, h, t) {
    const items = ["rock", "ice", "zzz"];
    items.forEach((ic, k) => {
      const x = w * (0.22 + k * 0.28);
      const done = (t * 0.6) % 3 > k;
      Art.rrect(g, x - 30, h * 0.35, 60, 40, 14, done ? "#cfe8c8" : "#fffdf8");
      g.fillStyle = done ? "#2c6b39" : "#5d6d5f";
      g.font = "700 18px Fredoka, system-ui";
      g.textAlign = "center";
      g.fillText(done ? "✓" : ["2", "3", "1/2"][k], x + 8, h * 0.35 + 27);
      drawMini(g, ic, x - 14, h * 0.35 + 20);
    });
    g.textAlign = "start";
  }
  function drawMini(g, kind, x, y) {
    if (kind === "rock") Art.ellipse(g, x, y, 9, 7, 0, "#8a8f99");
    else if (kind === "ice") Art.rrect(g, x - 8, y - 8, 16, 16, 4, "rgba(150,210,255,0.9)");
    else Art.drawSheep(g, x, y, 6, SLEEP);
  }
  function helpBreak(g, w, h, t) {
    const c = 34;
    const x0 = w / 2 - 1.5 * c;
    const y0 = 12;
    for (let r = 0; r < 3; r++) for (let k = 0; k < 3; k++) {
      g.fillStyle = (r + k) % 2 ? "#3d7a45" : "#46874e";
      g.fillRect(x0 + k * c, y0 + r * c, c, c);
    }
    const p = (t % 2.5) / 2.5;
    const hp = p < 0.5 ? 2 : 1;
    S.drawRock(g, x0 + 2.5 * c, y0 + 1.5 * c, c * 0.4, hp, 2, x0, y0);
    Art.drawSheep(g, x0 + 1.5 * c + (p > 0.4 && p < 0.5 ? (p - 0.4) * 10 * c : 0), y0 + 1.5 * c, 7, "#ff5a5f");
  }
  function helpStars(g, w, h, t) {
    for (let k = 0; k < 3; k++) {
      const on = (t * 0.8) % 4 > k + 1;
      g.fillStyle = on ? "#ffcf4a" : "rgba(43,58,47,0.2)";
      g.beginPath();
      Art.starPath(g, w * (0.3 + k * 0.2), h * 0.4 - (k === 1 ? 10 : 0), 22, 9);
      g.fill();
    }
    Art.drawSheep(g, w * 0.2 + ((t * 60) % (w * 0.6)), h * 0.78, 9, "#ffcf4a");
  }
})();

</script>
<script>
// ======================= STAMPEDE+ =======================
// The classic: every flock for itself (or 2 v 2). Big chains load special sheep.
(() => {
  const S = Core;
  const CONFIG_S = {
    boxEverySecs: 15, // a mystery box drops in this often
    arenas: {
      open: { name: "Open", rows: 9, cols: 6, rocks: [] },
      rocky: { name: "Rocky", rows: 9, cols: 6, rocks: [[2, 1, 2], [2, 4, 2], [6, 1, 2], [6, 4, 2], [4, 2, 3], [4, 3, 3]] }, // [row, col, hits]
      quick: { name: "Quick", rows: 7, cols: 5, rocks: [], secs: 60 },
      hilltop: { name: "Hilltop", rows: 9, cols: 7, rocks: [], stones: [[0, 0], [0, 1], [0, 5], [0, 6], [1, 0], [1, 6], [8, 0], [8, 1], [8, 5], [8, 6], [7, 0], [7, 6]], level: 5 },
      twin: { name: "Twin", rows: 9, cols: 6, rocks: [], stones: [[4, 0], [4, 1], [4, 4], [4, 5]], level: 10 },
      bethlehem: { name: "Bethlehem", rows: 9, cols: 6, rocks: [], season: "christmas", theme: "arena-bethlehem", boxEverySecs: 10 },
      garden: { name: "Garden", rows: 9, cols: 6, rocks: [], season: "easter", theme: "arena-garden", boxEverySecs: 10 },
    },
  };
  const arenaOf = (s) => {
    const a = CONFIG_S.arenas[s.arena];
    if (!a || (a.season && a.season !== Dates.season()) || (a.level && Save.profile.level < a.level && !Save.data.dev.unlockAll)) return CONFIG_S.arenas.open;
    return a;
  };
  const teamsOn = (s) => s.teams && s.n === 4;

  Modes.register({
    key: "stampede",
    title: "Stampede+",
    how: ["Tap your button to drop a sheep where your cursor is.", "Fill a square and it bursts into its neighbours, claiming them.", "Big chains load special sheep. Last flock grazing, or most squares, wins!"],
    music: { song: "jesusLovesMe", style: "bright", bpm: 126 },
    match: true,
    setupDefaults: { n: 2, arena: "open", bestOf: 3, teams: false, boxes: true, tSpeedy: false, tBig: false, tMirror: false, tNight: false },
    board: (s) => arenaOf(s),
    tuneFor: (s) => ({ roundSecs: arenaOf(s).secs ?? 90, cursorMs: s.tSpeedy ? 270 : 380, pen: s.tBig ? 8 : 5 }),
    theme: (s) => (arenaOf(s).theme ? S.ARENAS[arenaOf(s).theme] : null),
    players: (s) =>
      Array.from({ length: s.n }, (_, p) => {
        const team = teamsOn(s) ? (p === 0 || p === 3 ? 0 : 1) : p;
        // teammates share a colour, each keeps their own shape
        const lead = teamsOn(s) ? (team === 0 ? 0 : 1) : p;
        return { seat: p, team, colorIndex: s.seats[lead].color, symIndex: s.seats[p].color, dir: s.tMirror && p % 2 ? -1 : 1 };
      }),
    firstStepsSetup: (s) => ({ ...s, n: 2, arena: "open", bestOf: 1, teams: false, boxes: false, tSpeedy: false, tBig: false, tMirror: false, tNight: false, seats: [{ ...s.seats[0], kind: "human", assist: false }, { ...s.seats[1], kind: "ai", level: "easy", persona: "patient" }, s.seats[2], s.seats[3]] }),
    options(ui, s) {
      ui.seg("Flocks", "n", [[2, "2"], [3, "3"], [4, "4"]]);
      ui.seats(s.n);
      const arenas = Object.entries(CONFIG_S.arenas).filter(([, a]) => !a.season || a.season === Dates.season());
      ui.seg("Arena", "arena", arenas.map(([k, a]) => [k, a.level && Save.profile.level < a.level && !Save.data.dev.unlockAll ? `${a.name} · Lv ${a.level}` : a.name]));
      if (CONFIG_S.arenas[s.arena]?.level && Save.profile.level < CONFIG_S.arenas[s.arena].level && !Save.data.dev.unlockAll) ui.note(`${CONFIG_S.arenas[s.arena].name} opens at Flock Level ${CONFIG_S.arenas[s.arena].level}. You'll play on Open until then.`);
      ui.seg("Match", "bestOf", [[1, "Single"], [3, "Best of 3"], [5, "Best of 5"]]);
      if (s.n === 4) ui.toggle("Teams (2 v 2)", "teams", "Bottom-left and top-right against the others");
      ui.toggle("Mystery Boxes", "boxes", "Burst into a box for a special sheep");
      ui.section("Twists");
      ui.toggle("Speedy Sheep", "tSpeedy", "Cursors move faster");
      ui.toggle("Big Pens", "tBig", "8 sheep in every pen");
      ui.toggle("Mirror Cursors", "tMirror", "Every other cursor runs backwards");
      ui.toggle("Night", "tNight", "Only lanterns light the field");
    },
    playLabel: (s) => (s.bestOf > 1 ? `Play best of ${s.bestOf}` : "Play"),
    againLabel: (sum) => (sum.humans.length > 1 ? "Rematch" : "Play again"),
    tips: [
      { id: "special", on: "special", icon: "star", text: "Special sheep loaded! Drop it!" },
      { id: "rush", on: "rush", icon: "timer", text: "Stampede Time! Refills twice as fast" },
      { id: "box", on: "box", icon: "gift", text: "Burst into gifts for specials" },
      { id: "rock", on: "start", icon: "rocks", text: "Burst into rocks to break them", when: (G, pl, s) => s.arena === "rocky" },
      { id: "teams", on: "start", icon: "people", text: "Same colour? Same team!", when: (G, pl, s) => teamsOn(s) },
      { id: "night", on: "start", icon: "moon", text: "Night: lanterns light the way", when: (G, pl, s) => s.tNight },
      { id: "mirror", on: "start", icon: "refresh", text: "Some cursors run backwards!", when: (G, pl, s) => s.tMirror },
    ],
    help: [
      { title: "Tap to drop", text: "Each player has one button. Tap it to drop a sheep on the square under your cursor.", draw: (g, w, h, t) => helpTap(g, w, h, t) },
      { title: "Fill it, burst it", text: "When a square is full it bursts, and its sheep take over the squares around it.", draw: (g, w, h, t) => helpBurst(g, w, h, t) },
      { title: "Chain for specials", text: "Big chains load Line, Bomb and Overflow sheep. Your pen refills by itself.", draw: (g, w, h, t) => helpSpecial(g, w, h, t) },
    ],
    badges: [
      { id: "win", icon: "trophy", name: "First win", desc: "Win a game", test: (c) => c.won },
      { id: "chain10", icon: "bolt", name: "Chain 10", desc: "Make a 10-chain", test: (c) => c.humans.some((p) => p.best >= 10) },
      { id: "chain20", icon: "bolt", name: "Chain 20", desc: "Make a 20-chain", test: (c) => c.humans.some((p) => p.best >= 20) },
      { id: "clean", icon: "sparkle", name: "Clean hooves", desc: "Win without a lockout", test: (c) => c.won && c.humans.every((p) => p.wastes === 0) },
      { id: "overflow", icon: "star", name: "My cup runneth over", desc: "Drop an Overflow sheep", test: (c) => c.G.players.some((p) => p.human && p.overflows > 0) },
      { id: "gifts", icon: "gift", name: "Gift finder", desc: "Open 3 boxes in one game", test: (c) => c.G.players.some((p) => p.human && p.gifts >= 3) },
      { id: "rocks", icon: "rocks", name: "Rock breaker", desc: "Break 3 rocks in one game", test: (c) => c.G.players.some((p) => p.human && p.rocks >= 3) },
      { id: "champ", icon: "crown", name: "Champion", desc: "Win a best-of-5 match", test: (c) => c.won && c.match?.need === 3 },
      { id: "team", icon: "people", name: "Better together", desc: "Win a 2 v 2 game", test: (c) => c.won && teamsOn(c.setup) },
      { id: "four", icon: "party", name: "Full house", desc: "Win a 4-flock game", test: (c) => c.won && c.setup.n === 4 && !c.setup.teams },
      { id: "night", icon: "moon", name: "Night shepherd", desc: "Win with the Night twist", test: (c) => c.won && c.setup.tNight },
    ],
    hooks: {
      setup(G, s, match, opts) {
        const a = arenaOf(s);
        const b = G.b;
        for (const [r, c, hp] of a.rocks) {
          const i = r * b.cols + c;
          b.kind[i] = "rock";
          b.hp[i] = b.mhp[i] = hp;
        }
        for (const [r, c] of a.stones || []) b.rock[r * b.cols + c] = true;
        const every = (a.boxEverySecs ?? CONFIG_S.boxEverySecs) * 1000;
        G.data = { nextBox: s.boxes ? every : Infinity, every, night: s.tNight, dark: null };
        for (const pl of G.players) pl.gifts = pl.rocks = pl.overflows = 0;
        if (opts.firstSteps) seedFirstSteps(G);
      },
      hud(G) {
        const m = S.match;
        S.setHud(m ? `<span class="round">Round ${m.round}</span>` : "");
      },
      update(G, now) {
        if (now < G.data.nextBox) return;
        G.data.nextBox = now + G.data.every;
        const b = G.b;
        let n = 0;
        for (let i = 0; i < b.size; i++) if (b.owner[i] === -1 && !b.kind[i] && !b.rock[i]) n++;
        if (!n) return;
        let k = G.rng.int(n);
        for (let i = 0; i < b.size; i++) {
          if (b.owner[i] !== -1 || b.kind[i] || b.rock[i]) continue;
          if (k-- === 0) {
            b.kind[i] = "box";
            S.puff(i, "#e050ad", 6);
            Sfx.chime(2);
            S.tip("box");
            break;
          }
        }
      },
      afterDrop(G, pl, i, special) {
        if (special === "overflow") pl.overflows++;
      },
      onBox: (G, i, who) => G.players[who] && G.players[who].gifts++,
      onRockBreak: (G, i, who) => G.players[who] && G.players[who].rocks++,
      aiValue(G, pl, i) {
        const b = G.b;
        const bursts = b.count[i] + 1 >= Engine.capacity(b, i);
        let n = 0;
        for (const k of Engine.neighbours(b, i)) if (b.kind[k]) n++;
        return n * (bursts ? 3 : 0.5);
      },
      drawOver(ctx, G, c) {
        if (G.data.night) drawNight(ctx, G, c);
      },
    },
  });

  // First Steps: a row of nearly full squares by the player's start, so the first tap chains.
  function seedFirstSteps(G) {
    const b = G.b;
    const last = b.rows - 1;
    const seed = [[last, 0, 1], [last, 1, 2], [last, 2, 2], [last, 3, 2], [last - 1, 0, 2], [last - 1, 1, 3], [last - 1, 2, 2]];
    for (const [r, c, n] of seed) {
      const i = r * b.cols + c;
      b.owner[i] = 0;
      b.count[i] = n;
    }
    for (const [r, c, n] of [[0, b.cols - 1, 1], [1, b.cols - 1, 1], [0, b.cols - 2, 1]]) {
      const i = r * b.cols + c;
      b.owner[i] = 1;
      b.count[i] = n;
    }
    for (const pl of G.players) pl.placed = true;
  }

  // Night: dark everywhere except a lantern round each cursor.
  let fog = null;
  function drawNight(ctx, G, c) {
    const w = G.b.cols * c;
    const h = G.b.rows * c;
    const dpr = S.geo.dpr;
    fog ??= document.createElement("canvas");
    if (fog.width !== Math.round(w * dpr) || fog.height !== Math.round(h * dpr)) {
      fog.width = Math.round(w * dpr);
      fog.height = Math.round(h * dpr);
    }
    const g = fog.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = "source-over";
    g.clearRect(0, 0, w, h);
    g.fillStyle = "rgba(6,10,28,0.86)";
    g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = "destination-out";
    for (const pl of G.players) {
      if (!pl.alive || pl.observer) continue;
      const i = S.cursorCell(pl);
      const x = (Engine.colOf(G.b, i) + 0.5) * c;
      const y = (Engine.rowOf(G.b, i) + 0.5) * c;
      const r = c * 1.9;
      const gr = g.createRadialGradient(x, y, c * 0.4, x, y, r);
      gr.addColorStop(0, "rgba(0,0,0,1)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr;
      g.beginPath();
      g.arc(x, y, r, 0, Art.TAU);
      g.fill();
    }
    ctx.drawImage(fog, 0, 0, w, h);
  }

  // ---------- the "?" card animations ----------
  const C = ["#ff5a5f", "#3fa7ff"];
  function field(g, w, h, cols, rows, c) {
    const x0 = (w - cols * c) / 2;
    const y0 = 8;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      g.fillStyle = (r + k) % 2 ? "#3d7a45" : "#46874e";
      g.fillRect(x0 + k * c, y0 + r * c, c, c);
    }
    return [x0, y0];
  }
  function helpTap(g, w, h, t) {
    const c = 30;
    const [x0, y0] = field(g, w, h, 5, 3, c);
    const p = t % 2.4;
    const col = Math.floor((t / 2.4) % 5);
    g.strokeStyle = C[0];
    g.lineWidth = 3;
    g.strokeRect(x0 + col * c + 2, y0 + c + 2, c - 4, c - 4);
    if (p > 1.2) Art.drawSheep(g, x0 + (col + 0.5) * c, y0 + 1.5 * c - Math.max(0, 1.5 - p) * 30, 7, C[0]);
    const press = p > 1 && p < 1.25;
    Art.rrect(g, w / 2 - 44, h - 46 + (press ? 3 : 0), 88, 38, 14, C[0]);
    Art.drawLamb(g, w / 2, h - 26 + (press ? 3 : 0), 28, { t, scarf: "#ffffff" });
    // a fingertip pressing the button
    Art.circle(g, w / 2 + 30, h - 20 - (press ? 0 : 8), 9, "rgba(255,236,214,0.95)");
  }
  function helpBurst(g, w, h, t) {
    const c = 34;
    const [x0, y0] = field(g, w, h, 3, 3, c);
    const p = (t % 3) / 3;
    const n = p < 0.6 ? 1 + Math.floor(p * 6) : 0;
    const mid = [x0 + 1.5 * c, y0 + 1.5 * c];
    if (n) for (let k = 0; k < Math.min(n, 4); k++) Art.drawSheep(g, mid[0] + (k % 2 ? 7 : -7), mid[1] + (k > 1 ? 7 : -7), 6, C[0]);
    if (p >= 0.6) {
      const e = Math.min(1, (p - 0.6) / 0.25);
      for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) Art.drawSheep(g, mid[0] + dx * c * e, mid[1] + dy * c * e, 6, C[0]);
    }
    g.fillStyle = "#2b3a2f";
    g.font = "700 14px Fredoka, system-ui";
    g.textAlign = "center";
    g.fillText(p < 0.6 ? `${Math.min(n, 4)} / 4` : "Burst!", w / 2, h - 10);
    g.textAlign = "start";
  }
  function helpSpecial(g, w, h, t) {
    const items = [["line", 5], ["bomb", 9], ["overflow", 14]];
    items.forEach(([type, at], k) => {
      const x = w * (0.2 + k * 0.3);
      const y = h * 0.45 + Math.sin(t * 3 + k) * 4;
      S.drawSpecial(g, x, y, 14, type, C[0], "row", t);
      g.fillStyle = "#2b3a2f";
      g.font = "700 13px Fredoka, system-ui";
      g.textAlign = "center";
      g.fillText(`Chain ${at}`, x, h * 0.8);
    });
    g.textAlign = "start";
  }
})();

</script>
<script>
// ======================= BIG BAD WOLF =======================
// Team up against a cheeky boss. Bursts next to the wolf knock the bluster out of him; when it
// runs out he flees from the Shepherd's light. Nobody gets hurt: he just runs off over the hill.
(() => {
  const S = Core;
  const WOLF = {
    introMs: 2400, // the boss's card before play starts
    warnMs: 1000, // every attack flashes this long first
    howlMs: 3000, // cursors run backwards this long
    pupGrowMs: 3000, // pup dens gain a sheep this often
    pupScale: [1.7, 1.25, 1, 1], // ...this much slower with fewer flocks
    shadowLose: 0.7, // the shadow covering this share of the field loses
    hpScale: [0.6, 1, 1.6, 3.6], // bluster x this for 1, 2, 3, 4 flocks
    attackScale: [1.35, 1.1, 1, 1], // attacks come this much slower with fewer flocks
    diffs: { normal: { hp: 1, attack: 1 }, hard: { hp: 1.3, attack: 0.75 }, heroic: { hp: 1.6, attack: 0.6 } },
    help: { hp: 0.8, attack: 1.25 }, // the Shepherd's help after 2 losses in a row
    angryAttack: 0.6, // phase 2 attacks come this much sooner
    revealMs: 1200, // a hit shows the disguised wolf this long
    fleeMs: 2600, // the Shepherd's light and the wolf running off
    roundSecs: 140,
    rushSecs: 330,
    bosses: [
      { name: "Big Bad Wolf", icon: "wolf", hp: 60, attackSecs: 7, cells: [20, 21, 26, 27], color: "#8b8f9c", attacks: { swipe: 1, howl: 1, pups: 1, stomp: 1 } },
      { name: "Alpha of the Pack", icon: "crown", hp: 70, attackSecs: 6, cells: [20, 21, 26, 27], color: "#5f5874", attacks: { pups: 3, howl: 2, swipe: 1, stomp: 1 }, shield: true, pupsPerCall: [2, 3] },
      { name: "Wolf in Sheep's Clothing", icon: "sheep", hp: 40, attackSecs: 7, cells: [26], color: "#8b8f9c", attacks: { swipe: 1, stomp: 1, pups: 1 }, disguise: true, swapSecs: [5, 3] },
    ],
  };
  const SHADOW = "#3b2d52";
  const SHOUT = { swipe: "Swipe!", howl: "Howl!", pups: "Pups!", stomp: "Stomp!" };
  const ATTACK_ICON = { swipe: "minus", howl: "refresh", pups: "wolf", stomp: "sparkle" };
  const prog = () => {
    const p = Save.mode("wolf").progress;
    p.beatenList ??= [];
    p.hard ??= [];
    p.heroic ??= [];
    p.losses ??= 0;
    p.rush ??= false;
    return p;
  };
  const unlocked = () => (Save.data.dev.unlockAll ? 3 : Math.min(3, prog().beatenList.filter(Boolean).length + 1));
  const rushOpen = () => Save.data.dev.unlockAll || prog().beatenList.filter(Boolean).length >= 3;

  Modes.register({
    key: "wolf",
    title: "Big Bad Wolf",
    how: ["Burst next to the wolf to knock the bluster out of him.", "Watch for his flashing attacks and chase him off together!"],
    music: { song: "shepherdsMarch", style: "march", bpm: 126 },
    setupDefaults: { n: 1, boss: 1, diff: "normal" },
    solo: (s) => s.n === 1,
    tuneFor: (s) => ({ roundSecs: s.boss === "rush" ? WOLF.rushSecs : WOLF.roundSecs }),
    players(s) {
      const list = Array.from({ length: s.n }, (_, p) => ({ seat: p, team: 0 }));
      // the shadow: a flock with no cursor or button, made of the wolf's pups and their spread
      list.push({ seat: -1, kind: "none", team: 1, observer: true, color: SHADOW, name: "Shadow", placed: true, symIndex: 0 });
      return list;
    },
    options(ui, s) {
      if (s.boss !== "rush") s.boss = Math.min(s.boss || 1, unlocked());
      if (s.boss === "rush" && !rushOpen()) s.boss = 1;
      ui.seg("Flocks", "n", [[1, "1"], [2, "2"], [3, "3"], [4, "4"]], "Teammates can be people or AI");
      ui.seats(s.n);
      const bosses = WOLF.bosses.map((b, k) => [k + 1, k + 1 <= unlocked() ? b.name : `Boss ${k + 1} · locked`]).filter(([k]) => k <= unlocked());
      if (rushOpen()) bosses.push(["rush", "Boss Rush"]);
      ui.seg("Boss", "boss", bosses);
      if (unlocked() < 3) ui.note("Chase off this wolf to meet the next one.");
      ui.seg("Difficulty", "diff", [["normal", "Normal"], ["hard", "Hard"], ["heroic", "Heroic"]]);
      if (prog().losses >= 2) ui.note("The Shepherd will help this time: the wolf is less bold and slower to attack.");
    },
    playLabel: (s) => (s.boss === "rush" ? "Start the Boss Rush" : `Face the ${WOLF.bosses[(s.boss || 1) - 1].name}`),
    tips: [
      { id: "warn", on: "start", icon: "flag", text: "Red squares? Move away!" },
      { id: "shield", on: "start", icon: "shield", text: "Clear the pups to drop his shield", when: (G) => G.data.B.shield },
      { id: "disguise", on: "start", icon: "eye", text: "Watch for the wagging tail!", when: (G) => G.data.B.disguise },
    ],
    help: [
      { title: "Burst by the wolf", text: "Every burst that reaches him knocks some bluster out. Build up next to him, then set it off.", draw: (g, w, h, t) => helpBurst(g, w, h, t) },
      { title: "Red means move", text: "Squares flash red before he swipes or stomps. Sheep there are scattered.", draw: (g, w, h, t) => helpWarn(g, w, h, t) },
      { title: "Keep the shadow back", text: "His pups spread a shadow. If it covers most of the field, he wins this time.", draw: (g, w, h, t) => helpShadow(g, w, h, t) },
    ],
    badges: [
      { id: "b1", icon: "wolf", name: "Huff and puff", desc: "Chase off the Big Bad Wolf", test: (c) => c.won && c.G.data.beaten.includes(1) },
      { id: "b2", icon: "crown", name: "Pack scattered", desc: "Chase off the Alpha of the Pack", test: (c) => c.won && c.G.data.beaten.includes(2) },
      { id: "b3", icon: "eye", name: "Unmasked", desc: "Find the Wolf in Sheep's Clothing", test: (c) => c.won && c.G.data.beaten.includes(3) },
      { id: "rush", icon: "timer", name: "Boss Rush", desc: "Chase off all three in a row", test: (c) => c.won && c.setup.boss === "rush" },
      { id: "hard", icon: "shield", name: "Brave flock", desc: "Win on Hard", test: (c) => c.won && c.setup.diff === "hard" },
      { id: "heroic", icon: "star", name: "Heroic", desc: "Win on Heroic", test: (c) => c.won && c.setup.diff === "heroic" },
      { id: "solo", icon: "heart", name: "Lion-hearted lamb", desc: "Win alone", test: (c) => c.won && c.setup.n === 1 },
      { id: "fast", icon: "bolt", name: "Swift", desc: "Win in under a minute", test: (c) => c.won && c.boss !== "rush" && c.secs < 60 },
      { id: "clean", icon: "sparkle", name: "Steady hooves", desc: "Win without a lockout", test: (c) => c.won && c.humans.every((p) => p.wastes === 0) },
    ],
    results(sum) {
      const G = sum.G;
      const D = G.data;
      const p = prog();
      const out = { records: [], recordNames: {}, ctx: { boss: sum.setup.boss } };
      if (sum.won) {
        for (const k of D.beaten) {
          p.beatenList[k - 1] = true;
          if (D.diff === "hard") p.hard[k - 1] = true;
          if (D.diff === "heroic") p.heroic[k - 1] = true;
        }
        if (D.rush) p.rush = true;
        p.beaten = p.beatenList.filter(Boolean).length;
        p.losses = 0;
        const key = `time-${D.rush ? "rush" : D.bossNo}-${D.diff}`;
        out.records.push({ key, value: Math.round((D.wonAt - D.startAt) / 1000), higher: false });
        out.recordNames[key] = "time";
        out.wool = 10 + D.beaten.length * 8 + (D.diff === "hard" ? 10 : D.diff === "heroic" ? 20 : 0);
        const next = !D.rush && D.bossNo < 3 && unlocked() > D.bossNo;
        if (next) {
          out.next = () => {
            const s = { ...Save.mode("wolf").setup, boss: D.bossNo + 1 };
            Save.mode("wolf").setup = s;
            App.play("wolf", { ...App.loadSetup(Modes.get("wolf")), boss: D.bossNo + 1 });
          };
        }
      } else p.losses++;
      Save.save();
      // bursts on the wolf, per flock
      const live = G.players.filter((q) => !q.observer || q.seat >= 0);
      const top = Math.max(1, ...live.map((q) => q.damage || 0));
      out.html = `<div class="dmg">${live.filter((q) => q.seat >= 0).map((q) => `<div><span style="color:${q.color}">${esc(q.name)}</span><i style="width:${(100 * (q.damage || 0)) / top}%;background:${q.color}"></i><span>${q.damage || 0}</span></div>`).join("")}</div><p class="note">Bursts that reached the wolf</p>`;
      out.shareLine = sum.won ? `${D.rush ? "Boss Rush" : D.B.name} chased off!` : "";
      return out;
    },
    drawResult(g, w, h, t, won) {
      if (!won) return false;
      drawVictory(g, w, h, t);
      return true;
    },
    hooks: {
      setup(G, s) {
        const p = prog();
        const rush = s.boss === "rush";
        const flocks = G.players.length - 1;
        const D = (G.data = {
          rush, order: rush ? [1, 2, 3] : [Math.min(s.boss || 1, unlocked())], beaten: [], diff: s.diff || "normal", help: p.losses >= 2,
          flocks, attack: null, howlUntil: 0, pups: [], hitAt: 0, angry: false, won: 0, wonAt: 0, startAt: 0, fleeAt: 0, revealUntil: 0, shieldAt: 0,
        });
        G.shadow = G.players.length - 1;
        G.players[G.shadow].sym = null;
        for (const pl of G.players) pl.damage = 0;
        nextBoss(G, 0);
      },
      hud: (G) => hud(G),
      noElimination: true, // a wiped-out flock can always drop back in
      inPath: (G, i) => G.b.kind[i] !== "wolf",
      blocked: (G, i) => G.b.kind[i] === "wolf",
      land(G, b, from, to, who) {
        if (b.kind[to] !== "wolf") return false;
        if (who !== G.shadow) hurt(G, who);
        return true;
      },
      specialHit(G, k, who) {
        if (G.b.kind[k] !== "wolf") return false;
        if (who !== G.shadow) hurt(G, who);
        return true;
      },
      aiValue(G, pl, i) {
        const b = G.b;
        const D = G.data;
        const now = G.time;
        const seen = !D.B.disguise || now < D.revealUntil || tailOut(G, now);
        const near = Engine.neighbours(b, i);
        const bursts = b.count[i] + 1 >= Engine.capacity(b, i);
        let wolf = 0;
        let pups = 0;
        for (const k of near) {
          if (seen && b.kind[k] === "wolf") wolf++;
          if (b.owner[k] === G.shadow) pups++;
        }
        const warned = D.attack && D.attack.cells.includes(i) ? -6 : 0;
        // build up close to the wolf so chains end on him
        const r = Engine.rowOf(b, i);
        const c = Engine.colOf(b, i);
        const close = seen && D.cells.some((w) => Math.abs(Engine.rowOf(b, w) - r) + Math.abs(Engine.colOf(b, w) - c) <= 2);
        const ours = b.owner[i] === -1 || G.players[b.owner[i]]?.team === 0;
        // will this drop's cascade reach him? (simulated on a scratch board)
        let reach = 0;
        if (bursts && ours && seen) {
          const sc = G.scratch;
          for (let k = 0; k < b.size; k++) {
            sc.owner[k] = b.owner[k];
            sc.count[k] = b.count[k];
            sc.rock[k] = b.rock[k];
          }
          sc.owner[i] = pl.id;
          sc.count[i] = b.count[i] + 1;
          Engine.resolve(sc, {
            maxWaves: 30,
            canBurst: (bb, c) => bb.owner[c] >= 0 && G.players[bb.owner[c]]?.team === 0 && bb.kind?.[c] !== "wolf",
            targets: (bb, c) => {
              const t2 = Engine.neighbours(bb, c);
              for (const k of t2) if (b.kind[k] === "wolf") reach++;
              return t2.filter((k) => b.kind[k] !== "wolf");
            },
          }, false);
        }
        return wolf * (bursts ? 5 : 1) + pups * (bursts ? 2 : 0) + (close && ours ? 4 : 0) + warned + Math.min(12, reach * 3);
      },
      update(G, now) {
        const D = G.data;
        if (D.fleeAt) {
          // the wolf runs from the light; in the Boss Rush the next one comes over the hill
          if (now - D.fleeAt > WOLF.fleeMs && D.beaten.length < D.order.length) nextBoss(G, now);
          return;
        }
        if (now < G.holdUntil) return;
        if (now >= D.pupAt) {
          D.pupAt = now + WOLF.pupGrowMs * WOLF.pupScale[Math.min(4, D.flocks) - 1];
          D.pups = D.pups.filter((i) => G.b.owner[i] === G.shadow);
          for (const i of D.pups) G.b.count[i]++;
        }
        if (!D.attack && now >= D.nextAttack) warn(G, now);
        if (D.attack && now >= D.attack.at) strike(G, now);
        if (D.howlUntil && now >= D.howlUntil) {
          D.howlUntil = 0;
          for (const pl of G.players) pl.dir = 1;
        }
        if (D.B.disguise && now >= D.nextSwap) swap(G, now);
        if (!D.angry && D.hp <= D.max / 2) {
          // phase 2: a big grumble, faster attacks, the music builds
          D.angry = true;
          S.shout(null, "GRRR!", 1.9, "#ff6b6b");
          Sfx.grumble();
          S.shake(12);
          buzz([120, 60, 120]);
          if (!S.quiet) Music.setLayer(2);
          D.nextAttack = Math.min(D.nextAttack, now + 1500);
        }
        hud(G);
      },
      endCheck(G, now, left) {
        const D = G.data;
        if (D.won) return now - D.won < WOLF.fleeMs + 600 ? null : { team: 0, title: D.rush ? "The pack ran off!" : `${D.B.name} ran off!`, sub: D.rush ? "All three wolves chased away. Rejoice!" : D.bossNo < 3 ? "Another wolf is waiting." : "Every wolf has run from the light.", color: "#d9a12a" };
        if (D.fleeAt) return null;
        const field = G.b.size - D.cells.length;
        if (S.cellsOf(G.shadow) >= field * WOLF.shadowLose) return { team: 1, title: "The shadow spread", sub: "So close! The Shepherd will help next time.", sad: true };
        if (left <= 0) return { team: 1, title: "He's still blustering", sub: `${D.B.name} had ${D.hp} bluster left. One more go?`, sad: true };
        return null;
      },
      drawCell: (ctx, G, i) => G.b.kind[i] === "wolf",
      drawOver(ctx, G, c, t, now) {
        const D = G.data;
        const b = G.b;
        if (D.attack && D.attack.cells.length) {
          ctx.fillStyle = `rgba(255,60,60,${Save.settings.fewerFlashes ? 0.3 : 0.25 + 0.25 * Math.sin(t * 25)})`;
          for (const k of D.attack.cells) ctx.fillRect(Engine.colOf(b, k) * c, Engine.rowOf(b, k) * c, c, c);
        }
        for (const i of D.pups)
          if (b.owner[i] === G.shadow) {
            ctx.strokeStyle = "#b39ad1";
            ctx.lineWidth = 2;
            ctx.strokeRect(Engine.colOf(b, i) * c + 3, Engine.rowOf(b, i) * c + 3, c - 6, c - 6);
          }
        drawBoss(ctx, G, c, t, now);
        if (D.fleeAt) drawFlee(ctx, G, c, t, now);
        if (D.howlUntil) {
          ctx.fillStyle = `rgba(180,140,255,${0.12 + 0.08 * Math.sin(t * 12)})`;
          ctx.fillRect(0, 0, b.cols * c, b.rows * c);
        }
      },
    },
  });

  // ---------- the boss ----------
  function nextBoss(G, now) {
    const D = G.data;
    const b = G.b;
    const no = D.order[D.beaten.length];
    const B = WOLF.bosses[no - 1];
    for (let i = 0; i < b.size; i++) if (b.kind[i] === "wolf") b.kind[i] = null;
    const diff = WOLF.diffs[D.diff];
    const hp = Math.round(B.hp * WOLF.hpScale[Math.min(4, D.flocks) - 1] * diff.hp * (D.help ? WOLF.help.hp : 1));
    Object.assign(D, {
      bossNo: no, B, hp, max: hp, cells: [...B.cells], attack: null, angry: false, won: 0, fleeAt: 0, pups: D.pups || [], howlUntil: 0,
      nextAttack: now + WOLF.introMs + 4000, pupAt: now + WOLF.introMs + WOLF.pupGrowMs, tailAt: now + 2500, nextSwap: now + WOLF.introMs + (B.swapSecs?.[0] ?? 0) * 1000,
      attackMul: diff.attack * (D.help ? WOLF.help.attack : 1) * WOLF.attackScale[Math.min(4, D.flocks) - 1], last: "",
    });
    for (const i of D.cells) {
      b.kind[i] = "wolf";
      b.owner[i] = -1;
      b.count[i] = 0;
      b.tag[i] = null;
    }
    for (const pl of G.players) {
      pl.dir = 1;
      if (pl.seat >= 0) pl.observer = false;
    }
    if (G.tick > 0) S.rebuildPath();
    G.holdUntil = now + WOLF.introMs;
    if (!D.startAt) D.startAt = G.holdUntil;
    Music.setLayer(1);
    S.banner(`${introArt(B)}<small>${D.rush ? `Boss ${D.beaten.length + 1} of 3` : "Here comes"}</small><b>${esc(B.name)}</b><div class="attacks">${Object.keys(B.attacks).map((a) => Icons.get(ATTACK_ICON[a])).join("")}</div>${D.help ? `<small>${Icons.get("crook")} ${esc(STRINGS.helpOn)}</small>` : ""}`, WOLF.introMs, "intro");
    Sfx.howl();
  }
  // the intro card's silhouette, drawn to a data URL once per boss
  const silhouettes = {};
  function introArt(B) {
    if (!silhouettes[B.name]) {
      const cv = document.createElement("canvas");
      cv.width = 240;
      cv.height = 150;
      const g = cv.getContext("2d");
      g.scale(2, 2);
      g.fillStyle = "#2b2430";
      const sky = g.createLinearGradient(0, 0, 0, 75);
      sky.addColorStop(0, "#5b4b8a");
      sky.addColorStop(1, "#ffb38a");
      g.fillStyle = sky;
      g.beginPath();
      g.roundRect(0, 0, 120, 75, 12);
      g.fill();
      if (B.disguise) Art.drawSheep(g, 60, 44, 18, "#2b2430");
      else Art.drawWolf(g, 60, 44, 62, { color: "#2b2430" });
      if (B.disguise) {
        g.fillStyle = "#2b2430";
        g.beginPath();
        g.ellipse(84, 50, 10, 4, -0.6, 0, Art.TAU);
        g.fill();
      }
      silhouettes[B.name] = cv.toDataURL();
    }
    return `<img src="${silhouettes[B.name]}" width="120" height="75" alt="">`;
  }
  const shielded = (G) => G.data.B.shield && G.data.cells.some((w) => Engine.neighbours(G.b, w).some((k) => G.b.owner[k] === G.shadow));
  const tailOut = (G, now) => (now - G.data.tailAt) % 4200 < 700;

  function hurt(G, who) {
    const D = G.data;
    if (D.won || D.fleeAt) return;
    const now = G.time;
    if (shielded(G)) {
      // pups next to the Alpha shield him: clear them first
      if (now - D.shieldAt > 250) {
        D.shieldAt = now;
        Sfx.blip(1500, 0.06, "sine", 0.04, 900);
      }
      return;
    }
    D.hp--;
    D.hitAt = now;
    if (D.B.disguise) D.revealUntil = now + WOLF.revealMs;
    if (S.isPlayer(who)) G.players[who].damage = (G.players[who].damage || 0) + 1;
    Sfx.hit(4);
    for (const i of D.cells) S.puff(i, "#c7cad1", 1);
    if (D.hp > 0) return;
    // out of bluster: he flees from the Shepherd's light
    D.hp = 0;
    D.beaten.push(D.bossNo);
    D.fleeAt = now;
    D.attack = null;
    D.howlUntil = 0;
    for (const pl of G.players) {
      pl.dir = 1;
      if (pl.seat >= 0) S.mood(pl, "cheer", 3000);
    }
    for (const i of D.cells) G.b.kind[i] = null;
    S.rebuildPath();
    hud(G);
    S.shout(null, "Hallelujah!", 1.9, "#ffcf4a");
    Sfx.shepherd();
    buzz([80, 50, 160]);
    if (D.beaten.length >= D.order.length) {
      D.won = now;
      D.wonAt = now;
      for (const pl of G.players) pl.observer = true;
    }
  }

  function hud(G) {
    const D = G.data;
    const icon = D.attack ? ATTACK_ICON[D.attack.type] : shielded(G) ? "shield" : D.B.icon;
    const html = `<div class="wolfbar${D.angry ? " angry" : ""}">${Icons.get(icon)}<div class="bar"><i style="width:${(100 * Math.max(0, D.hp)) / D.max}%"></i><b>${esc(D.B.name)}${D.rush ? ` · ${D.beaten.length + (D.fleeAt ? 0 : 1)}/3` : ""}</b></div></div>`;
    S.setHud(html);
  }

  const teamIds = (G) => G.players.filter((p) => p.team === 0).map((p) => p.id);
  function around(b, i) {
    const out = [i];
    for (const [dr, dc] of Engine.ALL8) {
      const r = Engine.rowOf(b, i) + dr;
      const c = Engine.colOf(b, i) + dc;
      if (Engine.inside(b, r, c)) out.push(r * b.cols + c);
    }
    return out;
  }

  // Choose the attack and mark where it will land.
  function warn(G, now) {
    const D = G.data;
    const b = G.b;
    const bag = [];
    for (const [k, w] of Object.entries(D.B.attacks)) for (let n = 0; n < w; n++) bag.push(k);
    const type = G.rng.pick(bag);
    const ids = teamIds(G);
    const mine = (i) => ids.includes(b.owner[i]);
    let cells = [];
    if (type === "swipe") {
      let bestRow = 0;
      let most = -1;
      for (let r = 0; r < b.rows; r++) {
        let n = 0;
        for (let c = 0; c < b.cols; c++) if (mine(r * b.cols + c)) n += b.count[r * b.cols + c];
        if (n > most) [most, bestRow] = [n, r];
      }
      for (let c = 0; c < b.cols; c++) cells.push(bestRow * b.cols + c);
    } else if (type === "stomp") {
      let bestAt = 0;
      let most = -1;
      for (let i = 0; i < b.size; i++) {
        const n = around(b, i).reduce((s, k) => s + (mine(k) ? b.count[k] : 0), 0);
        if (n > most) [most, bestAt] = [n, i];
      }
      cells = around(b, bestAt);
    } else if (type === "pups") {
      const free = [];
      for (let i = 0; i < b.size; i++) if (b.owner[i] === -1 && !b.kind[i]) free.push(i);
      G.rng.shuffle(free);
      // the Alpha calls his pups to his side
      if (D.B.shield) {
        const nearWolf = (i) => D.cells.some((w) => Engine.neighbours(b, w).includes(i));
        free.sort((a, c) => nearWolf(c) - nearWolf(a));
      }
      cells = free.slice(0, Math.min(D.flocks, D.B.pupsPerCall ? D.B.pupsPerCall[D.angry ? 1 : 0] : 2));
    }
    cells = cells.filter((k) => b.kind[k] !== "wolf");
    D.attack = { type, at: now + WOLF.warnMs, cells };
    S.shout(null, SHOUT[type], 1.5, "#ff6b6b");
    Sfx.blip(110, 0.5, "triangle", 0.08, 70);
  }

  function strike(G, now) {
    const D = G.data;
    const b = G.b;
    const { type, cells } = D.attack;
    D.attack = null;
    D.nextAttack = now + D.B.attackSecs * 1000 * (D.angry ? WOLF.angryAttack : 1) * D.attackMul;
    if (type === "howl") {
      D.howlUntil = now + WOLF.howlMs;
      for (const pl of G.players) pl.dir = -1;
      Sfx.howl();
      return;
    }
    if (type === "pups") {
      for (const i of cells) {
        if (b.owner[i] !== -1) continue;
        b.owner[i] = G.shadow;
        b.count[i] = 2;
        D.pups.push(i);
        S.puff(i, SHADOW, 5);
      }
      Sfx.blip(300, 0.2, "triangle", 0.06, 500);
      return;
    }
    // swipe and stomp scatter the sheep there (they skip back to the meadow, nobody is hurt)
    for (const i of cells) {
      if (b.kind[i]) continue;
      b.owner[i] = -1;
      b.count[i] = 0;
      b.tag[i] = null;
      S.puff(i, "#ffffff", 2);
    }
    S.shake(type === "stomp" ? 12 : 7);
    buzz(type === "stomp" ? 90 : 50);
    Sfx.blip(90, 0.3, "triangle", 0.1, 40);
  }

  // The Wolf in Sheep's Clothing swaps places with a random square.
  function swap(G, now) {
    const D = G.data;
    const b = G.b;
    D.nextSwap = now + D.B.swapSecs[D.angry ? 1 : 0] * 1000;
    const from = D.cells[0];
    const options = [];
    for (let i = 0; i < b.size; i++) if (!b.kind[i] && !b.rock[i]) options.push(i);
    const to = G.rng.pick(options);
    b.owner[from] = b.owner[to];
    b.count[from] = b.count[to];
    b.tag[from] = b.tag[to];
    b.kind[from] = null;
    b.owner[to] = -1;
    b.count[to] = 0;
    b.tag[to] = null;
    b.kind[to] = "wolf";
    D.cells[0] = to;
    S.rebuildPath();
    Sfx.blip(600, 0.08, "sine", 0.04, 900);
  }

  // ---------- drawing ----------
  function bossSpot(G, c) {
    const D = G.data;
    const b = G.b;
    if (D.B.disguise) {
      const i = D.cells[0];
      return [(Engine.colOf(b, i) + 0.5) * c, (Engine.rowOf(b, i) + 0.5) * c];
    }
    let r0 = 99;
    let c0 = 99;
    for (const q of D.cells) {
      r0 = Math.min(r0, Engine.rowOf(b, q));
      c0 = Math.min(c0, Engine.colOf(b, q));
    }
    return [(c0 + 1) * c, (r0 + 1) * c + 0.22 * c];
  }
  function drawBoss(ctx, G, c, t, now) {
    const D = G.data;
    if (D.fleeAt) return;
    const hit = now - D.hitAt < 150;
    const [x, y] = bossSpot(G, c);
    if (D.B.disguise) {
      const seen = now < D.revealUntil;
      if (seen) Art.drawWolf(ctx, x, y + c * 0.08, c * 0.95, { t, color: hit ? "#ffffff" : undefined });
      else {
        // a sheep like any other... except for the tail
        Art.drawSheep(ctx, x - c * 0.12, y, c * 0.17, "#ececf2");
        Art.drawSheep(ctx, x + c * 0.14, y + c * 0.05, c * 0.17, "#ececf2", { flip: true });
        if (tailOut(G, now)) {
          ctx.fillStyle = "#6f7380";
          ctx.beginPath();
          ctx.ellipse(x + c * 0.36, y + c * 0.12, c * 0.12, c * 0.05, -0.6 + Math.sin(t * 14) * 0.3, 0, Art.TAU);
          ctx.fill();
        }
      }
      return;
    }
    const jitter = D.angry && !Save.settings.reduced ? Math.sin(t * 30) * 1.5 : 0;
    Art.drawWolf(ctx, x, y + jitter, c * 1.9, { t, color: hit ? "#ffffff" : D.angry ? "#a0707a" : D.B.color });
    if (D.B.shield) {
      // the Alpha's golden mane, and his shield while pups guard him
      ctx.fillStyle = "#ffcf4a";
      ctx.beginPath();
      for (let k = 0; k < 5; k++) ctx.lineTo(x - c * 0.4 + k * c * 0.2, y - c * (k % 2 ? 0.95 : 1.1));
      ctx.lineTo(x + c * 0.4, y - c * 0.85);
      ctx.lineTo(x - c * 0.4, y - c * 0.85);
      ctx.fill();
      if (shielded(G)) {
        ctx.strokeStyle = `rgba(140,200,255,${0.5 + 0.3 * Math.sin(t * 6)})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y - 0.22 * c, c * 1.05, 0, Art.TAU);
        ctx.stroke();
      }
    }
    if (D.angry) {
      ctx.strokeStyle = "#2a2530";
      ctx.lineWidth = c * 0.07;
      ctx.beginPath();
      ctx.moveTo(x - c * 0.42, y - c * 0.38);
      ctx.lineTo(x - c * 0.12, y - c * 0.26);
      ctx.moveTo(x + c * 0.42, y - c * 0.38);
      ctx.lineTo(x + c * 0.12, y - c * 0.26);
      ctx.stroke();
    }
  }
  // the Shepherd's light shines from the hill; the wolf runs off; the lambs leap for joy
  function drawFlee(ctx, G, c, t, now) {
    const D = G.data;
    const b = G.b;
    const W = b.cols * c;
    const H = b.rows * c;
    const p = Math.min(1, (now - D.fleeAt) / WOLF.fleeMs);
    const fade = Math.min(1, p * 3) * (p > 0.85 ? (1 - p) / 0.15 : 1);
    ctx.save();
    ctx.globalAlpha = fade * 0.55;
    const glow = ctx.createRadialGradient(W * 0.85, 0, 4, W * 0.85, 0, H * 0.9);
    glow.addColorStop(0, "rgba(255,236,170,1)");
    glow.addColorStop(1, "rgba(255,236,170,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = fade;
    Art.drawShepherd(ctx, W * 0.84, H * 0.42, H * 0.38, { t });
    ctx.restore();
    // the wolf scampers off to the left, tail between his legs
    const [x0, y0] = bossSpot(G, c);
    const x = x0 - p * W * 1.1;
    if (x > -c * 2) Art.drawWolfRunning(ctx, x, y0 + Math.sin(p * 30) * c * 0.06, c * 1.4, t);
    for (let k = 0; k < 10; k++) {
      const px = ((k * 0.37 + p * 0.3) % 1) * W;
      const py = (0.15 + ((k * 0.61) % 0.75)) * H - Math.abs(Math.sin(t * 8 + k)) * c * 0.4;
      const pl = G.players[k % Math.max(1, G.players.length - 1)];
      Art.drawSheep(ctx, px, py, c * 0.16, pl.color, { flip: k % 2 === 1 });
    }
  }
  function drawVictory(g, w, h, t) {
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#ffe9b0");
    sky.addColorStop(1, "#fff8ec");
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);
    g.fillStyle = "#9fd77f";
    g.beginPath();
    g.moveTo(0, h);
    g.quadraticCurveTo(w * 0.3, h * 0.6, w * 0.6, h * 0.75);
    g.quadraticCurveTo(w * 0.85, h * 0.85, w, h * 0.7);
    g.lineTo(w, h);
    g.fill();
    Art.drawShepherd(g, w * 0.8, h * 0.92, h * 0.78, { t });
    const run = (t * 0.25) % 1.3;
    Art.drawWolfRunning(g, w * 0.3 - run * w * 0.5, h * 0.72, 46, t);
    const jump = Save.settings.reduced ? 0 : Math.abs(Math.sin(t * 5)) * 8;
    Art.drawLamb(g, w * 0.52, h * 0.66 - jump, 90, { t, mood: "joy", look: Progress.look() });
  }

  // ---------- the "?" card animations ----------
  function field(g, w, cols, rows, c) {
    const x0 = (w - cols * c) / 2;
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      g.fillStyle = (r + k) % 2 ? "#3d7a45" : "#46874e";
      g.fillRect(x0 + k * c, 8 + r * c, c, c);
    }
    return x0;
  }
  function helpBurst(g, w, h, t) {
    const c = 32;
    const x0 = field(g, w, 5, 4, c);
    Art.drawWolf(g, x0 + 3.5 * c, 8 + 2 * c, c * 1.6, { t });
    const p = (t % 2) / 2;
    Art.drawSheep(g, x0 + 0.5 * c + p * c * 1.5, 8 + 2 * c, 8, "#3fa7ff");
    Art.rrect(g, x0, 8 + 4 * c + 6, 5 * c, 10, 5, "rgba(0,0,0,0.15)");
    Art.rrect(g, x0, 8 + 4 * c + 6, 5 * c * (1 - (Math.floor(t / 2) % 5) * 0.15), 10, 5, "#ffcf4a");
  }
  function helpWarn(g, w, h, t) {
    const c = 32;
    const x0 = field(g, w, 5, 4, c);
    g.fillStyle = `rgba(255,60,60,${0.3 + 0.3 * Math.sin(t * 12)})`;
    g.fillRect(x0, 8 + c, 5 * c, c);
    Art.drawSheep(g, x0 + 1.5 * c, 8 + 1.5 * c, 8, "#ff5a5f");
    Art.drawSheep(g, x0 + 2.5 * c, 8 + 2.5 * c + Math.min(0, Math.sin(t * 2)) * c, 8, "#3fa7ff");
  }
  function helpShadow(g, w, h, t) {
    const c = 32;
    const x0 = field(g, w, 5, 4, c);
    const n = Math.floor((t * 2) % 12);
    for (let k = 0; k < n; k++) {
      g.fillStyle = "rgba(59,45,82,0.55)";
      g.fillRect(x0 + (k % 5) * c, 8 + Math.floor(k / 5) * c, c, c);
    }
    Art.drawWolf(g, x0 + 4.2 * c, 8 + 3.2 * c, c, { t });
  }
})();

</script>
<script>
  try {
    $("pause-btn").innerHTML = Icons.get("pause");
    $("pause-btn").onclick = () => Nav.back();
    App.boot();
  } catch (e) {
    ErrorLog.add(e.message, e.stack);
    App.crash(e);
  }
</script>
