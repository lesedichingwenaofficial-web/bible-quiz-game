// ======================= STAMPEDE CORE v2 =======================
// Real-time Chain Reaction with one button per player. Shared by every Stampede game:
// screens, settings, audio and music, haptics, input zones, pen displays, rendering,
// AI seats, match mode, results, stats and badges. Each game calls Stampede.run(version)
// with its own rules as hooks, so they can later sit behind one menu.
const Stampede = (() => {
  const $ = (id) => document.getElementById(id);

  // ---------------- CONFIG ----------------
  const COLORS = ["#ff5a5f", "#3fa7ff", "#ffc93c", "#2fd38a"];
  const NAMES = ["Red", "Blue", "Yellow", "Green"];
  const SYMBOLS = ["circle", "triangle", "square", "diamond"]; // colour-blind friendly marks
  const BOTTOM = [true, false, false, true]; // seat 0 bottom-left, 1 top-right, 2 top-left, 3 bottom-right
  const OWN_LEFT = [true, true, false, false]; // left side as that player sees it
  const RANK = { line: 1, bomb: 2, overflow: 3 };
  const SHOUTS = [[5, "Nice!", 1], [8, "Baa-rilliant!", 1.25], [12, "Overflowing!", 1.5], [16, "Hallelujah!", 1.85]];
  const LOCK_MS = 1000;
  const WAVE_MS = 140;
  const MAX_RUN = 60; // waves in a row before a runaway cascade settles
  const NEUTRAL = 90; // owner id of grey sheep: they never burst, and a burst claims them
  const PAD = 8; // board margin, where the edge-bar pen display lives
  const ROW_H = 22; // strip above each button for the sheep-row pen display
  const AI = {
    easy: { pick: 7, idle: 0.05, miss: 0.15, react: [260, 350] },
    normal: { pick: 4, idle: 0.08, miss: 0.05, react: [190, 330] },
    hard: { pick: 2, idle: 0.03, miss: 0, react: [150, 250] },
  };
  const BASE_TUNE = { pen: 5, refill: 1.1, cursorMs: 380, roundSecs: 90, stampedeSecs: 20, lineAt: 5, plusAt: 6, bombAt: 9, fullAt: 10, overflowAt: 14 };
  const TUNE_INFO = [
    ["pen", "Pen size", 1, 10, 1, " sheep"],
    ["refill", "Refill time (2 players; scales up for 3–4)", 0.3, 3, 0.1, " s"],
    ["cursorMs", "Cursor step", 150, 800, 10, " ms"],
    ["roundSecs", "Round length", 20, 300, 5, " s"],
    ["stampedeSecs", "Stampede Time", 0, 60, 5, " s"],
    ["lineAt", "Line sheep at chain", 2, 20, 1, ""],
    ["plusAt", "+2 sheep at chain", 2, 20, 1, ""],
    ["bombAt", "Bomb sheep at chain", 2, 25, 1, ""],
    ["fullAt", "Full pen at chain", 2, 25, 1, ""],
    ["overflowAt", "Overflow sheep at chain", 2, 30, 1, ""],
  ];
  const REFILL_SCALE = [1, 1, 1, 1.4 / 1.1, 1.7 / 1.1]; // by number of players
  const DEFAULT_SETTINGS = {
    music: true, musicVol: 0.5, sound: true, soundVol: 0.8, vibe: true,
    reduced: typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches,
    pen: "dots", zone: "button", ai: "normal",
  };

  // ---------------- STORAGE ----------------
  const Store = {
    get(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        if (v === null || v === undefined) return structuredClone(fallback);
        return fallback && typeof fallback === "object" && !Array.isArray(fallback) ? { ...structuredClone(fallback), ...v } : v;
      } catch {
        return structuredClone(fallback);
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    },
  };

  let settings = Store.get("cfl2-settings", DEFAULT_SETTINGS);
  const saveSettings = () => Store.set("cfl2-settings", settings);

  // ---------------- AUDIO ----------------
  const Audio = (() => {
    let ctx = null;
    let sfxBus = null;
    let musBus = null;
    let noiseBuf = null;
    function unlock() {
      try {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          sfxBus = ctx.createGain();
          musBus = ctx.createGain();
          sfxBus.connect(ctx.destination);
          musBus.connect(ctx.destination);
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1;
        }
        if (ctx.state === "suspended") ctx.resume();
        levels();
      } catch {
        ctx = null;
      }
    }
    function levels() {
      if (!ctx) return;
      sfxBus.gain.value = settings.sound ? settings.soundVol : 0;
      musBus.gain.value = settings.music ? settings.musicVol * 0.55 : 0;
    }
    function tone(freq, dur = 0.12, type = "sine", vol = 0.12, slideTo = 0, delay = 0, music = false) {
      if (!ctx || (music ? !settings.music : !settings.sound)) return;
      const t = ctx.currentTime + Math.max(0, delay);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(music ? musBus : sfxBus);
      o.start(t);
      o.stop(t + dur + 0.03);
    }
    function noise(dur, freq, vol, delay = 0, type = "bandpass", music = false) {
      if (!ctx || (music ? !settings.music : !settings.sound)) return;
      const t = ctx.currentTime + Math.max(0, delay);
      const s = ctx.createBufferSource();
      s.buffer = noiseBuf;
      const f = ctx.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(music ? musBus : sfxBus);
      s.start(t);
      s.stop(t + dur + 0.03);
    }
    function bleat(pitch = 1, delay = 0) {
      if (!ctx || !settings.sound) return;
      const t = ctx.currentTime + delay;
      const o = ctx.createOscillator();
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      const g = ctx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(420 * pitch, t);
      o.frequency.linearRampToValueAtTime(360 * pitch, t + 0.35);
      lfo.frequency.value = 22;
      lg.gain.value = 18 * pitch;
      lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.07, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      const f = ctx.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = 1800;
      o.connect(f).connect(g).connect(sfxBus);
      o.start(t);
      lfo.start(t);
      o.stop(t + 0.45);
      lfo.stop(t + 0.45);
    }
    return { unlock, levels, tone, noise, bleat, get ctx() { return ctx; } };
  })();

  const Sfx = {
    drop: () => Audio.tone(560, 0.07, "triangle", 0.07, 760),
    burst(k) {
      const f = 330 * Math.pow(2, Math.min(k, 24) / 12);
      Audio.tone(f, 0.09, "triangle", 0.06, f * 1.4);
      Audio.noise(0.05, 1400, 0.035);
    },
    waste: () => Audio.tone(120, 0.2, "square", 0.07, 70),
    empty: () => Audio.tone(85, 0.14, "sine", 0.18, 55),
    tick: () => Audio.tone(1700, 0.03, "sine", 0.025),
    full() {
      Audio.tone(1047, 0.12, "sine", 0.05);
      Audio.tone(1568, 0.18, "sine", 0.045, 0, 0.07);
    },
    load: (type) => Audio.tone(type === "overflow" ? 1200 : 800, 0.18, "triangle", 0.08, type === "overflow" ? 1800 : 1200),
    special(type) {
      if (type === "line" || type === "cross") Audio.tone(900, 0.3, "sawtooth", 0.06, 300);
      else if (type === "overflow") [523, 659, 784, 1047].forEach((f, k) => Audio.tone(f, 0.2, "triangle", 0.07, 0, k * 0.06));
      else {
        Audio.tone(160, 0.35, "sawtooth", 0.08, 50);
        Audio.noise(0.4, 400, 0.12, 0, "lowpass");
      }
    },
    shout: (lvl) => [0, 4, 7, 12].slice(0, 2 + lvl).forEach((s, k) => Audio.tone(523 * Math.pow(2, s / 12), 0.14, "triangle", 0.06, 0, k * 0.05)),
    hit: (hp) => Audio.tone(140 + hp * 30, 0.08, "square", 0.05),
    crack: () => {
      Audio.tone(90, 0.25, "sawtooth", 0.08, 50);
      Audio.noise(0.25, 900, 0.08);
    },
    chime: (k = 0) => Audio.tone(880 * Math.pow(2, k / 12), 0.3, "sine", 0.07),
    win: () => [523, 659, 784, 1047, 1319].forEach((f, k) => Audio.tone(f, 0.25, "triangle", 0.08, 0, k * 0.09)),
    lose: () => [392, 349, 311, 262].forEach((f, k) => Audio.tone(f, 0.3, "triangle", 0.07, 0, k * 0.14)),
    howl() {
      Audio.tone(300, 0.9, "sawtooth", 0.05, 520);
      Audio.tone(520, 0.6, "sine", 0.04, 380, 0.5);
    },
    roar() {
      Audio.tone(70, 0.8, "sawtooth", 0.12, 40);
      Audio.noise(0.8, 300, 0.15, 0, "lowpass");
    },
    tickTock: (hi) => Audio.tone(hi ? 1200 : 900, 0.03, "square", 0.04),
    bleat: (p, d) => Audio.bleat(p, d),
  };

  // ---------------- MUSIC ----------------
  // A tiny step sequencer. A song: { bpm, root (MIDI), scale, prog: chord degrees per bar,
  // lead: [16-step strings per bar, digits = scale steps above the chord, "." = rest],
  // bass: 16-step string, drums: { kick, snare, hat } 16-step strings }.
  const Music = (() => {
    const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], penta: [0, 2, 4, 7, 9] };
    let song = null;
    let timer = 0;
    let step = 0;
    let nextAt = 0;
    let rate = 1;
    let level = 0;
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const pitch = (deg) => {
      const s = SCALES[song.scale] || SCALES.major;
      const o = Math.floor(deg / s.length);
      return song.root + s[((deg % s.length) + s.length) % s.length] + 12 * o;
    };
    function play(s, t) {
      const a = Audio.ctx;
      const d = t - a.currentTime;
      const st = s % 16;
      const bar = Math.floor(s / 16);
      const chord = song.prog[bar % song.prog.length];
      const dr = song.drums;
      if (dr.kick[st] === "x" || (level > 0 && st % 4 === 0)) {
        Audio.tone(130, 0.16, "sine", 0.42, 42, d, true);
      }
      if (dr.snare[st] === "x") Audio.noise(0.12, 1600, 0.16, d, "bandpass", true);
      if (dr.hat[st] === "x" || (rate > 1 && st % 2 === 1) || (level > 1 && st % 2 === 0)) Audio.noise(0.035, 8000, st % 4 === 0 ? 0.06 : 0.035, d, "highpass", true);
      if (song.bass[st] !== ".") Audio.tone(hz(pitch(chord) - 24 + (song.bass[st] === "5" ? 7 : 0)), 0.18, "triangle", 0.2, 0, d, true);
      if (st === 0) for (const k of [0, 2, 4]) Audio.tone(hz(pitch(chord + k) - 12), 0.9 * (60 / song.bpm / rate) * 4 * 0.9, "sine", 0.035, 0, d, true);
      const lead = song.lead[bar % song.lead.length][st];
      if (lead && lead !== ".") Audio.tone(hz(pitch(chord + Number(lead)) + 12), 0.14, song.leadType || "square", 0.028, 0, d, true);
    }
    function tick() {
      const a = Audio.ctx;
      if (!a || !song) return;
      const spb = 60 / (song.bpm * rate) / 4;
      if (nextAt < a.currentTime) nextAt = a.currentTime + 0.05;
      while (nextAt < a.currentTime + 0.12) {
        play(step, nextAt);
        step++;
        nextAt += spb;
      }
    }
    function start(spec) {
      stop();
      if (!spec) return;
      song = spec;
      step = 0;
      rate = 1;
      level = 0;
      nextAt = 0;
      timer = setInterval(tick, 25);
    }
    function stop() {
      clearInterval(timer);
      timer = 0;
      song = null;
    }
    return { start, stop, setRate: (r) => (rate = r), setLevel: (l) => (level = l), get playing() { return !!song; } };
  })();

  // ---------------- HAPTICS ----------------
  const buzz = (pattern) => {
    if (!settings.vibe || !navigator.vibrate) return;
    try {
      navigator.vibrate(pattern);
    } catch {}
  };

  // ---------------- STATE ----------------
  let V = null; // the game being played
  let H = {}; // its hooks
  let tune = {};
  let setup = {};
  let stats = {};
  let G = null;
  let mode = "title"; // title | play | paused | between | results
  let match = null;
  const geo = { cell: 40, dpr: 1, w: 0, h: 0 };
  const band = { top: { w: 0, h: 0 }, bottom: { w: 0, h: 0 } };
  const rects = [0, 1, 2, 3].map(() => ({ x: 0, y: 0, w: 0, h: 0 }));
  const seatPlayer = [null, null, null, null];
  let boardCv;
  let ctx;
  let topCv;
  let topCtx;
  let botCv;
  let botCtx;
  let lastFrame = 0;
  let pointerX = 0.5;
  let betweenTimer = 0;
  const EMPTY = [];

  const key = (k) => `cfl2-${V.key}-${k}`;
  const tuneDefaults = () => ({ ...BASE_TUNE, ...(V.tune || {}) });
  const saveTune = () => Store.set(key("tune"), tune);
  const saveSetup = () => Store.set(key("setup"), setup);
  const saveStats = () => Store.set(key("stats"), stats);

  // ---------------- BOARD HELPERS ----------------
  const isPlayer = (o) => o >= 0 && o < G.players.length;
  const cellsOf = (p) => {
    let n = 0;
    for (let i = 0; i < G.b.size; i++) if (G.b.owner[i] === p) n++;
    return n;
  };
  const orbsOf = (p) => {
    let n = 0;
    for (let i = 0; i < G.b.size; i++) if (G.b.owner[i] === p) n += G.b.count[i];
    return n;
  };
  const sameTeam = (a, b) => a === b || (isPlayer(a) && isPlayer(b) && G.players[a].team === G.players[b].team);
  const cursorCell = (pl) => {
    const len = G.path.length;
    return G.path[((pl.pos % len) + len) % len];
  };
  const humans = () => G.players.filter((p) => p.human);

  function buildPath() {
    const b = G.b;
    G.path.length = 0;
    for (let r = 0; r < b.rows; r++)
      for (let k = 0; k < b.cols; k++) {
        const i = r * b.cols + (r % 2 ? b.cols - 1 - k : k);
        if (!b.rock[i] && (H.inPath ? H.inPath(G, i) : b.kind[i] !== "rock")) G.path.push(i);
      }
    if (!G.path.length) G.path.push(0);
  }

  // Rebuild the path but keep each cursor on the square it was on.
  function rebuildPath() {
    const at = G.players.map((pl) => cursorCell(pl));
    const oldLen = G.path.length;
    buildPath();
    G.players.forEach((pl, k) => {
      const p = G.path.indexOf(at[k]);
      pl.pos = p >= 0 ? p : Math.floor((((pl.pos % oldLen) + oldLen) % oldLen) * (G.path.length / oldLen));
    });
  }

  // ---------------- GAME ----------------
  function newPlayer(p, id, now) {
    return {
      id, seat: -1, kind: "human", level: null, team: id, color: COLORS[id % 4], name: NAMES[id % 4], sym: SYMBOLS[id % 4],
      speed: 1, dir: 1, pen: tune.pen, refillAt: 0, lockUntil: 0, special: null, lineDir: "row",
      alive: true, placed: false, chain: 0, best: 0, mood: null, moodUntil: 0, aiPlan: null, score: 0, nextStep: now, pos: null,
      observer: false, pressAt: -1e9, taps: 0, drops: 0, wastes: 0, empties: 0, bursts: 0, specials: 0, damage: 0,
      ...p,
      human: (p.kind ?? "human") === "human", // stays true even while a game borrows the seat (a finale, a test bot)
    };
  }

  function startRound() {
    clearTimeout(betweenTimer);
    const now = performance.now();
    const dims = V.board ? V.board(setup) : { rows: V.rows ?? 9, cols: V.cols ?? 6 };
    const b = Engine.createBoard(dims.rows, dims.cols, { tag: null, kind: null, hp: 0, mhp: 0 });
    const players = V.players(setup).map((p, id) => newPlayer(p, id, now));
    G = {
      b, players, path: [], start: now, waveAt: now, run: 0, over: false, rush: false, solo: !!(V.solo ?? false), data: {},
      flights: EMPTY, flightAt: 0, popAt: new Float64Array(b.size), incoming: new Int16Array(b.size), lastTimer: "",
      shakeAmp: 0, shakeAt: 0, bgDirty: true, tut: null, bob: 0,
    };
    if (typeof V.solo === "function") G.solo = V.solo(setup);
    seatPlayer.fill(null);
    for (const pl of players) if (pl.seat >= 0) seatPlayer[pl.seat] = pl;
    H.setup?.(G, setup, match);
    buildPath();
    players.forEach((pl, k) => {
      if (pl.pos === null) pl.pos = Math.floor((k * G.path.length) / players.length);
    });
    $("app").classList.toggle("solo", G.solo);
    $("app").classList.remove("rush");
    $("hud").textContent = "";
    H.hud?.(G);
    mode = "play";
    hideAll();
    layout();
    Music.start(V.music);
    if (!Store.get(key("tut"), false) && humans().length) startTutorial();
  }

  // A new game (not the next round of a match).
  function startGame() {
    saveSetup();
    Audio.unlock();
    match = V.match && setup.bestOf > 1 ? { round: 1, wins: {}, need: Math.ceil(setup.bestOf / 2) } : null;
    startRound();
  }

  const refillMs = (pl) => {
    const n = G.players.filter((p) => !p.observer).length;
    const base = H.refillMs?.(G, pl) ?? tune.refill * 1000 * (G.solo ? 1 : REFILL_SCALE[Math.min(4, n)]);
    return base / (G.rush ? 2 : 1);
  };

  function defaultCanDrop(pl, i) {
    const b = G.b;
    if (b.rock[i] || (H.blocked ? H.blocked(G, i, pl) : b.kind[i])) return false;
    const o = b.owner[i];
    return o === -1 || o === pl.id || (isPlayer(o) && sameTeam(o, pl.id));
  }

  // The one action: drop a sheep (or the loaded special) where the cursor is.
  function drop(pl, now = performance.now()) {
    if (!G || G.over || mode !== "play" || !pl.alive || pl.observer) return;
    if (pl.kind === "human") pl.taps++;
    if (now < pl.lockUntil) return;
    if (pl.pen <= 0) {
      if (pl.kind === "human") {
        pl.empties++;
        Sfx.empty();
        buzz(35);
      }
      return;
    }
    H.beforeDrop?.(G, pl, now);
    const i = cursorCell(pl);
    pl.pen--;
    if (!pl.refillAt) pl.refillAt = now + refillMs(pl);
    if (!(H.canDrop ? H.canDrop(G, pl, i, defaultCanDrop) : defaultCanDrop(pl, i))) {
      pl.lockUntil = now + LOCK_MS;
      pl.wastes++;
      mood(pl, "oops", LOCK_MS);
      Sfx.waste();
      if (pl.kind === "human") buzz([40, 60, 40]);
      H.onWaste?.(G, pl, i);
      return;
    }
    pl.placed = true;
    pl.drops++;
    const special = pl.special;
    pl.special = null;
    const b = G.b;
    const o = b.owner[i];
    if (o >= 0 && o !== pl.id && sameTeam(o, pl.id)) b.count[i]++;
    else Engine.place(b, i, pl.id);
    G.popAt[i] = now;
    if (pl.kind === "human") buzz(8);
    H.afterDrop?.(G, pl, i, special, now);
    if (special) pl.specials++;
    if (special === "overflow") overflow(pl, now);
    else if (special) {
      b.tag[i] = { type: special, dir: special === "line" ? pl.lineDir : null };
      if (special === "line") pl.lineDir = pl.lineDir === "row" ? "col" : "row";
      Sfx.load(special);
    } else Sfx.drop();
  }

  function overflow(pl, now) {
    const b = G.b;
    const fx = effect("overflow", -1, pl.color, now);
    for (let i = 0; i < b.size; i++)
      if (b.owner[i] === pl.id) {
        b.count[i]++;
        G.popAt[i] = now;
        if (fx) fx.cells[fx.n++] = i;
      }
    shout(pl, "Overflow!", 1.3);
    Sfx.special("overflow");
  }

  function landOn(to, who) {
    const b = G.b;
    const v = b.owner[to];
    if (isPlayer(v) && v !== who && sameTeam(v, who)) b.count[to]++;
    else {
      b.owner[to] = who;
      b.count[to]++;
    }
    G.popAt[to] = performance.now();
  }

  // Core blockers: Grumpy Rocks (take hits) and gift boxes (open into a special).
  function hitKind(i, who) {
    const b = G.b;
    const kind = b.kind[i];
    const now = performance.now();
    if (kind === "rock") {
      b.hp[i]--;
      Sfx.hit(b.hp[i]);
      effect("hit", i, "#ffffff", now);
      puff(i, "#c7cad1", 3);
      if (b.hp[i] <= 0) {
        b.kind[i] = null;
        Sfx.crack();
        puff(i, "#9aa0aa", 8);
        H.onRockBreak?.(G, i, who);
        rebuildPath();
      }
      return true;
    }
    if (kind === "box") {
      b.kind[i] = null;
      const pick = V.boxSpecials || ["line", "line", "bomb", "bomb", "overflow"];
      if (isPlayer(who)) {
        loadSpecial(G.players[who], pick[Math.floor(Math.random() * pick.length)]);
        shout(G.players[who], "Gift!", 1.1);
      }
      Sfx.chime(4);
      puff(i, "#e050ad", 8);
      H.onBox?.(G, i, who);
      return true;
    }
    return false;
  }

  // ---------------- WAVES ----------------
  const burstsBy = new Int32Array(8);
  const pending = [];
  const waveRules = {
    canBurst: (b, i) => {
      const o = b.owner[i];
      return isPlayer(o) && G.players[o].alive && (H.canBurst ? H.canBurst(G, b, i) : true);
    },
    targets: (b, i) => {
      const who = b.owner[i];
      burstsBy[who]++;
      if (b.tag[i]) {
        pending.push(b.tag[i].type, b.tag[i].dir, i, who);
        b.tag[i] = null;
      }
      const t = Engine.neighbours(b, i);
      return H.targets ? H.targets(G, b, i, t) : t;
    },
    emptied: (b, i) => {
      b.owner[i] = -1;
      H.emptied?.(G, b, i);
    },
    land: (b, from, to, who) => {
      if (!G.players[who].alive) return;
      if (H.land?.(G, b, from, to, who)) return;
      if (b.kind[to] && hitKind(to, who)) return;
      landOn(to, who);
    },
    maxWaves: 1,
  };

  function tickWave(now) {
    const n = G.players.length;
    burstsBy.fill(0);
    pending.length = 0;
    const { waves } = Engine.resolve(G.b, waveRules, false);
    G.flights = waves.length ? waves[0].bursts : EMPTY;
    G.flightAt = now;
    for (const f of G.flights) puff(f.from, G.players[f.who]?.color ?? "#fff", 3);
    for (let k = 0; k < pending.length; k += 4) special(pending[k], pending[k + 1], pending[k + 2], pending[k + 3], now);
    G.run = waves.length ? G.run + 1 : 0;
    if (G.run > (V.maxRun ?? MAX_RUN)) {
      for (let i = 0; i < G.b.size; i++) if (G.b.owner[i] >= 0 && !G.b.rock[i]) G.b.count[i] = Math.min(G.b.count[i], Engine.capacity(G.b, i) - 1);
      G.run = 0;
    }
    chains(n, now);
    H.afterWave?.(G, now, burstsBy);
    if (!H.noElimination && !G.tut) eliminate();
  }

  function areaFor(type, dir, i) {
    const b = G.b;
    const r0 = Engine.rowOf(b, i);
    const c0 = Engine.colOf(b, i);
    const out = [];
    const add = (r, c) => Engine.inside(b, r, c) && r * b.cols + c !== i && out.push(r * b.cols + c);
    if (type === "line") for (let k = 0; k < (dir === "row" ? b.cols : b.rows); k++) dir === "row" ? add(r0, k) : add(k, c0);
    else if (type === "bomb") for (const [dr, dc] of Engine.ALL8) add(r0 + dr, c0 + dc);
    else if (type === "cross") {
      for (let k = 0; k < b.cols; k++) add(r0, k);
      for (let k = 0; k < b.rows; k++) if (k !== r0) add(k, c0);
    } else if (type === "bigcross") {
      for (let r = 0; r < b.rows; r++) for (let c = 0; c < b.cols; c++) if (Math.abs(r - r0) <= 1 || Math.abs(c - c0) <= 1) add(r, c);
    } else if (type === "blast") for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) add(r0 + dr, c0 + dc);
    return out;
  }

  const COMBOS = { "line+line": "cross", "bomb+line": "bigcross", "bomb+bomb": "blast" };
  const COMBO_SHOUT = { cross: "Cross!", bigcross: "Mega cross!", blast: "Kaboom!" };

  // A special sheep's square burst: it takes its area, combining with any special it sets off.
  function special(type, dir, cell, who, now) {
    const b = G.b;
    let area = areaFor(type, dir, cell);
    const other = area.find((k) => b.tag[k]);
    if (other !== undefined) {
      const combo = COMBOS[[type, b.tag[other].type].sort().join("+")];
      b.tag[other] = null;
      if (combo) {
        type = combo;
        area = areaFor(combo, null, cell);
        shout(G.players[who], COMBO_SHOUT[combo], 1.4);
      }
    }
    for (const k of area) {
      if (b.rock[k] || H.specialHit?.(G, k, who)) continue;
      if (b.kind[k] && hitKind(k, who)) continue;
      landOn(k, who);
    }
    const fx = effect(type, cell, G.players[who].color, now);
    if (fx) for (const k of area) fx.cells[fx.n++] = k;
    shake(type === "blast" || type === "bigcross" ? 9 : 5);
    Sfx.special(type);
    buzz(type === "blast" ? 80 : 40);
    H.onSpecial?.(G, { type, cell, who }, type, area);
  }

  function loadSpecial(pl, type) {
    if (pl.special && RANK[type] <= RANK[pl.special]) return;
    pl.special = type;
    Sfx.load(type);
  }

  function chains(n, now) {
    let top = 0;
    for (let p = 0; p < n; p++) {
      const pl = G.players[p];
      const k = burstsBy[p];
      if (k > 0) {
        const prev = pl.chain;
        pl.chain += k;
        pl.bursts += k;
        rewards(pl, prev, pl.chain);
        H.onChain?.(G, pl, prev, pl.chain, now);
        if (pl.chain > top) top = pl.chain;
      } else if (pl.chain > 0) {
        pl.best = Math.max(pl.best, pl.chain);
        H.chainEnd?.(G, pl, pl.chain, now);
        pl.chain = 0;
      }
    }
    if (!top) return;
    Sfx.burst(top);
    if (top >= 2) shout(null, `Chain x${top}!`, 0.9, "#ffcf4a", "chain");
    shake(Math.min(10, 1 + top * 0.35));
    if (top === 8 || top === 16) buzz(top === 16 ? 120 : 60);
  }

  const crossed = (prev, now, at) => prev < at && now >= at;
  function rewards(pl, prev, now) {
    if (crossed(prev, now, tune.lineAt)) loadSpecial(pl, "line");
    if (crossed(prev, now, tune.plusAt)) pl.pen = Math.min(tune.pen, pl.pen + 2);
    if (crossed(prev, now, tune.bombAt)) loadSpecial(pl, "bomb");
    if (crossed(prev, now, tune.fullAt)) pl.pen = tune.pen;
    if (crossed(prev, now, tune.overflowAt)) loadSpecial(pl, "overflow");
    SHOUTS.forEach(([at, word, scale], lvl) => {
      if (crossed(prev, now, at)) {
        shout(pl, word, scale);
        Sfx.shout(lvl);
        if (lvl >= 2) Sfx.bleat(1.2);
      }
    });
    if (now >= 6) mood(pl, "cheer", 1400);
  }

  // Knock out flocks with no sheep once everyone has dropped at least once.
  function eliminate() {
    const live = G.players.filter((pl) => !pl.observer);
    if (!live.every((pl) => pl.placed || !pl.alive)) return;
    for (const pl of live) {
      if (pl.alive && orbsOf(pl.id) === 0) {
        pl.alive = false;
        pl.special = null;
        Sfx.howl();
        shout(pl, "Out!", 1.2);
        buzz(100);
      }
    }
  }

  // Default ending: last team standing, or most squares (then most sheep) when time runs out.
  function defaultEnd(left) {
    const teams = new Map();
    for (const pl of G.players) if (!pl.observer) teams.set(pl.team, teams.get(pl.team) || pl.alive);
    const alive = [...teams].filter(([, a]) => a).map(([t]) => t);
    if (alive.length === 1 && teams.size > 1) return { team: alive[0], why: "last" };
    if (left <= 0) {
      const score = (t) => G.players.filter((pl) => pl.team === t && pl.alive).reduce((s, pl) => s + cellsOf(pl.id) * 1000 + orbsOf(pl.id), 0);
      const ranked = [...teams.keys()].sort((a, b) => score(b) - score(a));
      return { team: ranked.length > 1 && score(ranked[0]) === score(ranked[1]) ? -1 : ranked[0], why: "time" };
    }
    return null;
  }

  const teamName = (t) => {
    const list = G.players.filter((p) => p.team === t && !p.observer);
    return list.map((p) => p.name).join(" & ");
  };
  const teamColor = (t) => G.players.find((p) => p.team === t)?.color ?? "#ffcf4a";
  const humanWon = (res) => res.team >= 0 && G.players.some((p) => p.human && p.team === res.team);

  // A round has ended: next round of a match, or the results.
  function endRound(res) {
    G.over = true;
    Music.stop();
    $("app").classList.remove("rush");
    if (match && res.team !== undefined) {
      if (res.team >= 0) match.wins[res.team] = (match.wins[res.team] || 0) + 1;
      const champ = Object.keys(match.wins).find((t) => match.wins[t] >= match.need);
      if (champ === undefined) return between(res);
      res.matchWon = Number(champ);
      res.team = Number(champ);
    }
    setTimeout(() => results(res), 650);
    (res.sad ?? !humanWon(res)) && humans().length ? Sfx.lose() : Sfx.win();
  }

  // ---------------- AI ----------------
  function aiStep(pl, now) {
    if (pl.kind !== "ai" || !pl.alive || pl.pen <= 0 || now < pl.lockUntil || G.tut) return;
    const skill = AI[pl.level || settings.ai] ?? AI.normal;
    const i = cursorCell(pl);
    const ok = H.canDrop ? H.canDrop(G, pl, i, defaultCanDrop) : defaultCanDrop(pl, i);
    if (!ok && Math.random() >= skill.miss) return;
    let gain = 0;
    if (ok) {
      const b = G.b;
      const mine = (o) => o === pl.id || (isPlayer(o) && sameTeam(o, pl.id));
      const theirs = (o) => isPlayer(o) && !sameTeam(o, pl.id);
      const score = (bb) => Kit.evaluate(bb, mine, theirs, (c) => Engine.capacity(bb, c));
      const after = Engine.clone(b);
      Engine.place(after, i, pl.id);
      Engine.resolve(after, { maxWaves: 40, canBurst: (bb, c) => isPlayer(bb.owner[c]) }, false);
      gain = score(after) - score(b) + (H.aiValue?.(G, pl, i) ?? 0);
      if (pl.special && pl.special !== "overflow") gain += Engine.neighbours(b, i, Engine.ALL8).filter((k) => theirs(b.owner[k])).length * 2;
    }
    const reserve = (pl.level || settings.ai) === "hard" && pl.pen <= 1 && gain < skill.pick * 2;
    if (!pl.placed || (ok && !reserve && (gain >= skill.pick || Math.random() < skill.idle)) || !ok) {
      const [lo, hi] = skill.react;
      pl.aiPlan = { cell: i, at: H.aiTime?.(G, pl, now, skill) ?? now + lo + Math.random() * (hi - lo) };
    }
  }

  // ---------------- LOOP ----------------
  function update(now, dt) {
    if (G.tut) {
      // the tutorial holds the clock and the AI
      G.start += dt;
      tutorialStep(now);
    }
    const elapsed = (now - G.start) / 1000;
    const secs = H.roundSecs ? H.roundSecs(G) : tune.roundSecs;
    const left = secs - elapsed;
    if (Number.isFinite(secs) && left <= tune.stampedeSecs && left > 0 && !G.rush) {
      G.rush = true;
      $("app").classList.add("rush");
      shout(null, "STAMPEDE!", 1.6, "#ff6b6b");
      Sfx.howl();
      Music.setRate(1.25);
      buzz(80);
    }
    for (const pl of G.players) {
      if (!pl.alive || pl.observer) continue;
      const stepMs = (H.stepMs?.(G, pl) ?? tune.cursorMs) / pl.speed / (G.rush ? 1.2 : 1);
      if (now >= pl.nextStep) {
        pl.nextStep = Math.max(pl.nextStep + stepMs, now - stepMs);
        pl.pos += pl.dir;
        H.onStep?.(G, pl, now);
        aiStep(pl, now);
      }
      if (pl.aiPlan && now >= pl.aiPlan.at) {
        if (cursorCell(pl) === pl.aiPlan.cell) drop(pl, now);
        pl.aiPlan = null;
      }
      if (pl.pen < tune.pen) {
        if (!pl.refillAt) pl.refillAt = now + refillMs(pl);
        if (now >= pl.refillAt) {
          pl.pen++;
          pl.refillAt = pl.pen < tune.pen ? now + refillMs(pl) : 0;
          if (pl.kind === "human") pl.pen === tune.pen ? Sfx.full() : Sfx.tick();
        }
      } else pl.refillAt = 0;
    }
    if (now - G.waveAt >= WAVE_MS) {
      G.waveAt = now;
      tickWave(now);
    }
    H.update?.(G, now, left);
    if (G.over) return;
    const txt = Number.isFinite(secs) ? `${Math.floor(Math.max(0, Math.ceil(left)) / 60)}:${String(Math.max(0, Math.ceil(left)) % 60).padStart(2, "0")}` : H.timerText?.(G) ?? "";
    if (txt !== G.lastTimer) {
      G.lastTimer = txt;
      $("timer").textContent = txt;
      $("timer-top").textContent = txt;
      if (G.rush) Sfx.tickTock(left <= 5);
    }
    if (G.tut) return;
    const res = H.endCheck ? H.endCheck(G, now, left, defaultEnd) : defaultEnd(left);
    if (res) endRound(res);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(50, now - (lastFrame || now));
    lastFrame = now;
    if (G && mode === "play" && !G.over) update(now, dt);
    if (G) {
      drawBoard(now, dt);
      drawBands(now);
    }
    if (mode === "title" && !$("title").hidden) drawTitleLamb(now);
  }

  function pause() {
    if (!G || G.over || mode !== "play") return;
    mode = "paused";
    G.pauseAt = performance.now();
    Music.stop();
    show("pausemenu");
  }

  function resume() {
    if (!G || mode !== "paused") return;
    hideAll();
    const d = performance.now() - G.pauseAt;
    G.start += d;
    G.waveAt += d;
    for (const pl of G.players) {
      pl.nextStep += d;
      if (pl.refillAt) pl.refillAt += d;
      pl.lockUntil += d;
      pl.moodUntil += d;
      if (pl.aiPlan) pl.aiPlan.at += d;
    }
    if (G.tut) G.tut.at += d;
    H.shift?.(G, d);
    mode = "play";
    Audio.unlock();
    Music.start(V.music);
    if (G.rush) Music.setRate(1.25);
  }

  // ---------------- SHOUTS AND MOODS ----------------
  const shoutPool = [];
  const shoutOwner = new Map();
  function shout(pl, text, scale = 1, color, slot) {
    const id = slot ?? pl?.id ?? -1;
    let el = shoutOwner.get(id);
    if (!el) {
      el = shoutPool.find((e) => ![...shoutOwner.values()].includes(e)) || shoutPool[0];
      for (const [k, v] of shoutOwner) if (v === el) shoutOwner.delete(k);
      shoutOwner.set(id, el);
    }
    const now = performance.now();
    el.textContent = text;
    el.style.color = color ?? pl?.color ?? "#ffcf4a";
    el.style.fontSize = `${2 * scale}rem`;
    // a shout that is still popping just changes its words; restarting the animation costs a layout
    if (el.owner !== id || now - el.startedAt > 450) {
      el.owner = id;
      el.startedAt = now;
      el.className = "shout" + (pl && pl.seat >= 0 && !BOTTOM[pl.seat] ? " flip" : "");
      el.style.top = slot === "chain" ? "40%" : pl && pl.seat >= 0 ? (BOTTOM[pl.seat] ? "64%" : "36%") : "50%";
      void el.offsetWidth;
      el.classList.add("go");
    }
    clearTimeout(el.done);
    el.done = setTimeout(() => {
      if (shoutOwner.get(id) === el) shoutOwner.delete(id);
    }, 1000);
  }

  function mood(pl, kind, ms) {
    pl.mood = kind;
    pl.moodUntil = performance.now() + ms;
  }

  function shake(amp) {
    const a = amp * (settings.reduced ? 0.25 : 1);
    if (a > G.shakeAmp * Math.max(0, 1 - (performance.now() - G.shakeAt) / 300)) {
      G.shakeAmp = a;
      G.shakeAt = performance.now();
    }
  }

  // ---------------- PARTICLES AND EFFECTS (pooled) ----------------
  const P_MAX = 240;
  const parts = Array.from({ length: P_MAX }, () => ({ on: false, x: 0, y: 0, vx: 0, vy: 0, t: 0, life: 1, r: 1, c: "#fff" }));
  let pNext = 0;
  function puff(cell, color, n) {
    if (!G) return;
    const c = geo.cell;
    const cx = (Engine.colOf(G.b, cell) + 0.5) * c;
    const cy = (Engine.rowOf(G.b, cell) + 0.5) * c;
    const count = settings.reduced ? Math.ceil(n / 2) : n;
    for (let k = 0; k < count; k++) {
      const p = parts[pNext];
      pNext = (pNext + 1) % P_MAX;
      const a = Math.random() * Math.PI * 2;
      const s = (0.4 + Math.random() * 0.9) * c * 0.004;
      p.on = true;
      p.x = cx;
      p.y = cy;
      p.vx = Math.cos(a) * s;
      p.vy = Math.sin(a) * s - c * 0.0015;
      p.t = 0;
      p.life = 380 + Math.random() * 260;
      p.r = c * (0.06 + Math.random() * 0.06);
      p.c = k % 2 ? "#ffffff" : color;
    }
  }

  const FX_MAX = 16;
  const fxPool = Array.from({ length: FX_MAX }, () => ({ on: false, type: "", cell: -1, color: "", t0: 0, n: 0, cells: new Int16Array(128) }));
  let fxNext = 0;
  function effect(type, cell, color, t0) {
    const f = fxPool[fxNext];
    fxNext = (fxNext + 1) % FX_MAX;
    f.on = true;
    f.type = type;
    f.cell = cell;
    f.color = color;
    f.t0 = t0;
    f.n = 0;
    if (type === "hit" && cell >= 0) f.cells[f.n++] = cell;
    return f;
  }

  // ---------------- RENDERING ----------------
  function sizeCanvas(cv, w, h) {
    const d = geo.dpr;
    const W = Math.max(1, Math.round(w * d));
    const Hh = Math.max(1, Math.round(h * d));
    if (cv.width !== W || cv.height !== Hh) {
      cv.width = W;
      cv.height = Hh;
    }
  }

  function layout() {
    geo.dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const [name, cv] of [["top", topCv], ["bottom", botCv]]) {
      band[name].w = cv.clientWidth;
      band[name].h = cv.clientHeight;
      sizeCanvas(cv, band[name].w, band[name].h);
    }
    for (let s = 0; s < 4; s++) {
      const B = BOTTOM[s] ? band.bottom : band.top;
      const r = rects[s];
      const solo = G?.solo;
      r.w = solo ? Math.min(180, B.w * 0.46) : Math.min(152, (B.w - 112) / 2);
      r.h = B.h - ROW_H - 6;
      r.y = ROW_H;
      r.x = solo ? (B.w - r.w) / 2 : OWN_LEFT[s] ? 6 : B.w - 6 - r.w;
    }
    if (!G) return;
    const st = $("stage");
    const cols = G.b.cols;
    const rows = G.b.rows;
    geo.cell = Math.max(8, Math.floor(Math.min((st.clientWidth - PAD * 2) / cols, (st.clientHeight - PAD * 2) / rows)));
    geo.w = cols * geo.cell + PAD * 2;
    geo.h = rows * geo.cell + PAD * 2;
    boardCv.style.width = `${geo.w}px`;
    boardCv.style.height = `${geo.h}px`;
    sizeCanvas(boardCv, geo.w, geo.h);
    sprites.clear();
    G.bgDirty = true;
  }

  // Sheep sprites are drawn once per colour, mark and size, then copied.
  const sprites = new Map();
  function sprite(color, sym, flip, r) {
    const k = `${color}|${sym}|${flip}|${r}`;
    let cv = sprites.get(k);
    if (cv) return cv;
    cv = document.createElement("canvas");
    const L = Math.ceil(r * 3.4);
    cv.width = cv.height = Math.ceil(L * geo.dpr);
    cv.L = L;
    const g = cv.getContext("2d");
    g.scale(geo.dpr, geo.dpr);
    Kit.drawSheep(g, L / 2, L / 2, r, color, { flip });
    if (sym) mark(g, L / 2 + (flip ? r * 0.12 : -r * 0.12), L / 2 - r * 0.05, r * 0.42, sym);
    sprites.set(k, cv);
    return cv;
  }

  function mark(g, x, y, s, sym, fill = "rgba(255,255,255,0.9)") {
    g.fillStyle = fill;
    g.strokeStyle = "rgba(0,0,0,0.45)";
    g.lineWidth = Math.max(1, s * 0.22);
    g.beginPath();
    if (sym === "circle") g.arc(x, y, s * 0.55, 0, Math.PI * 2);
    else if (sym === "triangle") {
      g.moveTo(x, y - s * 0.65);
      g.lineTo(x + s * 0.62, y + s * 0.45);
      g.lineTo(x - s * 0.62, y + s * 0.45);
    } else if (sym === "square") g.rect(x - s * 0.48, y - s * 0.48, s * 0.96, s * 0.96);
    else {
      g.moveTo(x, y - s * 0.7);
      g.lineTo(x + s * 0.6, y);
      g.lineTo(x, y + s * 0.7);
      g.lineTo(x - s * 0.6, y);
    }
    g.closePath();
    g.stroke();
    g.fill();
  }

  // The grass, stones and grid are drawn into a cached background.
  let bg = null;
  function drawBackground() {
    const b = G.b;
    const c = geo.cell;
    bg ??= document.createElement("canvas");
    sizeCanvas(bg, geo.w, geo.h);
    const g = bg.getContext("2d");
    g.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
    g.clearRect(0, 0, geo.w, geo.h);
    g.fillStyle = V.theme?.edge ?? "#24402c";
    g.beginPath();
    g.roundRect(0, 0, geo.w, geo.h, 12);
    g.fill();
    g.translate(PAD, PAD);
    const [g1, g2] = V.theme?.grass ?? ["#3d7a45", "#46874e"];
    for (let i = 0; i < b.size; i++) {
      const x = Engine.colOf(b, i) * c;
      const y = Engine.rowOf(b, i) * c;
      if (b.rock[i]) {
        drawStone(g, x, y, c, i);
        continue;
      }
      g.fillStyle = (Engine.rowOf(b, i) + Engine.colOf(b, i)) % 2 ? g1 : g2;
      g.fillRect(x, y, c, c);
      // a few grass tufts
      g.strokeStyle = "rgba(255,255,255,0.07)";
      g.lineWidth = 1.5;
      g.beginPath();
      const tx = x + ((i * 37) % 70) / 100 * c + c * 0.12;
      const ty = y + ((i * 53) % 60) / 100 * c + c * 0.25;
      g.moveTo(tx, ty);
      g.lineTo(tx - 2, ty - 5);
      g.moveTo(tx + 3, ty);
      g.lineTo(tx + 4, ty - 6);
      g.stroke();
    }
    g.strokeStyle = "rgba(255,255,255,0.14)";
    g.lineWidth = 1;
    g.beginPath();
    for (let col = 1; col < b.cols; col++) {
      g.moveTo(col * c, 0);
      g.lineTo(col * c, b.rows * c);
    }
    for (let row = 1; row < b.rows; row++) {
      g.moveTo(0, row * c);
      g.lineTo(b.cols * c, row * c);
    }
    g.stroke();
    G.bgDirty = false;
  }

  function drawStone(g, x, y, c, i) {
    g.fillStyle = "#5f645c";
    g.fillRect(x, y, c, c);
    for (const [dx, dy, w, h] of [[0.08, 0.1, 0.5, 0.36], [0.6, 0.1, 0.32, 0.36], [0.08, 0.52, 0.3, 0.38], [0.42, 0.52, 0.5, 0.38]]) {
      g.fillStyle = (i + dx * 10) % 2 > 1 ? "#80847b" : "#767a71";
      g.beginPath();
      g.roundRect(x + dx * c, y + dy * c, w * c, h * c, c * 0.08);
      g.fill();
    }
  }

  // A Grumpy Rock: eyes follow the nearest cursor, brows and cracks grow with each hit.
  function drawRock(g, cx, cy, r, hp, maxHp, lookX, lookY) {
    Kit.ellipse(g, cx, cy + r * 0.08, r * 0.95, r * 0.8, 0, "#7d828d");
    Kit.ellipse(g, cx - r * 0.25, cy - r * 0.2, r * 0.45, r * 0.3, -0.3, "#9599a3");
    const hits = Math.max(0, maxHp - hp);
    g.strokeStyle = "#3e4048";
    g.lineWidth = Math.max(1.5, r * 0.07);
    for (let k = 0; k < hits; k++) {
      const a = k * 2.1 + 0.6;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r * 0.85, cy + Math.sin(a) * r * 0.7);
      g.lineTo(cx + Math.cos(a) * r * 0.45, cy + Math.sin(a + 0.4) * r * 0.4);
      g.lineTo(cx + Math.cos(a + 0.3) * r * 0.2, cy + Math.sin(a) * r * 0.25);
      g.stroke();
    }
    const anger = Math.min(4, hits + (maxHp > 3 ? 1 : 0));
    for (let side = -1; side <= 1; side += 2) {
      const ex = cx + side * r * 0.32;
      const ey = cy - r * 0.05;
      Kit.circle(g, ex, ey, r * 0.2, "#fff");
      const dx = lookX - ex;
      const dy = lookY - ey;
      const d = Math.hypot(dx, dy) || 1;
      Kit.circle(g, ex + (dx / d) * r * 0.08, ey + (dy / d) * r * 0.08, r * 0.1, "#1a1622");
      g.strokeStyle = "#2e2a33";
      g.lineWidth = r * 0.09;
      g.beginPath();
      g.moveTo(ex - side * r * 0.2, ey - r * (0.3 - anger * 0.06));
      g.lineTo(ex + side * r * 0.18, ey - r * (0.3 + anger * 0.06));
      g.stroke();
    }
    if (hp > 5) {
      g.fillStyle = "#ffcf4a";
      g.font = `900 ${Math.round(r * 0.32)}px system-ui`;
      g.textAlign = "center";
      g.fillText(hp, cx, cy + r * 0.68);
      g.textAlign = "start";
    } else for (let k = 0; k < hp; k++) Kit.circle(g, cx - ((hp - 1) / 2) * r * 0.22 + k * r * 0.22, cy + r * 0.6, r * 0.07, "#ffcf4a");
  }

  function drawGift(g, x, y, r, t) {
    y += Math.sin(t * 4) * r * 0.08;
    g.fillStyle = "#c0398f";
    g.fillRect(x - r, y - r * 0.7, r * 2, r * 1.6);
    g.fillStyle = "#e050ad";
    g.fillRect(x - r * 1.1, y - r * 0.95, r * 2.2, r * 0.45);
    g.fillStyle = "#ffcf4a";
    g.fillRect(x - r * 0.16, y - r * 0.95, r * 0.32, r * 1.85);
    Kit.ellipse(g, x - r * 0.4, y - r * 1.12, r * 0.35, r * 0.2, -0.4, "#ffcf4a");
    Kit.ellipse(g, x + r * 0.4, y - r * 1.12, r * 0.35, r * 0.2, 0.4, "#ffcf4a");
  }

  // Special sheep: Line has stripes showing its direction, Bomb is a round woolly ball, Overflow is golden.
  function drawSpecial(g, x, y, r, type, color, dir, t) {
    if (type === "bomb") {
      Kit.circle(g, x, y, r * 1.15, color);
      g.strokeStyle = Kit.shade(color, 0.5);
      g.lineWidth = r * 0.18;
      g.beginPath();
      g.arc(x, y, r * 0.6, 0.5, 4.5);
      g.stroke();
      g.strokeStyle = "#5b4630";
      g.lineWidth = r * 0.16;
      g.beginPath();
      g.moveTo(x + r * 0.7, y - r * 0.8);
      g.quadraticCurveTo(x + r * 1.1, y - r * 1.3, x + r * 1.4, y - r * 1.1);
      g.stroke();
      Kit.circle(g, x + r * 1.45, y - r * 1.15, r * (0.2 + 0.1 * Math.sin(t * 20)), "#ffcf4a");
      return;
    }
    Kit.drawSheep(g, x, y, r, type === "overflow" ? "#ffcf4a" : color);
    if (type === "overflow") {
      g.globalAlpha = 0.5 + 0.3 * Math.sin(t * 6);
      Kit.circle(g, x, y, r * 1.6, "rgba(255,220,100,0.35)");
      g.globalAlpha = 1;
      return;
    }
    g.strokeStyle = "rgba(255,255,255,0.95)";
    g.lineWidth = r * 0.22;
    g.beginPath();
    for (const k of [-0.45, 0, 0.45]) {
      if (dir === "row") {
        g.moveTo(x - r * 0.8, y + k * r);
        g.lineTo(x + r * 0.8, y + k * r);
      } else {
        g.moveTo(x + k * r, y - r * 0.7);
        g.lineTo(x + k * r, y + r * 0.7);
      }
    }
    g.stroke();
  }

  const SPOTS = [null, [[0, 0]], [[-0.2, 0], [0.2, 0.02]], [[-0.2, 0.12], [0.2, 0.12], [0, -0.16]], [[-0.2, -0.15], [0.2, -0.15], [-0.2, 0.17], [0.2, 0.17]]];
  const tints = new Map();
  const tint = (color) => {
    let t = tints.get(color);
    if (!t) tints.set(color, (t = color + "40"));
    return t;
  };

  function nearestCursor(cell) {
    const b = G.b;
    let best = null;
    let d = 1e9;
    for (const pl of G.players) {
      if (pl.observer || !pl.alive) continue;
      const k = cursorCell(pl);
      const dd = Math.abs(Engine.rowOf(b, k) - Engine.rowOf(b, cell)) + Math.abs(Engine.colOf(b, k) - Engine.colOf(b, cell));
      if (dd < d) [d, best] = [dd, k];
    }
    return best ?? cell;
  }

  function drawBoard(now, dt) {
    if (G.bgDirty) drawBackground();
    const t = now / 1000;
    const b = G.b;
    const c = geo.cell;
    ctx.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
    ctx.clearRect(0, 0, geo.w, geo.h);
    const sk = G.shakeAmp * Math.max(0, 1 - (now - G.shakeAt) / 300);
    const sx = sk ? Math.sin(now * 0.09) * sk : 0;
    const sy = sk ? Math.cos(now * 0.11) * sk * 0.7 : 0;
    ctx.translate(sx, sy);
    const bob = G.bob || 0;
    if (bob) {
      ctx.translate(geo.w / 2, geo.h / 2);
      ctx.scale(1 + 0.012 * bob, 1 + 0.012 * bob);
      ctx.translate(-geo.w / 2, -geo.h / 2);
    }
    ctx.drawImage(bg, 0, 0, geo.w, geo.h);
    ctx.translate(PAD, PAD);
    const inc = G.incoming;
    inc.fill(0);
    const fp = Math.min(1, (now - G.flightAt) / WAVE_MS);
    if (fp < 1) for (const f of G.flights) for (const d of f.to) inc[d]++;
    const r = c * 0.14;
    for (let i = 0; i < b.size; i++) {
      if (b.rock[i]) continue;
      const x = Engine.colOf(b, i) * c;
      const y = Engine.rowOf(b, i) * c;
      const o = b.owner[i];
      if (isPlayer(o)) {
        ctx.fillStyle = tint(G.players[o].color);
        ctx.fillRect(x, y, c, c);
      }
      if (H.drawCell?.(ctx, G, i, x, y, c, t, now)) continue;
      const kind = b.kind[i];
      if (kind === "rock") {
        const k = nearestCursor(i);
        drawRock(ctx, x + c / 2, y + c / 2, c * 0.4, b.hp[i], b.mhp[i] || b.hp[i], (Engine.colOf(b, k) + 0.5) * c, (Engine.rowOf(b, k) + 0.5) * c);
        continue;
      }
      if (kind === "box") {
        drawGift(ctx, x + c / 2, y + c / 2 + c * 0.05, c * 0.28, t + i);
        continue;
      }
      const n = b.count[i] - inc[i];
      if (n <= 0 || o < 0) continue;
      const color = o === NEUTRAL ? "#a9a9b6" : G.players[o]?.color ?? "#fff";
      const sym = o === NEUTRAL ? null : G.players[o]?.sym;
      const k = Math.min(n, 4);
      const nervous = o !== NEUTRAL && n >= Engine.capacity(b, i) - 1;
      const pa = (now - G.popAt[i]) / 220;
      const squash = pa < 1 ? Math.sin(Math.PI * pa) * (1 - pa) * 0.45 : 0;
      for (let s = 0; s < k; s++) {
        const sp = SPOTS[k][s];
        const jx = nervous && !settings.reduced ? Math.sin(t * 40 + i * 3 + s) * c * 0.02 : 0;
        const px = x + (0.5 + sp[0]) * c + jx;
        const py = y + (0.5 + sp[1]) * c;
        if (s === 0 && b.tag[i]) {
          drawSpecial(ctx, px, py, r, b.tag[i].type, color, b.tag[i].dir, t);
          continue;
        }
        const img = sprite(color, sym, s % 2 === 1, Math.round(r * 2) / 2);
        const w = img.L * (1 + squash * 0.5);
        const h = img.L * (1 - squash);
        ctx.drawImage(img, px - w / 2, py + img.L / 2 - h - img.L * 0.0, w, h);
      }
      if (n > 4) {
        ctx.fillStyle = "#ffcf4a";
        ctx.font = `900 ${Math.round(c * 0.24)}px system-ui`;
        ctx.fillText(n, x + c * 0.72, y + c * 0.95);
      }
    }
    // sheep in flight
    if (fp < 1) {
      const e = 1 - (1 - fp) * (1 - fp);
      for (const f of G.flights) {
        const fx = (Engine.colOf(b, f.from) + 0.5) * c;
        const fy = (Engine.rowOf(b, f.from) + 0.5) * c;
        const pl = G.players[f.who];
        for (const d of f.to) {
          const tx = (Engine.colOf(b, d) + 0.5) * c;
          const ty = (Engine.rowOf(b, d) + 0.5) * c;
          const img = sprite(pl?.color ?? "#fff", pl?.sym, tx < fx, Math.round(r * 2) / 2);
          ctx.drawImage(img, fx + (tx - fx) * e - img.L / 2, fy + (ty - fy) * e - Math.sin(Math.PI * fp) * c * 0.3 - img.L / 2, img.L, img.L);
        }
      }
    }
    // special and hit effects, about half a second each
    for (const f of fxPool) {
      if (!f.on) continue;
      const p = (now - f.t0) / 500;
      if (p >= 1) {
        f.on = false;
        continue;
      }
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = f.type === "overflow" ? "#ffe680" : f.color;
      for (let k = 0; k < f.n; k++) {
        const x = Engine.colOf(b, f.cells[k]) * c;
        const y = Engine.rowOf(b, f.cells[k]) * c;
        if (f.type === "overflow") Kit.circle(ctx, x + c / 2, y + c / 2 - p * c * 0.4, c * 0.12, "#ffe680");
        else ctx.fillRect(x + c * 0.1 * p, y + c * 0.1 * p, c * (1 - 0.2 * p), c * (1 - 0.2 * p));
      }
      if (f.cell >= 0 && (f.type === "bomb" || f.type === "blast" || f.type === "bigcross")) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc((Engine.colOf(b, f.cell) + 0.5) * c, (Engine.rowOf(b, f.cell) + 0.5) * c, c * (0.5 + p * (f.type === "bomb" ? 1.5 : 2.5)), 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    // wool puffs
    for (const p of parts) {
      if (!p.on) continue;
      p.t += dt;
      if (p.t >= p.life) {
        p.on = false;
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 0.00002 * c * dt;
      ctx.globalAlpha = 1 - p.t / p.life;
      Kit.circle(ctx, p.x, p.y, p.r * (1 + p.t / p.life), p.c);
    }
    ctx.globalAlpha = 1;
    H.drawOver?.(ctx, G, c, t, now);
    drawCursors(now, t);
    if (settings.pen === "bar") drawEdgeBars(now);
  }

  function drawCursors(now, t) {
    const c = geo.cell;
    const b = G.b;
    G.players.forEach((pl, q) => {
      if (!pl.alive || pl.observer || H.hideCursor?.(G, pl)) return;
      const i = cursorCell(pl);
      const x = Engine.colOf(b, i) * c;
      const y = Engine.rowOf(b, i) * c;
      const inset = 2 + (q % 4) * 4;
      const dots = settings.pen === "dots" && pl.kind === "human";
      const empty = pl.pen <= 0;
      const last = pl.pen === 1;
      ctx.globalAlpha = now < pl.lockUntil ? 0.35 : 1;
      ctx.lineWidth = dots && last ? 4 + 2 * Math.abs(Math.sin(t * 9)) : 4;
      ctx.strokeStyle = dots && empty ? "#8a8f96" : pl.color;
      if (dots && empty) ctx.setLineDash([5, 4]);
      ctx.strokeRect(x + inset, y + inset, c - inset * 2, c - inset * 2);
      ctx.setLineDash(EMPTY);
      if (pl.special) drawSpecial(ctx, x + c - inset - c * 0.12, y + inset + c * 0.12, c * 0.08, pl.special, pl.color, pl.lineDir, t);
      if (dots) {
        // one dot per sheep in the pen, on the side of the cursor facing its player
        const n = tune.pen;
        const gap = Math.max(2, (c - inset * 2 - 8) / n);
        const yy = pl.seat >= 0 && !BOTTOM[pl.seat] ? y + inset + 5 : y + c - inset - 5;
        for (let k = 0; k < n; k++) {
          const xx = x + inset + 4 + gap * (k + 0.5);
          ctx.beginPath();
          ctx.arc(xx, yy, Math.max(0.8, Math.min(3.2, gap * 0.32)), 0, Math.PI * 2);
          if (k < pl.pen) {
            ctx.fillStyle = "#fffaf0";
            ctx.fill();
          } else {
            ctx.strokeStyle = "rgba(255,255,255,0.45)";
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;
    });
  }

  // Edge bar: a segmented bar along each human's side of the board.
  function drawEdgeBars(now) {
    const W = G.b.cols * geo.cell;
    const Hh = G.b.rows * geo.cell;
    const bottoms = G.players.filter((p) => p.seat >= 0 && BOTTOM[p.seat] && p.kind === "human" && !p.observer);
    const tops = G.players.filter((p) => p.seat >= 0 && !BOTTOM[p.seat] && p.kind === "human" && !p.observer);
    for (const [list, y] of [[bottoms, Hh + 2], [tops, -PAD + 1]]) {
      list.forEach((pl, k) => {
        const span = W / list.length;
        const x0 = list.length === 1 ? 0 : OWN_LEFT[pl.seat] === BOTTOM[pl.seat] ? 0 : span;
        const n = tune.pen;
        const seg = span / n;
        for (let s = 0; s < n; s++) {
          let fill = s < pl.pen ? 1 : 0;
          if (s === pl.pen && pl.refillAt) fill = Math.max(0, 1 - (pl.refillAt - now) / refillMs(pl));
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.fillRect(x0 + s * seg + 1, y, seg - 2, PAD - 3);
          if (fill > 0) {
            ctx.fillStyle = pl.pen <= 1 && fill >= 1 ? "#ff8a8a" : pl.color;
            ctx.fillRect(x0 + s * seg + 1, y, (seg - 2) * fill, PAD - 3);
          }
        }
      });
    }
  }

  // The bands: each player's button with its lamb, pen display, special and lock.
  function drawBands(now) {
    const t = now / 1000;
    for (const [name, cv, g] of [["top", topCv, topCtx], ["bottom", botCv, botCtx]]) {
      const B = band[name];
      g.setTransform(geo.dpr, 0, 0, geo.dpr, 0, 0);
      g.clearRect(0, 0, B.w, B.h);
      if (name === "top") {
        if (G.solo) continue;
        g.translate(B.w, B.h);
        g.rotate(Math.PI);
      }
      for (let s = 0; s < 4; s++) {
        if (BOTTOM[s] !== (name === "bottom")) continue;
        const pl = seatPlayer[s];
        if (pl) drawButton(g, pl, rects[s], now, t);
      }
    }
  }

  function drawButton(g, pl, R, now, t) {
    const empty = pl.pen <= 0;
    const locked = now < pl.lockUntil;
    const press = Math.max(0, 1 - (now - pl.pressAt) / 120);
    const x = R.x;
    const y = R.y + press * 3;
    const w = R.w;
    const h = R.h;
    if (settings.zone === "corner" && pl.kind === "human") {
      g.fillStyle = "rgba(255,255,255,0.04)";
      const B = BOTTOM[pl.seat] ? band.bottom : band.top;
      const zx = G.solo ? 0 : OWN_LEFT[pl.seat] ? 0 : B.w / 2;
      g.fillRect(zx, 0, G.solo ? B.w : B.w / 2, B.h);
    }
    g.fillStyle = "rgba(0,0,0,0.35)";
    g.beginPath();
    g.roundRect(x, R.y + 5, w, h, 24);
    g.fill();
    g.fillStyle = !pl.alive || empty ? "#7b7f86" : pl.color;
    g.beginPath();
    g.roundRect(x, y, w, h, 24);
    g.fill();
    const cx = x + w / 2;
    const cy = y + h / 2 + 2;
    const R2 = Math.min(w, h) * 0.42;
    if (settings.pen === "ring") {
      const n = tune.pen;
      for (let k = 0; k < n; k++) {
        const gap = n > 1 ? 0.32 : 0;
        const a0 = -Math.PI / 2 + (k / n) * Math.PI * 2 + gap / 2;
        const a1 = -Math.PI / 2 + ((k + 1) / n) * Math.PI * 2 - gap / 2;
        g.lineWidth = 7;
        g.lineCap = "round";
        g.strokeStyle = "rgba(0,0,0,0.25)";
        g.beginPath();
        g.arc(cx, cy, R2, a0, a1);
        g.stroke();
        let fill = k < pl.pen ? 1 : 0;
        if (k === pl.pen && pl.refillAt) fill = Math.max(0, 1 - (pl.refillAt - now) / refillMs(pl));
        if (fill > 0) {
          g.strokeStyle = "#fffaf0";
          g.beginPath();
          g.arc(cx, cy, R2, a0, a0 + (a1 - a0) * fill);
          g.stroke();
        }
      }
    }
    if (settings.pen === "row" && pl.kind === "human") {
      // a row of sheep just above the button, out from under the thumb
      const n = tune.pen;
      const size = Math.min(7, (w - 8) / n / 2.6);
      for (let k = 0; k < n; k++) {
        const sx = cx + (k - (n - 1) / 2) * size * 2.6;
        let fill = k < pl.pen ? 1 : 0;
        if (k === pl.pen && pl.refillAt) fill = Math.max(0, 1 - (pl.refillAt - now) / refillMs(pl));
        g.globalAlpha = fill >= 1 ? 1 : 0.25 + fill * 0.4;
        const img = sprite(fill >= 1 ? pl.color : "#8a8f96", null, false, size);
        g.drawImage(img, sx - img.L / 2, ROW_H / 2 - img.L / 2, img.L, img.L);
      }
      g.globalAlpha = 1;
    }
    const m = now < pl.moodUntil ? pl.mood : null;
    const panic = empty && pl.alive;
    const jump = m === "cheer" ? Math.abs(Math.sin(t * 10)) * (settings.reduced ? 3 : 8) : 0;
    const jit = panic && !settings.reduced ? Math.sin(t * 50) * 2 : 0;
    const bob = (G.bob || 0) * 5;
    Kit.drawLamb(g, cx + jit, cy + 6 - jump - bob, R2 * 1.25, { scarf: pl.color, t, mood: !pl.alive ? "sleep" : m === "oops" ? "sleep" : panic ? "shock" : "happy" });
    if (m === "oops") for (let side = -1; side <= 1; side += 2) Kit.circle(g, cx + R2 * 0.27 + side * R2 * 0.09, cy + 6 - R2 * 0.26, R2 * 0.09, "#3b3340");
    if (panic) Kit.ellipse(g, cx + R2 * 0.55, cy - R2 * 0.25, R2 * 0.06, R2 * 0.1, 0, "#8fd3ff");
    mark(g, x + 16, y + 16, 12, pl.sym);
    if (pl.special) {
      Kit.circle(g, x + w - 22, y + 22, 17, "rgba(0,0,0,0.3)");
      drawSpecial(g, x + w - 22, y + 23, 9, pl.special, pl.color, pl.lineDir, t);
    }
    if (pl.kind === "ai") {
      g.fillStyle = "rgba(0,0,0,0.45)";
      g.font = "900 12px system-ui";
      g.fillText("AI", x + 10, y + h - 10);
    }
    if (locked) {
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.beginPath();
      g.roundRect(x, y, w, h, 24);
      g.fill();
      g.strokeStyle = "#fff";
      g.lineWidth = 5;
      g.beginPath();
      g.arc(cx, cy, R2 * 0.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ((pl.lockUntil - now) / LOCK_MS));
      g.stroke();
    }
    if (!pl.alive) {
      g.fillStyle = "rgba(0,0,0,0.5)";
      g.beginPath();
      g.roundRect(x, y, w, h, 24);
      g.fill();
      g.fillStyle = "#fff";
      g.font = "900 22px system-ui";
      g.textAlign = "center";
      g.fillText(pl.team !== pl.id && V.outLabel ? V.outLabel : "OUT", cx, cy + 8);
      g.textAlign = "start";
    }
  }

  // The title lamb idles: wiggles, blinks and leans towards your finger.
  function drawTitleLamb(now) {
    const cv = $("title-lamb");
    if (!cv.g) cv.g = Kit.sharp(cv, 220, 130);
    const g = cv.g;
    const t = now / 1000;
    g.clearRect(0, 0, 220, 130);
    if (V.hero) return V.hero(g, t, pointerX);
    g.save();
    g.translate(110, 120);
    g.rotate(Math.sin(t * 2.2) * 0.05 + (pointerX - 0.5) * 0.25);
    g.translate(-110, -120);
    const blink = t % 3.2 < 0.14;
    Kit.drawLamb(g, 110, 66, 100, { t, scarf: V.scarf ?? COLORS[0], mood: blink ? "sleep" : "happy", flip: pointerX < 0.5 });
    g.restore();
  }

  // ---------------- INPUT ----------------
  function onBandDown(e, name) {
    e.preventDefault();
    Audio.unlock();
    if (!G || mode !== "play") return;
    const cv = name === "top" ? topCv : botCv;
    const B = band[name];
    const r = cv.getBoundingClientRect();
    let x = e.clientX - r.left;
    let y = e.clientY - r.top;
    if (name === "top") {
      x = B.w - x;
      y = B.h - y;
    }
    for (let s = 0; s < 4; s++) {
      if (BOTTOM[s] !== (name === "bottom")) continue;
      const pl = seatPlayer[s];
      if (!pl || pl.kind !== "human") continue;
      const R = rects[s];

    { id: "hard", icon: "🔥", name: "Brave flock", desc: "Beat any boss on Hard", test: (c) => c.won && c.G.data.hard },
    { id: "solo", icon: "🦁", name: "Lion-hearted", desc: "Win alone", test: (c) => c.won && c.setup.n === 1 },
    { id: "fast", icon: "⏱️", name: "Swift", desc: "Win in under a minute", test: (c) => c.won && c.G.data.wonAt - c.G.start < 60000 },
    { id: "clean", icon: "🧼", name: "Steady hooves", desc: "Win without a lockout", test: (c) => c.won && c.hs.every((p) => p.wastes === 0) },
    { id: "dmg", icon: "💪", name: "Heavy hitter", desc: "Deal 40 damage in one fight", test: (c) => c.hs.some((p) => p.damage >= 40) },
  ],
  hooks: {
    setup(G, s) {
      const boss = CONFIG.bosses[Math.min(s.boss || 1, unlocked()) - 1];
      const hard = s.diff === "hard";
      const humans = G.players.length - 1;
      const hp = Math.round(boss.hp * CONFIG.hpScale[humans - 1] * (hard ? CONFIG.hard.hp : 1));
      const now = performance.now();
      G.data = {
        boss: CONFIG.bosses.indexOf(boss) + 1, B: boss, hard, hp, max: hp, cells: [...boss.cells], attack: null, nextAttack: now + 4000,
        howlUntil: 0, pups: [], pupAt: now + CONFIG.pupGrowMs, hitAt: 0, angry: false, won: 0, wonAt: 0, last: "",
        revealUntil: 0, tailAt: now + 2500, nextSwap: now + (boss.swapSecs?.[0] ?? 0) * 1000, shieldAt: 0,
      };
      for (const i of G.data.cells) G.b.kind[i] = "wolf";
      G.shadow = G.players.length - 1;
    },
    hud: (G) => hud(G),
    noElimination: true, // a wiped-out flock can always drop back in
    inPath: (G, i) => G.b.kind[i] !== "wolf",
    blocked: (G, i) => G.b.kind[i] === "wolf",
    land(G, b, from, to, who) {
      if (b.kind[to] !== "wolf") return false;
      if (who !== G.shadow) hurt(G, who);
      return true;
    },
    specialHit(G, k, who) {
      if (G.b.kind[k] !== "wolf") return false;
      if (who !== G.shadow) hurt(G, who);
      return true;
    },
    aiValue(G, pl, i) {
      const b = G.b;
      const D = G.data;
      const seen = !D.B.disguise || performance.now() < D.revealUntil || tailOut(G, performance.now());
      const near = Engine.neighbours(b, i);
      const bursts = b.count[i] + 1 >= Engine.capacity(b, i);
      const wolf = seen ? near.filter((k) => b.kind[k] === "wolf").length : 0;
      const pups = near.filter((k) => b.owner[k] === G.shadow).length;
      const warned = D.attack && D.attack.cells.includes(i) ? -6 : 0;
      // build up close to the wolf so chains end on him
      const r = Engine.rowOf(b, i);
      const c = Engine.colOf(b, i);
      const close = seen && D.cells.some((w) => Math.abs(Engine.rowOf(b, w) - r) + Math.abs(Engine.colOf(b, w) - c) <= 2);
      const ours = b.owner[i] === -1 || G.players[b.owner[i]]?.team === 0;
      return wolf * (bursts ? 5 : 1) + pups * (bursts ? 2 : 0) + (close && ours ? 4 : 0) + warned;
    },
    update(G, now) {
      const D = G.data;
      if (D.won) return;
      if (now >= D.pupAt) {
        D.pupAt = now + CONFIG.pupGrowMs;
        D.pups = D.pups.filter((i) => G.b.owner[i] === G.shadow);
        for (const i of D.pups) G.b.count[i]++;
      }
      if (!D.attack && now >= D.nextAttack) warn(G, now);
      if (D.attack && now >= D.attack.at) strike(G, now);
      if (D.howlUntil && now >= D.howlUntil) {
        D.howlUntil = 0;
        for (const pl of G.players) pl.dir = 1;
      }
      if (D.B.disguise && now >= D.nextSwap) swap(G, now);
      if (D.angry) S.Music.setLevel(2); // keeps the phase-2 music after a pause
      if (!D.angry && D.hp <= D.max / 2) {
        // phase 2: a roar, faster attacks, louder music
        D.angry = true;
        S.shout(null, "ROAR!", 1.9, "#ff3d3d");
        S.Sfx.roar();
        S.shake(14);
        S.buzz([120, 60, 120]);
        S.Music.setLevel(2);
        D.nextAttack = Math.min(D.nextAttack, now + 1500);
      }
      hud(G);
    },
    shift(G, d) {
      const D = G.data;
      D.nextAttack += d;
      D.pupAt += d;
      D.nextSwap += d;
      D.tailAt += d;
      if (D.attack) D.attack.at += d;
      if (D.howlUntil) D.howlUntil += d;
      if (D.won) D.won += d;
    },
    endCheck(G, now, left) {
      const D = G.data;
      if (D.won) {
        if (now - D.won < 2200) return null;
        progress.beaten[D.boss - 1] = true;
        if (D.hard) progress.hard[D.boss - 1] = true;
        saveProgress();
        return { team: 0, title: `${D.B.name} ran off!`, sub: D.boss < 3 ? "A new boss is waiting." : "You saved the flock from every wolf.", color: "#ffcf4a" };
      }
      const board = G.b.size - D.cells.length;
      if (S.cellsOf(G.shadow) >= board * CONFIG.shadowLose) return { team: 1, title: "Shadow took the pasture", sub: `${D.B.name} still had ${D.hp} health.`, color: "#b39ad1", sad: true };
      if (left <= 0) return { team: 1, title: "Time's up", sub: `${D.B.name} still had ${D.hp} health.`, color: "#ff8a8a", sad: true };
      return null;
    },
    resultsExtra(G, res, el) {
      const live = G.players.filter((p) => !p.observer);
      const top = Math.max(1, ...live.map((p) => p.damage));
      el.innerHTML = `<div class="dmg">${live.map((p) => `<div><span style="color:${p.color}">${p.name}</span><i style="width:${(100 * p.damage) / top}%;background:${p.color}"></i><span>${p.damage}</span></div>`).join("")}</div>`;
    },
    drawCell: (ctx, G, i) => G.b.kind[i] === "wolf",
    drawOver(ctx, G, c, t, now) {
      const D = G.data;
      const b = G.b;
      if (D.attack && D.attack.cells.length) {
        ctx.fillStyle = `rgba(255,40,40,${0.25 + 0.25 * Math.sin(t * 25)})`;
        for (const k of D.attack.cells) ctx.fillRect(Engine.colOf(b, k) * c, Engine.rowOf(b, k) * c, c, c);
      }
      for (const i of D.pups)
        if (b.owner[i] === G.shadow) {
          ctx.strokeStyle = "#b39ad1";
          ctx.lineWidth = 2;
          ctx.strokeRect(Engine.colOf(b, i) * c + 3, Engine.rowOf(b, i) * c + 3, c - 6, c - 6);
        }
      drawBoss(ctx, G, c, t, now);
      if (D.won) {
        // the lambs celebrate: sheep bounce across the pasture
        const run = Math.min(1, (now - D.won) / 1500);
        for (let k = 0; k < 14; k++) {
          const px = ((k * 0.37 + run * 0.5) % 1) * b.cols * c;
          const py = (0.1 + ((k * 0.61) % 0.8)) * b.rows * c - Math.abs(Math.sin(t * 8 + k)) * c * 0.4;
          Kit.drawSheep(ctx, px, py, c * 0.16, S.COLORS[k % 4], { flip: k % 2 === 1 });
        }
      }
      if (D.howlUntil) {
        ctx.fillStyle = `rgba(180,140,255,${0.12 + 0.08 * Math.sin(t * 12)})`;
        ctx.fillRect(0, 0, b.cols * c, b.rows * c);
      }
    },
  },
});

// ---------- BOSS ----------
const shielded = (G) => G.data.B.shield && G.data.cells.some((w) => Engine.neighbours(G.b, w).some((k) => G.b.owner[k] === G.shadow));
const tailOut = (G, now) => (now - G.data.tailAt) % 4200 < 700;

function hurt(G, who) {
  const D = G.data;
  if (D.won) return;
  const now = performance.now();
  if (shielded(G)) {
    // pups next to the Alpha shield him: clear them first
    if (now - D.shieldAt > 250) {
      D.shieldAt = now;
      S.Audio.tone(1500, 0.06, "square", 0.04, 900);
    }
    return;
  }
  D.hp--;
  D.hitAt = now;
  if (D.B.disguise) D.revealUntil = now + CONFIG.revealMs;
  if (S.isPlayer(who)) G.players[who].damage++;
  S.Sfx.hit(4);
  for (const i of D.cells) S.puff(i, "#c7cad1", 1);
  if (D.hp <= 0) {
    D.hp = 0;
    D.won = now;
    D.wonAt = now;
    D.attack = null;
    for (const pl of G.players) {
      pl.observer = true;
      S.mood(pl, "cheer", 3000);
    }
    hud(G);
    S.shout(null, "Hallelujah!", 1.9, "#ffcf4a");
    S.Sfx.howl();
    S.Sfx.win();
    S.buzz([80, 50, 160]);
    S.Music.stop();
  }
}

function hud(G) {
  const D = G.data;
  const icon = D.attack ? ATTACK_ICON[D.attack.type] : shielded(G) ? "🛡️" : D.B.icon;
  const key = `${D.hp}|${D.angry}|${icon}`;
  if (key === D.last) return;
  D.last = key;
  $("hud").innerHTML = `<span class="icon">${icon}</span><div class="hp${D.angry ? " angry" : ""}"><i style="width:${(100 * Math.max(0, D.hp)) / D.max}%"></i><b>${D.B.name} · ${Math.max(0, D.hp)}</b></div>`;
}

const humansIds = (G) => G.players.filter((p) => p.team === 0).map((p) => p.id);
function around(b, i) {
  const out = [i];
  for (const [dr, dc] of Engine.ALL8) {
    const r = Engine.rowOf(b, i) + dr;
    const c = Engine.colOf(b, i) + dc;
    if (Engine.inside(b, r, c)) out.push(r * b.cols + c);
  }
  return out;
}

// Choose the attack and mark where it will land.
function warn(G, now) {
  const D = G.data;
  const b = G.b;
  const bag = [];
  for (const [k, w] of Object.entries(D.B.attacks)) for (let n = 0; n < w; n++) bag.push(k);
  const type = bag[Math.floor(Math.random() * bag.length)];
  const ids = humansIds(G);
  const mine = (i) => ids.includes(b.owner[i]);
  let cells = [];
  if (type === "swipe") {
    let bestRow = 0;
    let most = -1;
    for (let r = 0; r < b.rows; r++) {
      let n = 0;
      for (let c = 0; c < b.cols; c++) if (mine(r * b.cols + c)) n += b.count[r * b.cols + c];
      if (n > most) [most, bestRow] = [n, r];
    }
    for (let c = 0; c < b.cols; c++) cells.push(bestRow * b.cols + c);
  } else if (type === "stomp") {
    let bestAt = 0;
    let most = -1;
    for (let i = 0; i < b.size; i++) {
      const n = around(b, i).reduce((s, k) => s + (mine(k) ? b.count[k] : 0), 0);
      if (n > most) [most, bestAt] = [n, i];
    }
    cells = around(b, bestAt);
  } else if (type === "pups") {
    const free = [];
    for (let i = 0; i < b.size; i++) if (b.owner[i] === -1 && !b.kind[i]) free.push(i);
    // the Alpha calls his pups to his side
    const nearWolf = (i) => D.cells.some((w) => Engine.neighbours(b, w).includes(i));
    free.sort((a, c) => (D.B.shield ? nearWolf(c) - nearWolf(a) : 0) || Math.random() - 0.5);
    cells = free.slice(0, D.B.pupsPerCall ? D.B.pupsPerCall[D.angry ? 1 : 0] : 2);
  }
  cells = cells.filter((k) => b.kind[k] !== "wolf");
  D.attack = { type, at: now + CONFIG.warnMs, cells };
  S.shout(null, SHOUT[type], 1.5, "#ff6b6b");
  S.Audio.tone(110, 0.5, "sawtooth", 0.06, 70);
}

function strike(G, now) {
  const D = G.data;
  const b = G.b;
  const { type, cells } = D.attack;
  D.attack = null;
  D.nextAttack = now + D.B.attackSecs * 1000 * (D.angry ? CONFIG.angryAttack : 1) * (D.hard ? CONFIG.hard.attack : 1);
  if (type === "howl") {
    D.howlUntil = now + CONFIG.howlMs;
    for (const pl of G.players) pl.dir = -1;
    S.Sfx.howl();
    return;
  }
  if (type === "pups") {
    for (const i of cells) {
      if (b.owner[i] !== -1) continue;
      b.owner[i] = G.shadow;
      b.count[i] = 2;
      D.pups.push(i);
      S.puff(i, SHADOW, 5);
    }
    S.Audio.tone(300, 0.2, "triangle", 0.06, 500);
    return;
  }
  for (const i of cells) {
    if (b.kind[i]) continue;
    b.owner[i] = -1;
    b.count[i] = 0;
    b.tag[i] = null;
    S.puff(i, "#ff6b6b", 2);
  }
  S.shake(type === "stomp" ? 12 : 7);
  S.buzz(type === "stomp" ? 90 : 50);
  S.Audio.tone(90, 0.3, "sawtooth", 0.09, 40);
}

// The Wolf in Sheep's Clothing swaps places with a random square.
function swap(G, now) {
  const D = G.data;
  const b = G.b;
  D.nextSwap = now + D.B.swapSecs[D.angry ? 1 : 0] * 1000;
  const from = D.cells[0];
  const options = [];
  for (let i = 0; i < b.size; i++) if (!b.kind[i] && !b.rock[i]) options.push(i);
  const to = options[Math.floor(Math.random() * options.length)];
  b.owner[from] = b.owner[to];
  b.count[from] = b.count[to];
  b.tag[from] = b.tag[to];
  b.kind[from] = null;
  b.owner[to] = -1;
  b.count[to] = 0;
  b.tag[to] = null;
  b.kind[to] = "wolf";
  D.cells[0] = to;
  S.rebuildPath();
  S.Audio.tone(600, 0.08, "sine", 0.04, 900);
}

function drawBoss(ctx, G, c, t, now) {
  const D = G.data;
  const b = G.b;
  const hit = now - D.hitAt < 150;
  const run = D.won ? Math.min(1, (now - D.won) / 1500) : 0;
  if (D.B.disguise) {
    const i = D.cells[0];
    const x = (Engine.colOf(b, i) + 0.5) * c + run * c * 5;
    const y = (Engine.rowOf(b, i) + 0.5) * c;
    const seen = now < D.revealUntil || D.won;
    if (seen) {
      Kit.drawWolf(ctx, x, y + c * 0.08, c * 0.95, { t, mood: D.won ? "sad" : "happy", color: hit ? "#ffffff" : undefined });
    } else {
      // a sheep like any other... except for the tail
      Kit.drawSheep(ctx, x - c * 0.12, y, c * 0.17, "#ececf2");
      Kit.drawSheep(ctx, x + c * 0.14, y + c * 0.05, c * 0.17, "#ececf2", { flip: true });
      if (tailOut(G, now)) {
        ctx.fillStyle = "#6f7380";
        ctx.beginPath();
        ctx.ellipse(x + c * 0.36, y + c * 0.12, c * 0.12, c * 0.05, -0.6 + Math.sin(t * 14) * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    return;
  }
  const x0 = 3 * c;
  const y0 = 4.22 * c;
  ctx.save();
  if (D.won) ctx.globalAlpha = 1 - run * 0.8;
  Kit.drawWolf(ctx, x0 + run * c * 5, y0 + (D.angry && !S.settings.reduced ? Math.sin(t * 30) * 1.5 : 0), c * 1.9, {
    t, mood: D.won ? "sad" : "happy", color: hit ? "#ffffff" : D.angry ? "#a0707a" : D.B.color,
  });
  ctx.restore();
  if (D.B.shield && !D.won) {
    // the Alpha's mane, and his shield while pups guard him
    ctx.fillStyle = "#ffcf4a";
    ctx.beginPath();
    for (let k = 0; k < 5; k++) ctx.lineTo(x0 - c * 0.4 + k * c * 0.2, y0 - c * (k % 2 ? 0.95 : 1.1));
    ctx.lineTo(x0 + c * 0.4, y0 - c * 0.85);
    ctx.lineTo(x0 - c * 0.4, y0 - c * 0.85);
    ctx.fill();
    if (shielded(G)) {
      ctx.strokeStyle = `rgba(140,200,255,${0.5 + 0.3 * Math.sin(t * 6)})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x0, 4 * c, c * 1.05, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  if (D.angry && !D.won) {
    ctx.strokeStyle = "#2a2530";
    ctx.lineWidth = c * 0.07;
    ctx.beginPath();
    ctx.moveTo(x0 - c * 0.42, y0 - c * 0.38);
    ctx.lineTo(x0 - c * 0.12, y0 - c * 0.26);
    ctx.moveTo(x0 + c * 0.42, y0 - c * 0.38);
    ctx.lineTo(x0 + c * 0.12, y0 - c * 0.26);
    ctx.stroke();
  }
}
</script>
